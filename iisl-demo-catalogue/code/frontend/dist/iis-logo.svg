<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 50">
  <!-- IIS TECHNOLOGY text -->
  <text x="2" y="32" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#E8F0F8" letter-spacing="-1">IIS</text>
  <text x="2" y="46" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#6B8EB5" letter-spacing="3.5">TECHNOLOGY</text>
  <!-- Divider -->
  <line x1="120" y1="8" x2="120" y2="46" stroke="#256092" stroke-width="1" opacity="0.4"/>
  <!-- ISO 9001 Badge -->
  <g transform="translate(132, 4)">
    <rect x="0" y="0" width="80" height="42" rx="4" fill="none" stroke="#256092" stroke-width="1" opacity="0.5"/>
    <text x="40" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#E8F0F8">ISO 9001</text>
    <text x="40" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" fill="#6B8EB5" letter-spacing="1">CERTIFIED</text>
  </g>
</svg>

---
# EDA rulebook: Jira webhook events → AAP job templates
# Jira Automation sends a POST with custom JSON when a Change ticket transitions.
# Payload format: {"issue_key":"CHG-1","status":"Implementing","issue_type":"Change",...}
- name: Jira patch lifecycle handler
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:

    # ── RULE 1: Change ticket moves to "Implementing" → start patch workflow ──
    - name: "Jira | Change ticket implementing - launch patch"
      condition: >
        event.payload.status is defined and
        event.payload.status == "Implementing"

      action:
        run_job_template:
          name: "Hybrid Patch Workflow"
          organization: "IIS Demo Lab"
          job_args:
            extra_vars:
              jira_ticket_id:   "{{ event.payload.issue_key }}"
              target_hosts:     "{{ event.payload.patch_scope | default('windows') }}"
              risk_level:       "{{ event.payload.risk_level | default('Medium') }}"
              dry_run:          false

    # ── RULE 2: Dry-run request (label detected) ──
    - name: "Jira | Dry-run patch check"
      condition: >
        event.payload.status is defined and
        event.payload.status == "Implementing" and
        event.payload.dry_run is defined and
        event.payload.dry_run == "true"

      action:
        run_job_template:
          name: "Hybrid Patch Workflow"
          organization: "IIS Demo Lab"
          job_args:
            extra_vars:
              jira_ticket_id: "{{ event.payload.issue_key }}"
              target_hosts:   "{{ event.payload.patch_scope | default('windows') }}"
              dry_run:        true

    # ── RULE 3: Catch-all – log for audit ──
    - name: "Jira | Unhandled event – log for audit"
      condition: >
        event.payload.issue_key is defined

      action:
        debug:
          msg: >
            Jira event: {{ event.payload.issue_key }}
            status={{ event.payload.status | default('unknown') }}
            type={{ event.payload.issue_type | default('unknown') }}

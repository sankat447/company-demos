---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pd-personas
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/sankat447/company-demos
    targetRevision: feature/police-department-v1
    path: police-department/manifests/personas
    directory:
      include: "pd-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: pd-personas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - ServerSideApply=true
  # Secrets in git are stubs (empty strings); real values are written by
  # bootstrap/01_secrets.sh from AWS SSM. Without these exclusions, selfHeal
  # blanks them on every reconcile.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: pd-aurora-credentials
      namespace: pd-personas
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: pd-portkey-key
      namespace: pd-personas
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: pd-s3-creds
      namespace: pd-personas
      jsonPointers:
        - /data
    # The pd-llm-mode ConfigMaps (one per ns) are flipped at runtime by the
    # chat UI's mode dropdown and by demo operators. Git holds the safe
    # default "mock"; selfHeal must not revert a /api/mode patch.
    - group: ""
      kind: ConfigMap
      name: pd-llm-mode
      namespace: pd-cctv
      jsonPointers:
        - /data
    - group: ""
      kind: ConfigMap
      name: pd-llm-mode
      namespace: pd-personas
      jsonPointers:
        - /data

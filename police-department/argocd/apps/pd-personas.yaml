---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pd-personas
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/sankat447/company-demos
    targetRevision: HEAD
    path: police-department/manifests/personas
    directory:
      include: "pd-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: pd-personas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - ServerSideApply=true

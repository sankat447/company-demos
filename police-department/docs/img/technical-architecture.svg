<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <!-- IIS Tech brand palette: #256092 primary blue, #3d4759 slate, #e32726 accent red -->
  <defs>
    <linearGradient id="hdrG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#256092"/>
      <stop offset="100%" stop-color="#3d4759"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#256092"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e32726"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4759"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#f7f9fc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="78" fill="url(#hdrG)"/>
  <text x="40" y="44" fill="#ffffff" font-size="24" font-weight="700">Police Department · CCTV Video Intelligence</text>
  <text x="40" y="68" fill="#cbd5e1" font-size="14">Technical architecture — components, data flow, and the privacy-aware optional egress</text>
  <text x="1240" y="50" fill="#ffffff" font-size="16" font-weight="700" text-anchor="end">IIS Technology</text>

  <!-- OpenShift cluster boundary -->
  <rect x="60" y="120" width="1010" height="525" rx="14" fill="#ffffff" stroke="#256092" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="80" y="146" fill="#256092" font-size="13" font-weight="700">OpenShift AI Cluster</text>
  <text x="220" y="146" fill="#94a3b8" font-size="12">(KServe · Tekton · Knative · Istio mesh · pgvector)</text>

  <!-- ─── Ingress + Persona service ───────────────────────────────────────── -->
  <g filter="url(#sh)">
    <rect x="90" y="170" width="170" height="80" rx="8" fill="#ffffff" stroke="#3d4759" stroke-width="1.5"/>
    <text x="175" y="195" text-anchor="middle" fill="#3d4759" font-size="12" font-weight="700">OpenShift Route</text>
    <text x="175" y="213" text-anchor="middle" fill="#94a3b8" font-size="10">edge TLS · Istio sidecar</text>
    <text x="175" y="232" text-anchor="middle" fill="#94a3b8" font-size="10">https://pd-persona-…</text>
  </g>
  <g filter="url(#sh)">
    <rect x="290" y="170" width="200" height="80" rx="8" fill="#eef3fa" stroke="#256092" stroke-width="1.5"/>
    <text x="390" y="194" text-anchor="middle" fill="#256092" font-size="13" font-weight="700">Persona Service</text>
    <text x="390" y="212" text-anchor="middle" fill="#3d4759" font-size="11">FastAPI · 4 personas</text>
    <text x="390" y="228" text-anchor="middle" fill="#3d4759" font-size="11">renders chat UI · serves /api/*</text>
    <text x="390" y="244" text-anchor="middle" fill="#94a3b8" font-size="10">pd-personas namespace</text>
  </g>

  <!-- ─── Tekton pipeline (5 parallel + 1 join task) ──────────────────────── -->
  <g filter="url(#sh)">
    <rect x="90" y="285" width="900" height="200" rx="10" fill="#ffffff" stroke="#256092" stroke-width="1.5"/>
    <text x="105" y="307" fill="#256092" font-size="13" font-weight="700">Tekton perception pipeline · pd-cctv namespace · ~2–3 min/clip warm</text>
    <text x="640" y="307" fill="#94a3b8" font-size="11">EFS RWX workspace · 6 GPUs time-sliced from 1 A10G</text>

    <!-- pull-clip -->
    <rect x="105" y="325" width="120" height="55" rx="6" fill="#ffffff" stroke="#3d4759"/>
    <text x="165" y="346" text-anchor="middle" fill="#3d4759" font-size="11" font-weight="700">pull-clip</text>
    <text x="165" y="362" text-anchor="middle" fill="#94a3b8" font-size="10">S3 → EFS</text>
    <text x="165" y="375" text-anchor="middle" fill="#94a3b8" font-size="10">~15s</text>

    <!-- 4 parallel tasks -->
    <rect x="245" y="325" width="150" height="55" rx="6" fill="#ffffff" stroke="#3d4759"/>
    <text x="320" y="343" text-anchor="middle" fill="#3d4759" font-size="11" font-weight="700">vlm-caption</text>
    <text x="320" y="358" text-anchor="middle" fill="#94a3b8" font-size="10">scene narrative</text>
    <text x="320" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">~30–90s</text>

    <rect x="245" y="385" width="150" height="55" rx="6" fill="#ffffff" stroke="#3d4759"/>
    <text x="320" y="403" text-anchor="middle" fill="#3d4759" font-size="11" font-weight="700">whisper-asr</text>
    <text x="320" y="418" text-anchor="middle" fill="#94a3b8" font-size="10">transcript</text>
    <text x="320" y="432" text-anchor="middle" fill="#94a3b8" font-size="10">~30s · CPU</text>

    <rect x="415" y="325" width="150" height="55" rx="6" fill="#ffffff" stroke="#3d4759"/>
    <text x="490" y="343" text-anchor="middle" fill="#3d4759" font-size="11" font-weight="700">yolo-detect</text>
    <text x="490" y="358" text-anchor="middle" fill="#94a3b8" font-size="10">objects</text>
    <text x="490" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">~30–60s · GPU</text>

    <rect x="415" y="385" width="150" height="55" rx="6" fill="#ffffff" stroke="#3d4759"/>
    <text x="490" y="403" text-anchor="middle" fill="#3d4759" font-size="11" font-weight="700">faces-and-plates</text>
    <text x="490" y="418" text-anchor="middle" fill="#94a3b8" font-size="10">YOLOv8-face · easyOCR</text>
    <text x="490" y="432" text-anchor="middle" fill="#94a3b8" font-size="10">~30–120s · GPU</text>

    <!-- structure-and-write join -->
    <rect x="595" y="355" width="180" height="60" rx="6" fill="#eef3fa" stroke="#256092"/>
    <text x="685" y="375" text-anchor="middle" fill="#256092" font-size="11" font-weight="700">structure-and-write</text>
    <text x="685" y="391" text-anchor="middle" fill="#94a3b8" font-size="10">BGE-small embed · pgvector insert</text>
    <text x="685" y="404" text-anchor="middle" fill="#94a3b8" font-size="10">~25s</text>

    <!-- arrows -->
    <line x1="225" y1="352" x2="245" y2="352" stroke="#3d4759" stroke-width="1.5" marker-end="url(#arrS)"/>
    <line x1="225" y1="352" x2="245" y2="412" stroke="#3d4759" stroke-width="1.5" marker-end="url(#arrS)"/>
    <line x1="225" y1="352" x2="415" y2="352" stroke="#3d4759" stroke-width="1.5" marker-end="url(#arrS)"/>
    <line x1="225" y1="352" x2="415" y2="412" stroke="#3d4759" stroke-width="1.5" marker-end="url(#arrS)"/>
    <line x1="565" y1="385" x2="595" y2="385" stroke="#3d4759" stroke-width="1.5" marker-end="url(#arrS)"/>

    <!-- KServe predictor box (used by vlm-caption local mode) -->
    <rect x="800" y="325" width="180" height="60" rx="6" fill="#ffffff" stroke="#256092" stroke-dasharray="3 2"/>
    <text x="890" y="345" text-anchor="middle" fill="#256092" font-size="11" font-weight="700">KServe · vLLM</text>
    <text x="890" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">Qwen-VL 7B on GPU</text>
    <text x="890" y="375" text-anchor="middle" fill="#94a3b8" font-size="10">scale-to-zero</text>
    <line x1="395" y1="343" x2="800" y2="343" stroke="#3d4759" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="600" y="335" font-size="9" fill="#94a3b8">vlm-mode=local: in-cluster call</text>

    <!-- MLflow side -->
    <rect x="800" y="395" width="180" height="55" rx="6" fill="#ffffff" stroke="#3d4759" stroke-dasharray="2 2"/>
    <text x="890" y="415" text-anchor="middle" fill="#3d4759" font-size="11" font-weight="700">MLflow</text>
    <text x="890" y="430" text-anchor="middle" fill="#94a3b8" font-size="10">per-clip bundle.json</text>
    <text x="890" y="443" text-anchor="middle" fill="#94a3b8" font-size="10">experiment tracking</text>
    <line x1="775" y1="395" x2="800" y2="420" stroke="#3d4759" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrS)"/>
  </g>

  <!-- ─── Aurora pgvector ─────────────────────────────────────────────────── -->
  <g filter="url(#sh)">
    <rect x="595" y="510" width="180" height="100" rx="8" fill="#eef3fa" stroke="#256092" stroke-width="1.5"/>
    <text x="685" y="535" text-anchor="middle" fill="#256092" font-size="13" font-weight="700">Aurora · pgvector</text>
    <text x="685" y="555" text-anchor="middle" fill="#3d4759" font-size="10">narrations · entities · events</text>
    <text x="685" y="570" text-anchor="middle" fill="#3d4759" font-size="10">faces · plates · custody_log</text>
    <text x="685" y="588" text-anchor="middle" fill="#94a3b8" font-size="10">RDS · 384-dim BGE embeddings</text>
    <text x="685" y="602" text-anchor="middle" fill="#94a3b8" font-size="10">browse via CloudBeaver</text>
  </g>
  <line x1="685" y1="415" x2="685" y2="510" stroke="#3d4759" stroke-width="1.8" marker-end="url(#arrS)"/>

  <!-- ─── S3 ──────────────────────────────────────────────────────────────── -->
  <g filter="url(#sh)">
    <rect x="90" y="510" width="180" height="100" rx="8" fill="#ffffff" stroke="#3d4759" stroke-width="1.5"/>
    <text x="180" y="535" text-anchor="middle" fill="#3d4759" font-size="13" font-weight="700">S3 (data lake)</text>
    <text x="180" y="555" text-anchor="middle" fill="#3d4759" font-size="10">clips/police-department/</text>
    <text x="180" y="570" text-anchor="middle" fill="#3d4759" font-size="10">processed/police-department/</text>
    <text x="180" y="585" text-anchor="middle" fill="#3d4759" font-size="10">models/police-department/</text>
    <text x="180" y="602" text-anchor="middle" fill="#94a3b8" font-size="10">long-lived IAM, bucket-scoped</text>
  </g>
  <line x1="180" y1="510" x2="180" y2="380" stroke="#3d4759" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrS)"/>
  <text x="195" y="445" font-size="10" fill="#94a3b8">presigned GET</text>
  <text x="195" y="458" font-size="10" fill="#94a3b8">video player</text>

  <!-- HITL queue -->
  <g filter="url(#sh)">
    <rect x="800" y="510" width="180" height="100" rx="8" fill="#ffffff" stroke="#3d4759" stroke-width="1.5"/>
    <text x="890" y="535" text-anchor="middle" fill="#3d4759" font-size="13" font-weight="700">HITL Queue</text>
    <text x="890" y="555" text-anchor="middle" fill="#3d4759" font-size="10">Redis-parked answers</text>
    <text x="890" y="570" text-anchor="middle" fill="#3d4759" font-size="10">human approve / escalate</text>
    <text x="890" y="588" text-anchor="middle" fill="#94a3b8" font-size="10">AFTER INSERT triggers</text>
    <text x="890" y="602" text-anchor="middle" fill="#94a3b8" font-size="10">→ custody_log</text>
  </g>
  <line x1="775" y1="560" x2="800" y2="560" stroke="#3d4759" stroke-width="1.5" marker-end="url(#arrS)"/>

  <!-- ─── External: Anthropic API (optional egress) ───────────────────────── -->
  <g filter="url(#sh)">
    <rect x="1100" y="285" width="160" height="170" rx="10" fill="#fff5f5" stroke="#e32726" stroke-width="2"/>
    <text x="1180" y="312" text-anchor="middle" fill="#e32726" font-size="13" font-weight="700">Anthropic API</text>
    <text x="1180" y="332" text-anchor="middle" fill="#3d4759" font-size="11">Claude Sonnet 4.5</text>
    <text x="1180" y="354" text-anchor="middle" fill="#94a3b8" font-size="10">vlm-caption</text>
    <text x="1180" y="368" text-anchor="middle" fill="#94a3b8" font-size="10">(claude-multimodal)</text>
    <text x="1180" y="386" text-anchor="middle" fill="#94a3b8" font-size="10">Persona /chat</text>
    <text x="1180" y="400" text-anchor="middle" fill="#94a3b8" font-size="10">(text-only)</text>
    <line x1="1110" y1="420" x2="1250" y2="420" stroke="#cbd5e1" stroke-width="1"/>
    <text x="1180" y="438" text-anchor="middle" fill="#e32726" font-size="10">OPTIONAL · operator opt-in</text>
  </g>
  <!-- arrows from cluster to Anthropic (red, dashed) -->
  <line x1="395" y1="350" x2="1100" y2="345" stroke="#e32726" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <text x="700" y="338" font-size="10" fill="#e32726" font-weight="700">vlm-mode=claude-multimodal · 16 frames once at ingest</text>
  <line x1="490" y1="220" x2="1100" y2="380" stroke="#e32726" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <text x="800" y="240" font-size="10" fill="#e32726" font-weight="700">pd-llm-mode=claude · text-only chat reasoning</text>

  <!-- Investigator on the left of the cluster (above Route) -->
  <g filter="url(#sh)">
    <rect x="1100" y="170" width="160" height="80" rx="8" fill="#ffffff" stroke="#3d4759" stroke-width="1.5"/>
    <text x="1180" y="195" text-anchor="middle" fill="#3d4759" font-size="13" font-weight="700">Investigator</text>
    <text x="1180" y="213" text-anchor="middle" fill="#3d4759" font-size="11">browser · video player</text>
    <text x="1180" y="231" text-anchor="middle" fill="#94a3b8" font-size="10">click timestamp → seek</text>
    <text x="1180" y="244" text-anchor="middle" fill="#94a3b8" font-size="10">approve / escalate</text>
  </g>
  <line x1="260" y1="210" x2="290" y2="210" stroke="#3d4759" stroke-width="1.5" marker-end="url(#arrS)"/>
  <line x1="1100" y1="210" x2="490" y2="210" stroke="#3d4759" stroke-width="1.5" marker-end="url(#arrS)"/>

  <!-- Footer -->
  <rect x="0" y="660" width="1280" height="60" fill="#3d4759"/>
  <text x="40" y="685" fill="#ffffff" font-size="12" font-weight="700">Air-gap-friendly default · Anthropic egress only when operator ticks "Deep analysis" on a clip · Frames never re-leave the cluster on chat</text>
  <text x="40" y="705" fill="#cbd5e1" font-size="11">All persistent state in Aurora · S3 · MLflow · long-lived bucket-scoped IAM credentials · GitOps-managed via ArgoCD</text>
  <text x="1240" y="700" fill="#ffffff" font-size="12" font-weight="700" text-anchor="end">www.iistech.com</text>
</svg>

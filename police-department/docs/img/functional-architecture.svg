<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <!-- IIS Tech brand palette: #256092 primary blue, #3d4759 slate -->
  <defs>
    <linearGradient id="hdrG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#256092"/>
      <stop offset="100%" stop-color="#3d4759"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4759"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#f7f9fc"/>

  <!-- Header band -->
  <rect x="0" y="0" width="1280" height="78" fill="url(#hdrG)"/>
  <text x="40" y="44" fill="#ffffff" font-size="24" font-weight="700">Police Department · CCTV Video Intelligence</text>
  <text x="40" y="68" fill="#cbd5e1" font-size="14">Functional architecture — how an operator turns a clip into actionable answers</text>
  <text x="1240" y="50" fill="#ffffff" font-size="16" font-weight="700" text-anchor="end">IIS Technology</text>

  <!-- Stage 1: Operator drops clip -->
  <g filter="url(#sh)">
    <rect x="40" y="180" width="200" height="160" rx="10" fill="#ffffff" stroke="#256092" stroke-width="2"/>
    <text x="140" y="215" text-anchor="middle" fill="#256092" font-size="14" font-weight="700">1 · OPERATOR</text>
    <text x="140" y="248" text-anchor="middle" fill="#3d4759" font-size="13">Drag &amp; drop CCTV clip</text>
    <text x="140" y="268" text-anchor="middle" fill="#3d4759" font-size="13">(.mp4, up to 300 MB)</text>
    <text x="140" y="305" text-anchor="middle" fill="#94a3b8" font-size="11">No training required</text>
  </g>
  <!-- Camera glyph -->
  <g transform="translate(110,128)">
    <rect x="0" y="0" width="60" height="36" rx="4" fill="#256092"/>
    <circle cx="42" cy="18" r="10" fill="#ffffff"/>
    <circle cx="42" cy="18" r="5" fill="#256092"/>
    <rect x="-8" y="6" width="8" height="24" fill="#256092"/>
  </g>

  <line x1="240" y1="260" x2="290" y2="260" stroke="#3d4759" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Stage 2: Perception pipeline -->
  <g filter="url(#sh)">
    <rect x="290" y="160" width="280" height="220" rx="10" fill="#ffffff" stroke="#256092" stroke-width="2"/>
    <text x="430" y="190" text-anchor="middle" fill="#256092" font-size="14" font-weight="700">2 · PERCEPTION PIPELINE</text>
    <text x="430" y="210" text-anchor="middle" fill="#94a3b8" font-size="11">runs in parallel ~2–3 minutes</text>
    <g font-size="12" fill="#3d4759">
      <rect x="306" y="226" width="248" height="22" rx="4" fill="#eef3fa"/>
      <text x="316" y="241">▸ vlm-caption  · scene narrative</text>
      <rect x="306" y="252" width="248" height="22" rx="4" fill="#eef3fa"/>
      <text x="316" y="267">▸ whisper-asr  · audio transcript</text>
      <rect x="306" y="278" width="248" height="22" rx="4" fill="#eef3fa"/>
      <text x="316" y="293">▸ yolo-detect  · objects &amp; persons</text>
      <rect x="306" y="304" width="248" height="22" rx="4" fill="#eef3fa"/>
      <text x="316" y="319">▸ faces-and-plates  · biometric &amp; OCR</text>
      <rect x="306" y="330" width="248" height="22" rx="4" fill="#eef3fa"/>
      <text x="316" y="345">▸ structure-and-write  · embed &amp; index</text>
    </g>
  </g>

  <line x1="570" y1="260" x2="640" y2="260" stroke="#3d4759" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Stage 3: Knowledge base -->
  <g filter="url(#sh)">
    <rect x="640" y="200" width="220" height="140" rx="10" fill="#ffffff" stroke="#256092" stroke-width="2"/>
    <text x="750" y="232" text-anchor="middle" fill="#256092" font-size="14" font-weight="700">3 · KNOWLEDGE BASE</text>
    <text x="750" y="262" text-anchor="middle" fill="#3d4759" font-size="12">Aurora pgvector</text>
    <text x="750" y="282" text-anchor="middle" fill="#3d4759" font-size="12">narrations · entities · events</text>
    <text x="750" y="302" text-anchor="middle" fill="#3d4759" font-size="12">faces · plates · custody log</text>
    <text x="750" y="322" text-anchor="middle" fill="#94a3b8" font-size="11">384-dim BGE embeddings</text>
  </g>
  <!-- DB cylinder glyph -->
  <g transform="translate(720,142)">
    <ellipse cx="30" cy="8" rx="30" ry="8" fill="#256092"/>
    <rect x="0" y="8" width="60" height="34" fill="#256092"/>
    <ellipse cx="30" cy="42" rx="30" ry="8" fill="#1e4d77"/>
  </g>

  <line x1="860" y1="270" x2="920" y2="270" stroke="#3d4759" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Stage 4: Personas -->
  <g filter="url(#sh)">
    <rect x="920" y="180" width="320" height="200" rx="10" fill="#ffffff" stroke="#256092" stroke-width="2"/>
    <text x="1080" y="210" text-anchor="middle" fill="#256092" font-size="14" font-weight="700">4 · ASK IN PLAIN ENGLISH</text>
    <text x="1080" y="230" text-anchor="middle" fill="#94a3b8" font-size="11">four personas, one Aurora index</text>
    <g font-size="12" fill="#3d4759">
      <rect x="936" y="246" width="290" height="22" rx="4" fill="#eef3fa"/>
      <text x="946" y="261">▸ Journalist — narrative for the public</text>
      <rect x="936" y="272" width="290" height="22" rx="4" fill="#eef3fa"/>
      <text x="946" y="287">▸ Detective — investigative read</text>
      <rect x="936" y="298" width="290" height="22" rx="4" fill="#eef3fa"/>
      <text x="946" y="313">▸ Patrol — tactical situation report</text>
      <rect x="936" y="324" width="290" height="22" rx="4" fill="#eef3fa"/>
      <text x="946" y="339">▸ Evidence Clerk — chain-of-custody</text>
    </g>
    <text x="1080" y="368" text-anchor="middle" fill="#94a3b8" font-size="11">click any timestamp · video seeks instantly</text>
  </g>

  <!-- Stage 5: Investigator (HITL) row -->
  <g filter="url(#sh)">
    <rect x="40" y="430" width="1200" height="160" rx="10" fill="#ffffff" stroke="#3d4759" stroke-width="2"/>
    <text x="640" y="465" text-anchor="middle" fill="#3d4759" font-size="14" font-weight="700">5 · HUMAN-IN-THE-LOOP REVIEW</text>
    <line x1="60" y1="478" x2="1220" y2="478" stroke="#cbd5e1" stroke-width="1"/>
    <g font-size="13" fill="#3d4759">
      <text x="80" y="505" font-weight="700">Investigator sees</text>
      <text x="80" y="525">▸ video player loaded above the chat (presigned S3 URL, 5-min TTL)</text>
      <text x="80" y="545">▸ Markdown answers with vehicle make, suspect descriptions, action timeline</text>
      <text x="80" y="565">▸ Cyan timestamp pills — click `0:09` or `8.5s` and the video seeks &amp; plays</text>
      <text x="640" y="505" font-weight="700">Approve or escalate</text>
      <text x="640" y="525">▸ Every persona answer is "Pending" until a human approves it (HITL queue)</text>
      <text x="640" y="545">▸ Approved findings flow back to Aurora as `claims` with confidence scores</text>
      <text x="640" y="565">▸ Chain-of-custody log records every read, write, and approval automatically</text>
    </g>
  </g>

  <!-- Footer -->
  <rect x="0" y="650" width="1280" height="70" fill="#3d4759"/>
  <text x="40" y="685" fill="#ffffff" font-size="13" font-weight="700">Drop a clip · ask in plain English · click any timestamp to jump in the video</text>
  <text x="40" y="705" fill="#cbd5e1" font-size="11">Built on Red Hat OpenShift AI · Tekton · KServe · Aurora pgvector</text>
  <text x="1240" y="695" fill="#ffffff" font-size="12" font-weight="700" text-anchor="end">www.iistech.com</text>
</svg>

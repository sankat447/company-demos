# =============================================================================
#  Aurora credentials Secret for the demo
#
#  IMPORTANT — lesson 17.12 (2026-05-21):
#  We declare ONLY the namespace/name/labels/annotations + the deterministic
#  fields `database` and `username`. We deliberately OMIT `endpoint` and
#  `password` from this manifest. They are stamped out-of-band by
#  scripts/provision_and_build_police_department_demo.sh step 4 via
#  `oc apply --server-side --force-conflicts`, which gives those two fields
#  a different field-manager and lets them coexist with this base.
#
#  Earlier versions of this manifest set `stringData.endpoint: ""` and
#  `stringData.password: ""` "to satisfy ArgoCD" — that turned every
#  ArgoCD reconcile into a silent password-blanking event, which caused
#  the pd-aurora-init PostSync hook Job to fail with `connection to
#  server on socket "/var/run/postgresql/.s.PGSQL.5432" failed` because
#  PGHOST was empty.
#
#  The provision script's `upsert` helper also stamps
#  `argocd.argoproj.io/sync-options: Prune=false` on the live Secret so
#  this manifest going missing won't prune the live one.
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: pd-aurora-credentials
  namespace: pd-cctv
  labels:
    app.kubernetes.io/part-of: police-department
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  database: rhoai_demo
  username: rhoai_admin

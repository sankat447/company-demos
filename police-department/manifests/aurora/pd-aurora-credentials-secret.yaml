# =============================================================================
#  Aurora credentials Secret for the demo
#  Populated by bootstrap/01_secrets.sh from env vars (or copied from the
#  platform's `aurora-credentials` Secret in ai-demo namespace). Empty in git.
#  ArgoCD selfHeal will not blow this away because we declare data fields as
#  empty strings here and the bootstrap script writes real values via
#  `oc create secret ... --dry-run=client -o yaml | oc apply -f -` which
#  ServerSideApply merges with this base.
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: pd-aurora-credentials
  namespace: pd-cctv
  labels:
    app.kubernetes.io/part-of: police-department
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  endpoint: ""
  database: rhoai_demo
  username: rhoai_admin
  password: ""

# =============================================================================
#  pd-qwen25-vl-7b InferenceService — Qwen2.5-VL 7B on the shared T4 GPU.
#
#  Mirrors ai-demo-stack-aws/gitops/config/inference/llama-inferenceservice.yaml
#  for serverless, scale-to-zero, GPU tolerations, nodeSelector, and sidecar
#  injection. Differences:
#    - namespace: pd-cctv (runtime: vllm-runtime resolves in-namespace)
#    - storageUri points at the police-department prefix in the data lake
#
#  GPU MUTEX (read this carefully):
#    Both this service and llama-3-1-8b request nvidia.com/gpu: 1, and the GPU
#    MachineSet has maxReplicas: 1 (single g4dn.xlarge in the cluster).
#    Knative scale-to-zero (minReplicas: 0, scaleMetric: concurrency,
#    scaleTarget: 1) ensures each pod is gone after ~60s idle. The two
#    services must NEVER both be Ready simultaneously — this is enforced by
#    scheduling at the cluster level (only 1 GPU node) and surfaced by the
#    PrometheusRule pd-gpu-mutex.
#
#  WHY minReplicas: 1 (not 0):
#    The cluster has no ClusterAutoscaler controller deployed (only inert
#    MachineAutoscaler CRs). Knative's "scale from zero" therefore can't pull
#    a GPU node up on demand — the predictor pod sits Pending forever and
#    the caller (vlm-caption Tekton task) gets ECONNRESET from the Knative
#    activator after ~30s.
#    Pinning minReplicas: 1 keeps a warm predictor while the demo runs;
#    99_teardown.sh scales the GPU MachineSet back to 0 (annotation-gated)
#    so we don't leave a g4dn.xlarge running. If/when ClusterAutoscaler
#    lands, this can revert to minReplicas: 0 for the proper time-share
#    behaviour with llama-3-1-8b.
# =============================================================================
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: pd-qwen25-vl-7b
  namespace: pd-cctv
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: police-department
    pd.cctv/gpu-mutex-group: "t4-shared"
  annotations:
    serving.kserve.io/deploymentMode: Serverless
    serving.knative.openshift.io/enablePassthrough: "true"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/rewriteAppHTTPProbers: "true"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    scaleTarget: 1
    scaleMetric: concurrency
    model:
      modelFormat:
        name: vllm
      runtime: vllm-runtime
      # Pulled by bootstrap/02_fetch_models.sh from HuggingFace into S3.
      storageUri: s3://ai-demo-data-lake/models/police-department/qwen2.5-vl-7b
      resources:
        # Right-sized for g4dn.xlarge (~12.2 Gi allocatable, ~100m CPU free
        # after GPU operator daemonsets eat ~3400m of 3500m allocatable).
        # See note in ../pd-vllm-vlm-runtime.yaml.
        requests:
          cpu: "50m"
          memory: "4Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "11Gi"
          nvidia.com/gpu: "1"
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/gpu
      operator: Exists
      effect: NoSchedule
    nodeSelector:
      nvidia.com/gpu.present: "true"

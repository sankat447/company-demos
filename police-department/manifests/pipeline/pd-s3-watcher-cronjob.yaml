# =============================================================================
#  pd-s3-watcher CronJob — replaces the spec's AWS Lambda S3-events bridge.
#
#  Every 60 seconds:
#    1. List s3://ai-demo-data-lake/clips/police-department/
#    2. For each key NOT in the dedupe ConfigMap (pd-s3-watcher-cursor.seen_keys),
#       generate a UUID and POST {clip_s3_uri, clip_id, uploaded_by} to the
#       in-cluster EventListener (http://el-pd-perception.pd-cctv.svc:8080)
#    3. After a successful POST, append the key to seen_keys
#
#  Why this and not a Lambda? The Lambda would require AWS write privileges
#  (Terraform apply, IAM role, EventBridge rule). The platform repo cannot
#  be modified, and adding AWS infrastructure outside the platform repo
#  introduces drift risk. An in-cluster CronJob keeps the demo entirely
#  inside the cluster's GitOps boundary.
#
#  Trade-off: 60s polling cadence vs sub-second push. Acceptable for a demo;
#  see terraform/README.md for the optional Lambda upgrade path.
# =============================================================================
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pd-s3-watcher
  namespace: pd-cctv
  labels:
    app.kubernetes.io/part-of: police-department
spec:
  schedule: "* * * * *"          # every minute
  concurrencyPolicy: Forbid       # never run two watchers in parallel
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: police-department
            app.kubernetes.io/component: s3-watcher
        spec:
          serviceAccountName: pd-s3-watcher-sa
          restartPolicy: OnFailure
          containers:
          - name: watcher
            image: registry.access.redhat.com/ubi9/python-311:latest
            env:
            - name: BUCKET
              value: "ai-demo-data-lake"
            - name: PREFIX
              value: "clips/police-department/"
            - name: EL_URL
              value: "http://el-pd-perception.pd-cctv.svc.cluster.local:8080/"
            - name: NAMESPACE
              value: "pd-cctv"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pd-s3-creds
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pd-s3-creds
                  key: secret_access_key
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: pd-s3-creds
                  key: region
                  optional: true
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -euo pipefail
              pip install --quiet --no-cache-dir boto3==1.35.40 kubernetes==31.0.0
              python3 - <<'PY'
              import json, os, sys, uuid, urllib.request, urllib.error
              import boto3
              from kubernetes import client, config
              config.load_incluster_config()
              core = client.CoreV1Api()
              ns  = os.environ["NAMESPACE"]
              cm  = core.read_namespaced_config_map("pd-s3-watcher-cursor", ns)
              seen = set((cm.data.get("seen_keys") or "").splitlines())
              s3 = boto3.client("s3", region_name=os.environ.get("AWS_REGION", "us-east-1"))
              bucket = os.environ["BUCKET"]
              prefix = os.environ["PREFIX"]
              keys = []
              token = None
              while True:
                  kw = {"Bucket": bucket, "Prefix": prefix}
                  if token:
                      kw["ContinuationToken"] = token
                  resp = s3.list_objects_v2(**kw)
                  for o in resp.get("Contents", []):
                      k = o["Key"]
                      if k.endswith("/"):
                          continue
                      if k in seen:
                          continue
                      keys.append(k)
                  if not resp.get("IsTruncated"):
                      break
                  token = resp.get("NextContinuationToken")
              if not keys:
                  print("[pd-s3-watcher] no new clips")
                  sys.exit(0)
              new_seen = list(seen)
              for k in keys:
                  payload = {
                      "clip_s3_uri": f"s3://{bucket}/{k}",
                      "clip_id":     str(uuid.uuid4()),
                      "uploaded_by": "s3-watcher",
                  }
                  data = json.dumps(payload).encode("utf-8")
                  req = urllib.request.Request(
                      os.environ["EL_URL"],
                      data=data,
                      headers={"Content-Type": "application/json",
                               "Ce-Type": "pd.s3.clip.uploaded.v1"},
                      method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=15) as r:
                          body = r.read().decode("utf-8", "replace")
                          print(f"[pd-s3-watcher] POSTed {k}: {r.status} {body[:200]}")
                          new_seen.append(k)
                  except urllib.error.HTTPError as e:
                      print(f"[pd-s3-watcher] FAILED {k}: HTTP {e.code} {e.read().decode('utf-8','replace')[:200]}",
                            file=sys.stderr)
                      raise
              # Persist the cursor
              from datetime import datetime, timezone
              cm.data = {
                  "seen_keys": "\n".join(sorted(set(new_seen))),
                  "last_run_iso": datetime.now(timezone.utc).isoformat(),
              }
              core.patch_namespaced_config_map("pd-s3-watcher-cursor", ns, cm)
              print(f"[pd-s3-watcher] cursor updated; total keys seen: {len(set(new_seen))}")
              PY
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "200m"
                memory: "256Mi"

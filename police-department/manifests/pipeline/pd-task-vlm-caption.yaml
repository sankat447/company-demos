# =============================================================================
#  Task — vlm-caption (mode-switchable: local Qwen-VL vs Anthropic Claude)
#
#  Two passes on the clip:
#    1. extract-keyframes (ffmpeg) — sample N frames, scale to W px, JPEG.
#       N and W come from pd-vlm-mode ConfigMap (or per-PipelineRun override).
#    2. caption (Python) — base64-encode the frames, dispatch:
#         mode=local              -> POST to in-cluster Qwen-VL InferenceService
#                                    (cluster-internal Knative Route, no egress).
#         mode=claude-multimodal  -> POST to api.anthropic.com Messages API with
#                                    a forensic system prompt. The frames go
#                                    out only at this single ingestion-time
#                                    call; chat-time persona reasoning never
#                                    re-sends them.
#
#  Output (both modes): caption.json wrapped in OpenAI chat-completion shape so
#  the downstream structure-and-write task doesn't care which model produced
#  the narrative. The inner content is the same {prose, entities, events,
#  claims} JSON.
#
#  Mode resolution priority:
#    1. PipelineRun param vlm-mode-override (set by per-upload UI checkbox).
#    2. /etc/pd-vlm-mode/mode (ConfigMap default; flipped via UI dropdown
#       or `oc patch cm pd-vlm-mode --type=merge -p '{"data":{"mode":...}}'`).
#    3. "local".
#
#  GPU MUTEX (read this carefully):
#    Both this service and llama-3-1-8b request nvidia.com/gpu: 1 (in local
#    mode), and the GPU MachineSet has maxReplicas: 1. claude-multimodal mode
#    needs no GPU at all — vlm-caption pod runs on any worker with internet.
# =============================================================================
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pd-task-vlm-caption
  namespace: pd-cctv
  labels:
    app.kubernetes.io/part-of: police-department
spec:
  params:
  - name: clip-id
    type: string
  - name: vlm-mode-override
    type: string
    default: ""
    description: |
      "" (default) -> read mode from /etc/pd-vlm-mode/mode ConfigMap.
      "local" -> force local Qwen-VL.
      "claude-multimodal" -> force Anthropic Claude multimodal.
      Set by the upload UI's "Deep analysis" checkbox per clip.
  - name: frames-override
    type: string
    default: ""
    description: |
      Override the keyframe count from ConfigMap. Empty = use CM default
      (16 for claude-multimodal, capped to 4 for local). Must be ≤ 30
      (Anthropic Messages API has a 100-image hard cap; we keep margin).
  workspaces:
  - name: shared
  steps:
  - name: extract-keyframes
    image: docker.io/jrottenberg/ffmpeg:6.1-alpine
    volumeMounts:
    - name: vlm-mode-cm
      mountPath: /etc/pd-vlm-mode
      readOnly: true
    script: |
      #!/bin/sh
      set -eu
      cd "$(workspaces.shared.path)/$(params.clip-id)"

      # Effective mode: param override > ConfigMap > "local".
      MODE="$(params.vlm-mode-override)"
      [ -z "$MODE" ] && MODE="$(cat /etc/pd-vlm-mode/mode 2>/dev/null || echo local)"

      # Effective frames + resolution + jpeg quality.
      F_OVERRIDE="$(params.frames-override)"
      F_CM="$(cat /etc/pd-vlm-mode/frames 2>/dev/null || echo 16)"
      RES_CM="$(cat /etc/pd-vlm-mode/resolution 2>/dev/null || echo 1280)"
      JPEG_CM="$(cat /etc/pd-vlm-mode/jpeg_quality 2>/dev/null || echo 2)"

      # Clear stale keyframes — the shared workspace is RWX EFS and persists
      # across PipelineRuns. If a previous run extracted N=60 and we now
      # extract N=24, the old frame_025..060.jpg would remain and the caption
      # step's glob picks up too many.
      rm -rf frames
      mkdir -p frames

      duration=$(ffprobe -v error -show_entries format=duration \
                  -of default=noprint_wrappers=1:nokey=1 clip.mp4 | awk '{printf "%d", $1}')
      [ "$duration" -lt 1 ] && duration=1

      # ── Forensic sampling density (lesson 17.36) ──────────────────────────
      # The old fixed 16-frame sampling could not see transient events. A
      # ~10-second assault window inside a 90-second clip is completely
      # invisible to a model that only sees a frame every 6 seconds.
      #
      # New policy for claude-multimodal: target 1 frame every 2.5s, with a
      # floor of 24 frames (short-clip minimum coverage) and a cap of 60
      # (well under Sonnet's ~100-image-per-request ceiling; keeps a single
      # request under ~100k input tokens). For local Qwen-VL: keep the
      # vLLM-imposed 4-frame limit as before.
      if [ -n "$F_OVERRIDE" ]; then
        # Explicit param override wins over everything
        FRAMES="$F_OVERRIDE"
        step=$(awk -v d=$duration -v n=$FRAMES 'BEGIN{s=d/n; if(s<0.1)s=0.1; printf "%.3f", s}')
        echo "[extract-keyframes] mode=$MODE · explicit override: FRAMES=${FRAMES} · step=${step}s"
      elif [ "$MODE" = "claude-multimodal" ]; then
        # Dynamic — 1 frame per ~2.5s, floor 24, ceiling 60
        FRAMES=$(awk -v d=$duration 'BEGIN{n=int(d/2.5+0.5); if(n<24)n=24; if(n>60)n=60; print n}')
        step=$(awk -v d=$duration -v n=$FRAMES 'BEGIN{s=d/n; if(s<0.1)s=0.1; printf "%.3f", s}')
        echo "[extract-keyframes] mode=claude-multimodal · forensic dynamic: dur=${duration}s → ${FRAMES} frames · step=${step}s (~1 frame per ${step}s)"
      else
        # local mode — Qwen-VL has --limit-mm-per-prompt=4
        FRAMES="$F_CM"
        [ "$FRAMES" -gt 4 ] 2>/dev/null && FRAMES=4
        step=$(( duration / FRAMES ))
        [ "$step" -lt 1 ] && step=1
        echo "[extract-keyframes] mode=local · frames=${FRAMES} (vLLM cap) · dur=${duration}s · step=${step}s"
      fi
      echo "[extract-keyframes] res=${RES_CM} jpeg_q=${JPEG_CM}"

      ffmpeg -hide_banner -loglevel error -i clip.mp4 \
             -vf "fps=1/${step},scale=${RES_CM}:-1" \
             -frames:v "$FRAMES" \
             -q:v "$JPEG_CM" \
             frames/frame_%03d.jpg
      ls frames/ | wc -l | xargs -I{} echo "[extract-keyframes] extracted {} frame files"
      # Stash the resolved mode + frame count + clip duration + step for the
      # caption step (env vars don't survive across Tekton steps; workspace
      # files do).
      printf '%s\n' "$MODE" > .vlm-mode
      printf '%s\n' "$FRAMES" > .vlm-frames
      printf '%s\n' "$duration" > .clip-duration-sec
      printf '%s\n' "$step" > .clip-frame-step-sec

  - name: caption
    image: registry.access.redhat.com/ubi9/python-311:latest
    env:
    # Local Qwen-VL endpoint (Knative Route, OpenShift Router → activator → vLLM).
    - name: VLM_ENDPOINT
      value: "https://pd-qwen25-vl-7b-predictor-pd-cctv.apps.ai-demo.iisdemolab.click/v1/chat/completions"
    - name: VLM_MODEL
      value: "pd-qwen25-vl-7b"
    # Anthropic API for claude-multimodal mode.
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: pd-anthropic-key
          key: api_key
          optional: true
    - name: ANTHROPIC_MODEL
      value: "claude-sonnet-4-5"
    volumeMounts:
    - name: vlm-mode-cm
      mountPath: /etc/pd-vlm-mode
      readOnly: true
    script: |
      #!/usr/bin/env python3
      import base64, json, os, sys, glob, subprocess, urllib.request, urllib.error, ssl

      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      frames_dir = f"{workspace}/{clip_id}/frames"
      out_path  = f"{workspace}/{clip_id}/caption.json"
      mode_path = f"{workspace}/{clip_id}/.vlm-mode"
      dur_path  = f"{workspace}/{clip_id}/.clip-duration-sec"
      step_path = f"{workspace}/{clip_id}/.clip-frame-step-sec"
      try:
          mode = open(mode_path).read().strip()
      except FileNotFoundError:
          mode = "local"
      try:
          duration_sec = int(open(dur_path).read().strip())
      except (FileNotFoundError, ValueError):
          duration_sec = 0
      try:
          frame_step_sec = float(open(step_path).read().strip())
      except (FileNotFoundError, ValueError):
          frame_step_sec = 0.0

      # ── Install Pillow at runtime (UBI9 python-311 has no PIL preinstalled) ─
      # We use it to compute pixel-derived TRUSTED SIGNALS that the VLM cannot
      # hallucinate: mean luminance for day/night classification, inter-frame
      # motion score for hotspot detection. ~1s install; ~3MB wheel.
      try:
          from PIL import Image, ImageChops  # noqa
      except ImportError:
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--quiet",
               "--disable-pip-version-check", "Pillow"],
          )
          from PIL import Image, ImageChops

      frame_paths = sorted(glob.glob(f"{frames_dir}/*.jpg"))
      images_b64 = []
      for fp in frame_paths:
          with open(fp, "rb") as f:
              images_b64.append(base64.b64encode(f.read()).decode("ascii"))
      print(f"[caption] mode={mode} frames={len(images_b64)} duration={duration_sec}s step={frame_step_sec}s")

      # ── TRUSTED SIGNALS pre-pass (lesson 17.36) ─────────────────────────────
      # Compute what pixels actually say, so the VLM can't invent contradictory
      # metadata like "daylight" over a night clip.
      per_frame_luminance = []
      motion_scores = []
      prev_img = None
      for fp in frame_paths:
          img = Image.open(fp).convert("L")            # grayscale, 0–255
          w, h = img.size
          mean_lum = sum(img.getdata()) / (w * h)
          per_frame_luminance.append(round(mean_lum, 1))
          # Downscale for fast motion score
          small = img.resize((160, 90))
          if prev_img is not None:
              diff = ImageChops.difference(small, prev_img)
              motion_scores.append(round(sum(diff.getdata()) / (160 * 90), 2))
          prev_img = small

      avg_lum = sum(per_frame_luminance) / len(per_frame_luminance) if per_frame_luminance else 0
      # Thresholds tuned on typical CCTV: <60 is clearly night (canopy lighting or
      # dim streetlight); >130 is clearly day; in between = ambiguous / dusk.
      if avg_lum < 60:
          lighting_class = "NIGHT"
      elif avg_lum > 130:
          lighting_class = "DAY"
      else:
          lighting_class = "AMBIGUOUS"

      # Top motion hotspots — the frames where visual change is most concentrated.
      # These are where transient events (running, falling, weapon-drawing) live.
      hotspot_ranked = sorted(enumerate(motion_scores), key=lambda x: -x[1])[:5]
      hotspot_frames = sorted(idx + 2 for idx, _ in hotspot_ranked)   # +2: motion is diff between frame N-1 and N
      hotspot_times  = sorted(round((idx - 1) * frame_step_sec, 1) for idx, _ in hotspot_ranked) if frame_step_sec else []

      trusted_signals = {
          "clip_duration_sec": duration_sec,
          "frame_count": len(frame_paths),
          "frame_step_sec": frame_step_sec,
          "mean_luminance_0_255": round(avg_lum, 1),
          "lighting_class": lighting_class,
          "per_frame_luminance": per_frame_luminance,
          "top_motion_hotspot_frames_1indexed": hotspot_frames,
          "top_motion_hotspot_timestamps_sec": hotspot_times,
      }
      print(f"[caption] TRUSTED SIGNALS lighting={lighting_class} avg_lum={avg_lum:.1f} "
            f"hotspots={hotspot_frames}")

      _ctx = ssl.create_default_context()
      _ctx.check_hostname = False
      _ctx.verify_mode = ssl.CERT_NONE

      # ── Forensic system prompt (used by both modes) ─────────────────
      # Asks for the same JSON shape so structure-and-write doesn't care.
      # Claude's reasoning is much richer over this prompt; Qwen-VL 7B
      # ignores most of the analytical asks and produces a generic
      # description, which is fine — the prompt floor doesn't hurt it.
      SYSTEM_PROMPT = (
          "You are a senior forensic CCTV analyst writing an investigative "
          "post-incident report for a homicide/robbery detective. The user is "
          "supplying you with chronologically ordered keyframes (frame_001 = clip "
          "start, each subsequent frame is evenly spaced through the clip duration).\n\n"

          "════════════════════════════════════════════════════════════════════\n"
          "TRUSTED SIGNALS PROTOCOL (highest-priority rule — read first):\n"
          "The FIRST section of the USER message is `## TRUSTED SIGNALS` — a JSON "
          "block containing metadata computed DIRECTLY FROM THE PIXEL DATA by a "
          "separate pre-pass (not by any model). It includes clip duration, frame "
          "count, mean luminance on a 0–255 scale, a lighting classification "
          "(`NIGHT` / `AMBIGUOUS` / `DAY`), per-frame luminance array, and the "
          "top-5 motion-hotspot frame indices + timestamps (frames where visual "
          "change between adjacent samples is highest — these are the frames MOST "
          "LIKELY to contain transient events such as running, falling, "
          "weapon-drawing, or scuffles). Treat this block as GROUND TRUTH:\n\n"
          "  - If the TRUSTED SIGNALS say `lighting_class: NIGHT`, your narration "
          "    MUST describe the scene as night. Do NOT use words like 'daylight', "
          "    'daytime', 'sunny afternoon', 'midday'. Say 'night', 'after dark', "
          "    'canopy-lit', 'illuminated by station lights', etc. Luminance is "
          "    computed from actual pixel values — it is not open to interpretation.\n"
          "  - The motion-hotspot frames are where INCIDENTS most likely happen. "
          "    LOOK AT THESE FRAMES CAREFULLY. If subjects are running, prone, "
          "    arm-extended, falling, gathering around a downed person, or moving "
          "    with unusual urgency in those frames, that is the incident window. "
          "    Do not write 'no incident occurred' if a motion hotspot exists AND "
          "    the visual evidence at that frame shows dynamic body postures.\n"
          "  - `clip_duration_sec` is authoritative for your Timeline coverage. If "
          "    your Timeline stops before duration_sec, you have MISSED the tail "
          "    of the clip — go back and analyze the last frames.\n\n"
          "If ANY claim in your prose contradicts the TRUSTED SIGNALS, you MUST "
          "either (a) revise your claim to match the signals, or (b) add an "
          "explicit `## Sanity Note` section at the top of the prose explaining "
          "why you believe the signals are wrong (this is unusual and should be "
          "rare — pixel-derived signals are more reliable than model interpretation).\n"
          "════════════════════════════════════════════════════════════════════\n\n"

          "Think like a detective. You are not writing a caption — you are writing "
          "the FIRST-PASS INVESTIGATIVE READ that the case officer will use to open "
          "a lead file, request adjacent camera feeds, and brief the shift.\n\n"
          "Produce a STRICT JSON object with EXACTLY these keys, no preamble, no "
          "code fence, no extra text:\n"
          "  {\n"
          "    \"summary\": \"<one short sentence, ≤22 words, LEADING WITH THE CRIME PATTERN if any is present. Examples: 'Coordinated smash-and-grab: 4 masked subjects load a burgundy Jeep Grand Cherokee at a parking-lot loading dock.' / 'Firearm brandished at 0:14s during argument between two subjects outside convenience store.' / 'Routine pedestrian traffic through transit stairwell — no incident.'>\",\n"
          "    \"prose\": \"<markdown narrative — see 8-section structure below>\",\n"
          "    \"entities\": [{\"kind\": \"vehicle|person|weapon|object\", \"label\": \"<descriptor>\"}, ...],\n"
          "    \"events\": [{\"action\": \"<verb phrase>\", \"t_start_sec\": <float>, \"t_end_sec\": <float>, \"confidence\": <0..1>}, ...]\n"
          "  }\n\n"
          "PROSE STRUCTURE (markdown, in EXACTLY this order — write every section, "
          "even if brief; if a section has no observable content, write "
          "'Not visible in the supplied frames.'):\n\n"

          "## Modus Operandi\n"
          "- The operating pattern of the incident in 2–4 sentences. Name the "
          "  crime class if identifiable (smash-and-grab, package theft, strong-arm "
          "  robbery, aggravated assault, stalking, breaking-and-entering, "
          "  auto theft, drug transaction, arson, brandishing, etc.).\n"
          "- Describe the choreography: who does what, who provides lookout, "
          "  who drives, who carries. If there's clear tradecraft (masks pre-donned, "
          "  cameras avoided, radio-check gestures, coordinated egress), call it out.\n"
          "- If this appears to be a rehearsed / repeat MO (multiple prior incidents "
          "  of this signature could exist), say 'consistent with a repeat MO' and "
          "  briefly justify.\n\n"

          "## Weapons & Threats\n"
          "- Every visible weapon or plausible weapon: handgun, long-gun, knife, bat, "
          "  crowbar, taser, pepper-spray, improvised weapon (brick, bottle), etc.\n"
          "- For each: **type** (handgun / rifle / knife / blunt-impact / other), "
          "  **who is holding it** (suspect #), **state** (holstered / concealed-imprint / "
          "  drawn-low-ready / drawn-aimed / discharged), and the **clip-relative timestamp** "
          "  they first appear.\n"
          "- If a subject is **printing** (visible bulge in waistband/pocket consistent with "
          "  a firearm) but no gun is visible, say so explicitly — mark as *inferred*.\n"
          "- If no weapons visible, write 'None visible in the supplied frames.'\n\n"

          "## Vehicle(s)\n"
          "- One paragraph per distinct vehicle: make, model, generation/year if "
          "  recognisable; color; condition; plate (quote any visible characters even if "
          "  partial, note US-state colour band if identifiable); distinctive markings, "
          "  bumper stickers, damage, aftermarket wheels, tinted windows.\n"
          "- Where it is parked, whether the engine is running (exhaust visible? "
          "  brake lights on?), whether doors/liftgate are open.\n\n"

          "## Suspects / People\n"
          "- A markdown table with columns: # | Clothing | Build | Face-covered? | Role.\n"
          "  One row per distinguishable person. Note masks / hoods / balaclavas explicitly.\n"
          "  Role examples: 'ringleader (directs others)', 'lookout (stays at doorway, "
          "  scans street)', 'driver (stays with vehicle)', 'carrier (loads items)', "
          "  'victim', 'bystander', 'unknown'.\n"
          "- Never assert named identity; describe only what is visible. Never infer "
          "  race / religion / gender beyond what is plainly and unambiguously visible.\n\n"

          "## Body Language & Coordination\n"
          "- Group dynamics: who leads / who defers, physical hierarchy signals "
          "  (positioning, gestures directed at others, verbal-appearing exchanges).\n"
          "- Tension indicators: rushed movement, glances at cameras or approaching "
          "  vehicles, hand-in-waistband, checking behind repeatedly, huddled/tight "
          "  formation vs relaxed/spread.\n"
          "- Coordination indicators: synchronised approach, one hands off to another, "
          "  clear signals or nods, roles switching (driver becomes carrier, etc.).\n"
          "- Victim body language if applicable: hands raised, backing away, complying, "
          "  resisting, non-visible/turned away.\n\n"

          "## Behavioral Patterns & Movement\n"
          "- Catalogue every distinctive movement or concealment behavior with a "
          "  clip-relative timestamp and the subject #. Detective-grade specificity "
          "  is required — do NOT summarise as 'moving around'. Examples of what to "
          "  call out:\n"
          "    * **Running** (full sprint, jogging, running-with-a-limp) — direction, "
          "      duration, urgency inferred from stride length + arm swing\n"
          "    * **Hiding** (crouching behind a vehicle, ducking into bushes / doorway "
          "      / dumpster / stairwell, going prone, pressing flat against a wall)\n"
          "    * **Jumping** (fence-hop, wall-vault, hood-jumping over parked car, "
          "      leaping between rooftops, dropping from a ledge)\n"
          "    * **Climbing** (fence, wall, drainpipe, window frame, tree)\n"
          "    * **Crawling / low-crawl** (military-style, hands-and-knees, belly-crawl)\n"
          "    * **Evasive maneuvering** (weaving between cars, doubling back, "
          "      sudden direction change, splitting from the group)\n"
          "    * **Look-out posture** (stationary at a corner, head-on-a-swivel, "
          "      hands cupped over eyes / around ear)\n"
          "    * **Surveillance / counter-surveillance** (deliberately walking past "
          "      target twice, taking photos on phone, casing an entrance)\n"
          "    * **Aggression cues** (bladed stance, chest-puffing, shove, striking "
          "      motion, choking gesture)\n"
          "    * **Compliance/submission** (hands raised, kneeling, curling into "
          "      protective posture, hands-behind-head)\n"
          "    * **Concealment gestures** (adjusting waistband, tucking something into "
          "      jacket, pulling hood forward, adjusting face covering)\n"
          "    * **Loitering** (stationary >20s in an unusual location, no clear purpose)\n"
          "- For each pattern, include: **subject #**, **behavior name**, **start–end "
          "  timestamps (clip-relative s)**, **direction / target if applicable**, and "
          "  a **detective-relevant interpretation** in one clause (e.g. 'consistent "
          "  with evading pursuit', 'suggests he expected someone at that door', "
          "  'reads as pre-arranged rendezvous').\n"
          "- If nothing behaviorally notable occurs, write 'Only routine ambulation "
          "  visible; no evasive, aggressive, or concealment behavior detected.'\n\n"

          "## What Happened — Timeline\n"
          "- Beat-by-beat chronological narrative across the keyframes. **All timestamps "
          "  must be CLIP-RELATIVE seconds with the `s` suffix** — e.g. '0.0s', '8.5s', "
          "  '64s'. These are the only format the UI turns into clickable seek-pills. "
          "  IF the video has a camera-overlay wall-clock (e.g. '10:40:40 AM' burned in), "
          "  you MAY mention it in plain prose as context — but ONLY along with the "
          "  clip-relative time, like 'at 8.5s (10:40:48 on the camera overlay)'. Never "
          "  use a bare wall-clock timestamp as your primary marker, and never use "
          "  `m:ss` or `hh:mm:ss` formats as anchors.\n"
          "- For each keyframe / notable change: **who is where** (position in scene), "
          "  **what tool or object is in whose hand**, **direction of movement**, "
          "  **speed / posture** (calm walk vs urgent run vs crouched approach). "
          "  Detective-grade granularity — not 'a person walks by' but 'subject #2 "
          "  advances from left, crouched, right hand near waistband, scanning the "
          "  doorway'.\n\n"

          "## Evidence Items & Forensic Markers\n"
          "- Every physical item visible in the final frames or dropped during the "
          "  incident that has evidentiary value: discarded clothing, tools, "
          "  vehicle parts, bags, weapons, casings, blood/stain patterns, broken "
          "  glass, footprints in snow/mud. For each: **where** (frame coordinate "
          "  as clock position or 'near the doorway'), **approx. timestamp** it "
          "  appeared, and **why it matters** (e.g. 'crowbar left at scene → "
          "  fingerprint / DNA opportunity').\n"
          "- Anything a crime-scene tech should preserve.\n\n"

          "## Forensic Conclusion\n"
          "- A short, hard-nosed detective-and-forensic-analyst synthesis in 4–7 "
          "  sentences that ties together MO + weapons + body language + behavioral "
          "  patterns + physical evidence into a coherent read of the incident.\n"
          "- Answer three specific questions in this order:\n"
          "    (a) **What most likely happened, from the perspective of a "
          "        homicide/robbery detective who has worked hundreds of these "
          "        scenes?** State it plainly, then flag the uncertainty. Example: "
          "        'This is a rehearsed 3-person smash-and-grab targeting the coffee "
          "        shop's back door, planned for cover-of-storm. Subject #1 is the "
          "        ringleader, #2 the driver-lookout, #3 the grabber. Confidence "
          "        moderate-to-high — the coordination is too tight for opportunists.'\n"
          "    (b) **What does the forensic-analyst read of the scene point to that "
          "        the detective might miss?** Focus on physical evidence + "
          "        micro-behaviors + timing. Example: 'The 4.2-second delay between "
          "        the vehicle arriving and Subject #3 approaching the door is "
          "        consistent with waiting for an internal cue — possibly a phone "
          "        signal, more likely an inside accomplice killing the alarm. "
          "        Look for a fourth subject not visible in this clip.'\n"
          "    (c) **What is the single most important thing to preserve, cross-"
          "        reference, or investigate NEXT to break this case open?** One "
          "        specific, actionable item.\n"
          "- Use hedging language for any inference. Distinguish observation from "
          "  reasoning throughout. Never write a conclusion this section can't "
          "  defend from the frames.\n\n"

          "## Investigative Angles\n"
          "- 3–6 bullets: leads the case officer should pursue. Examples:\n"
          "  - 'Request the two adjacent-block camera feeds for 30 seconds either side "
          "     of clip start — subjects arrive from off-frame; direction of approach "
          "     could put them on a covered feed.'\n"
          "  - 'The Jeep's rear plate at 1:04s is legible; run through NCIC + local "
          "     hot-list.'\n"
          "  - 'Body language + tools suggest professional crew; cross-reference open "
          "     files for similar smash-and-grabs in the district over prior 90 days.'\n"
          "  - 'The audio track (if any) may capture verbal cues / accents / names — "
          "     have the Whisper transcript reviewed for tradecraft language.'\n"
          "  - 'Suspect #3's distinctive black-and-white camouflage jacket is a "
          "     high-value identifier; canvass local retail CCTV within 6 hours "
          "     before / after.'\n\n"

          "HARD RULES:\n"
          "- Never invent named identities. Never infer protected attributes beyond "
          "  what is plainly visible.\n"
          "- Distinguish *observed* (visible in the supplied frames) from *inferred* "
          "  (your professional reasoning). Inferences use hedging language "
          "  ('consistent with', 'appears to be', 'likely', 'would suggest'). Never "
          "  present an inference as observation.\n"
          "- If a section has no observable content, write 'Not visible in the supplied frames.' "
          "  Do not pad, do not invent.\n"
          "- Never recommend arrest / detention / pursuit — that is Patrol's job. This "
          "  report is investigative substrate, not operational orders.\n"
          "- claims[] (separate from prose) is for chat-time grounding — list 6-12 "
          "  short factual claims the persona service can quote, each with a confidence "
          "  (0..1) and a frame_refs list of clip-relative timestamps. Prioritise "
          "  claims about weapons, MO, coordination cues, and physical evidence.\n"
          "- entities[] should include weapons as their own kind (kind='weapon') — "
          "  this is how downstream slash commands surface them.\n"
      )

      # The events array drives the Aurora pd_cctv.events table; the
      # entities array drives pd_cctv.entities; both feed downstream chat
      # context. claims[] is consumed by the persona service only.
      #
      # USER_TEXT now leads with a `## TRUSTED SIGNALS` JSON block that the
      # SYSTEM PROMPT has trained the model to treat as ground truth. This is
      # the defense against the day/night-hallucination class of failure —
      # the model cannot invent lighting that contradicts computed luminance.
      USER_TEXT = (
          "## TRUSTED SIGNALS (pixel-derived — DO NOT contradict)\n"
          f"```json\n{json.dumps(trusted_signals, indent=2)}\n```\n\n"
          f"Clip {clip_id}. {len(images_b64)} keyframes follow in chronological order. "
          f"Frame N is sampled at approximately (N-1) × {trusted_signals['frame_step_sec']}s "
          f"into the clip. Clip runs from 0s to ~{trusted_signals['clip_duration_sec']}s — "
          f"your Timeline section MUST cover the full duration.\n\n"
          "The motion-hotspot frames above are where transient events are most "
          "likely (running, falling, weapon-drawing, altercations). Look at those "
          "frames with extra scrutiny — do NOT summarize them as 'routine' unless "
          "you can defend that from the visual evidence.\n\n"
          "Produce the JSON-only forensic narration as instructed by the SYSTEM prompt."
      )

      def _do_local_qwen():
          # OpenAI-compat chat-completion against in-cluster Qwen-VL.
          payload = {
              "model": os.environ["VLM_MODEL"],
              "max_tokens": 4096,
              "temperature": 0.2,
              "messages": [
                  {"role": "system", "content": SYSTEM_PROMPT},
                  {"role": "user", "content":
                      [{"type": "text", "text": USER_TEXT}] +
                      [{"type": "image_url",
                        "image_url": {"url": f"data:image/jpeg;base64,{b}"}}
                       for b in images_b64],
                  },
              ],
          }
          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              os.environ["VLM_ENDPOINT"],
              data=data,
              headers={"content-type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=300, context=_ctx) as resp:
              return json.loads(resp.read())

      def _do_claude_multimodal():
          # Anthropic Messages API. Wrap the response back into an
          # OpenAI-compat shape so structure-and-write doesn't branch.
          api_key = os.environ.get("ANTHROPIC_API_KEY", "")
          if not api_key:
              raise RuntimeError("claude-multimodal mode requires "
                                 "ANTHROPIC_API_KEY (Secret pd-anthropic-key)")
          content = [{"type": "text", "text": USER_TEXT}]
          for b in images_b64:
              content.append({
                  "type": "image",
                  "source": {"type": "base64",
                             "media_type": "image/jpeg",
                             "data": b},
              })
          payload = {
              "model": os.environ.get("ANTHROPIC_MODEL", "claude-sonnet-4-5"),
              # Bumped from 4096 → 16000 (lesson 17.36): the enhanced 8-section
              # forensic prose + a Forensic Conclusion + Investigative Angles
              # cannot fit under 4k tokens for a dense clip. Claude Sonnet 4.5
              # supports up to 64k output tokens; 16k gives room for a full
              # report while keeping cost predictable.
              "max_tokens": 16000,
              "temperature": 0.2,
              "system": SYSTEM_PROMPT,
              "messages": [{"role": "user", "content": content}],
          }
          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(payload).encode(),
              headers={
                  "content-type": "application/json",
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=300, context=_ctx) as resp:
              ant = json.loads(resp.read())
          text = "".join(b.get("text", "") for b in ant.get("content", [])
                         if b.get("type") == "text")
          # Wrap in OpenAI chat-completion shape so structure-and-write
          # parses it identically to the Qwen-VL response.
          return {
              "id": ant.get("id"),
              "model": ant.get("model"),
              "choices": [{"index": 0,
                           "message": {"role": "assistant", "content": text}}],
              "usage": ant.get("usage"),
              "_pd_source": "anthropic-multimodal",
          }

      try:
          if mode == "claude-multimodal":
              result = _do_claude_multimodal()
          else:
              result = _do_local_qwen()
      except urllib.error.HTTPError as e:
          body = e.read().decode("utf-8", "replace") if hasattr(e, "read") else str(e)
          print(f"[caption] HTTP {e.code}: {body}", file=sys.stderr)
          raise

      # ── Post-response hallucination guard (lesson 17.36) ───────────────────
      # The model was told the TRUSTED SIGNALS are ground truth. Verify: if
      # lighting_class = NIGHT and the narration still contains day-terms,
      # something's off. Either (a) the model contradicted the signals — we
      # inject a SANITY WARNING that will appear in the persona UI + at the
      # top of any Detective reply, and set a metadata flag routing the clip
      # to human review; or (b) the model correctly used night-terms and the
      # check is a no-op.
      import re as _re
      def _extract_prose(res):
          try:
              text = res["choices"][0]["message"]["content"]
              # Try structured JSON first
              m = _re.search(r"\{[\s\S]*\}", text)
              if m:
                  parsed = json.loads(m.group(0))
                  return parsed, text
          except Exception:
              pass
          return None, text if isinstance(text, str) else ""

      parsed, raw_text = _extract_prose(result)
      prose = ""
      if isinstance(parsed, dict):
          prose = (parsed.get("prose") or "").lower()
      elif isinstance(raw_text, str):
          prose = raw_text.lower()

      day_terms   = ["daylight", "daytime", "midday", "sunny afternoon", "broad daylight", "sunny day"]
      night_terms = ["night", "after dark", "canopy light", "canopy-lit", "streetlight",
                     "illuminated by", "dark scene", "evening", "dusk"]
      claims_day   = any(t in prose for t in day_terms)
      claims_night = any(t in prose for t in night_terms)

      sanity_flags = []
      if lighting_class == "NIGHT" and claims_day and not claims_night:
          sanity_flags.append(
              f"Model claimed daytime lighting while pixel-derived luminance "
              f"({avg_lum:.1f}/255) indicates NIGHT — probable narrative hallucination."
          )
      if lighting_class == "DAY" and claims_night and not claims_day:
          sanity_flags.append(
              f"Model claimed night lighting while pixel-derived luminance "
              f"({avg_lum:.1f}/255) indicates DAY — check narrative."
          )
      # Timeline-coverage check: does the model's Timeline reach at least 80%
      # of clip duration? Look for the maximum `<n>s` reference in the prose.
      if duration_sec > 10:
          timestamps = [float(m.group(1)) for m in _re.finditer(r"(\d+(?:\.\d+)?)\s*s\b", prose)]
          max_ts = max(timestamps) if timestamps else 0
          if max_ts < 0.8 * duration_sec:
              sanity_flags.append(
                  f"Timeline max timestamp is {max_ts:.1f}s but clip runs to "
                  f"{duration_sec}s — model may have missed the tail "
                  f"(where transient events often live)."
              )

      if sanity_flags and isinstance(parsed, dict):
          warning_md = (
              "> ⚠ **SANITY WARNING — human review recommended**  \n"
              + "\n".join(f"> • {f}" for f in sanity_flags)
              + "\n\n"
          )
          parsed["prose"] = warning_md + (parsed.get("prose") or "")
          parsed["_sanity_flags"] = sanity_flags
          parsed["_trusted_signals"] = trusted_signals
          # Re-wrap the corrected JSON back into the OpenAI shape so
          # structure-and-write picks up the annotated prose.
          result["choices"][0]["message"]["content"] = json.dumps(parsed)
          print(f"[caption] SANITY FLAGS raised: {sanity_flags}", file=sys.stderr)
      elif isinstance(parsed, dict):
          # No flags — still attach the trusted signals so persona can reference
          parsed["_trusted_signals"] = trusted_signals
          result["choices"][0]["message"]["content"] = json.dumps(parsed)

      with open(out_path, "w") as f:
          json.dump(result, f)
      print(f"[caption] wrote {out_path} ({os.path.getsize(out_path)} bytes) "
            f"lighting={lighting_class} flags={len(sanity_flags)}")
    computeResources:
      requests:
        cpu: "100m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  volumes:
  - name: vlm-mode-cm
    configMap:
      name: pd-vlm-mode
      optional: true

# =============================================================================
#  Task — vlm-caption (mode-switchable: local Qwen-VL vs Anthropic Claude)
#
#  Two passes on the clip:
#    1. extract-keyframes (ffmpeg) — sample N frames, scale to W px, JPEG.
#       N and W come from pd-vlm-mode ConfigMap (or per-PipelineRun override).
#    2. caption (Python) — base64-encode the frames, dispatch:
#         mode=local              -> POST to in-cluster Qwen-VL InferenceService
#                                    (cluster-internal Knative Route, no egress).
#         mode=claude-multimodal  -> POST to api.anthropic.com Messages API with
#                                    a forensic system prompt. The frames go
#                                    out only at this single ingestion-time
#                                    call; chat-time persona reasoning never
#                                    re-sends them.
#
#  Output (both modes): caption.json wrapped in OpenAI chat-completion shape so
#  the downstream structure-and-write task doesn't care which model produced
#  the narrative. The inner content is the same {prose, entities, events,
#  claims} JSON.
#
#  Mode resolution priority:
#    1. PipelineRun param vlm-mode-override (set by per-upload UI checkbox).
#    2. /etc/pd-vlm-mode/mode (ConfigMap default; flipped via UI dropdown
#       or `oc patch cm pd-vlm-mode --type=merge -p '{"data":{"mode":...}}'`).
#    3. "local".
#
#  GPU MUTEX (read this carefully):
#    Both this service and llama-3-1-8b request nvidia.com/gpu: 1 (in local
#    mode), and the GPU MachineSet has maxReplicas: 1. claude-multimodal mode
#    needs no GPU at all — vlm-caption pod runs on any worker with internet.
# =============================================================================
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pd-task-vlm-caption
  namespace: pd-cctv
  labels:
    app.kubernetes.io/part-of: police-department
spec:
  params:
  - name: clip-id
    type: string
  - name: vlm-mode-override
    type: string
    default: ""
    description: |
      "" (default) -> read mode from /etc/pd-vlm-mode/mode ConfigMap.
      "local" -> force local Qwen-VL.
      "claude-multimodal" -> force Anthropic Claude multimodal.
      Set by the upload UI's "Deep analysis" checkbox per clip.
  - name: frames-override
    type: string
    default: ""
    description: |
      Override the keyframe count from ConfigMap. Empty = use CM default
      (16 for claude-multimodal, capped to 4 for local). Must be ≤ 30
      (Anthropic Messages API has a 100-image hard cap; we keep margin).
  workspaces:
  - name: shared
  steps:
  - name: extract-keyframes
    image: docker.io/jrottenberg/ffmpeg:6.1-alpine
    volumeMounts:
    - name: vlm-mode-cm
      mountPath: /etc/pd-vlm-mode
      readOnly: true
    script: |
      #!/bin/sh
      set -eu
      cd "$(workspaces.shared.path)/$(params.clip-id)"

      MODE="$(params.vlm-mode-override)"
      [ -z "$MODE" ] && MODE="$(cat /etc/pd-vlm-mode/mode 2>/dev/null || echo local)"

      F_OVERRIDE="$(params.frames-override)"
      F_CM="$(cat /etc/pd-vlm-mode/frames 2>/dev/null || echo 16)"
      RES_CM="$(cat /etc/pd-vlm-mode/resolution 2>/dev/null || echo 1280)"
      JPEG_CM="$(cat /etc/pd-vlm-mode/jpeg_quality 2>/dev/null || echo 2)"

      rm -rf frames
      mkdir -p frames

      duration=$(ffprobe -v error -show_entries format=duration \
                  -of default=noprint_wrappers=1:nokey=1 clip.mp4 | awk '{printf "%d", $1}')
      [ "$duration" -lt 1 ] && duration=1

      RES_FORENSIC=1600
      JPEG_FORENSIC=1

      if [ -n "$F_OVERRIDE" ]; then
        FRAMES="$F_OVERRIDE"
        step=$(awk -v d=$duration -v n=$FRAMES 'BEGIN{s=d/n; if(s<0.1)s=0.1; printf "%.3f", s}')
        echo "[extract-keyframes] mode=$MODE · explicit override: FRAMES=${FRAMES} · step=${step}s · single window"
        ffmpeg -hide_banner -loglevel error -i clip.mp4 \
               -vf "fps=1/${step},scale=${RES_CM}:-1" \
               -frames:v "$FRAMES" \
               -q:v "$JPEG_CM" \
               frames/window1_%03d.jpg
        printf '1\n' > .num-windows
        printf '%s\n' "$duration" > .window-durations
      elif [ "$MODE" = "claude-multimodal" ]; then
        K=$(awk -v d=$duration 'BEGIN{k=int(d/25+0.5); if(k<3)k=3; if(k>6)k=6; print k}')
        FPW=$(awk -v k=$K 'BEGIN{n=int(60/k); if(n<10)n=10; if(n>20)n=20; print n}')
        WIN_DUR=$(awk -v d=$duration -v k=$K 'BEGIN{printf "%.3f", d/k}')
        STEP=$(awk -v w=$WIN_DUR -v n=$FPW 'BEGIN{s=w/n; if(s<0.1)s=0.1; printf "%.3f", s}')
        FRAMES=$(( K * FPW ))
        echo "[extract-keyframes] mode=claude-multimodal · chunked-window forensic:"
        echo "  dur=${duration}s → K=${K} windows · window_duration=${WIN_DUR}s · frames_per_window=${FPW} · total=${FRAMES} · step_within=${STEP}s"
        echo "  res=${RES_FORENSIC} jpeg_q=${JPEG_FORENSIC} (bumped from ${RES_CM}/${JPEG_CM} for far-field detail)"

        for i in $(seq 1 $K); do
          START=$(awk -v i=$i -v w=$WIN_DUR 'BEGIN{printf "%.3f", (i-1)*w}')
          ffmpeg -hide_banner -loglevel error \
                 -ss "$START" -t "$WIN_DUR" -i clip.mp4 \
                 -vf "fps=1/${STEP},scale=${RES_FORENSIC}:-1" \
                 -frames:v "$FPW" \
                 -q:v "$JPEG_FORENSIC" \
                 "frames/window${i}_%03d.jpg"
        done
        printf '%s\n' "$K" > .num-windows
        printf '%s\n' "$WIN_DUR" > .window-durations
      else
        FRAMES="$F_CM"
        [ "$FRAMES" -gt 4 ] 2>/dev/null && FRAMES=4
        step=$(( duration / FRAMES ))
        [ "$step" -lt 1 ] && step=1
        echo "[extract-keyframes] mode=local · frames=${FRAMES} (vLLM cap) · dur=${duration}s · step=${step}s"
        ffmpeg -hide_banner -loglevel error -i clip.mp4 \
               -vf "fps=1/${step},scale=${RES_CM}:-1" \
               -frames:v "$FRAMES" \
               -q:v "$JPEG_CM" \
               frames/window1_%03d.jpg
        printf '1\n' > .num-windows
        printf '%s\n' "$duration" > .window-durations
      fi

      TOTAL=$(ls frames/ 2>/dev/null | wc -l | tr -d ' ')
      echo "[extract-keyframes] extracted ${TOTAL} frame files across $(cat .num-windows) window(s)"
      printf '%s\n' "$MODE" > .vlm-mode
      printf '%s\n' "$TOTAL" > .vlm-frames
      printf '%s\n' "$duration" > .clip-duration-sec
      printf '%s\n' "${step:-${STEP:-0}}" > .clip-frame-step-sec

  # Phase 1: YOLOv8n + ByteTrack persistent person tracking on the raw
  # video at ~8fps effective. Emits .tracks.json (per-track_id trajectory)
  # + dense_frames/ (640-wide JPEGs for downstream phases) +
  # .object-signals.json (backwards-compat person counts).
  - name: object-detect
    image: registry.access.redhat.com/ubi9/python-311:latest
    computeResources:
      limits: { nvidia.com/gpu: "1" }
    script: |
      #!/usr/bin/env python3
      import os, sys, json, subprocess, traceback

      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      clip_dir = f"{workspace}/{clip_id}"
      video_path = f"{clip_dir}/clip.mp4"
      dense_dir = f"{clip_dir}/dense_frames"
      signals_path = f"{clip_dir}/.object-signals.json"
      tracks_path  = f"{clip_dir}/.tracks.json"
      cache_dir  = f"{workspace}/.ultralytics-cache"
      weights_path = f"{cache_dir}/yolov8n.pt"

      def _bail(reason):
          for p in (signals_path, tracks_path):
              try:
                  with open(p, "w") as f:
                      json.dump({"available": False, "reason": reason}, f)
              except Exception:
                  pass
          print(f"[object-detect] skipped — {reason}", flush=True)
          sys.exit(0)

      if not os.path.exists(video_path):
          _bail(f"video not found at {video_path}")

      try:
          import ultralytics  # noqa
      except ImportError:
          print("[object-detect] installing ultralytics + torch (headless cv2) — ~60-90s first time...", flush=True)
          try:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet",
                   "--disable-pip-version-check",
                   # CUDA wheels (default PyPI); GPU auto-detected
                   "opencv-python-headless", "ultralytics"],
                  timeout=600,
              )
              subprocess.call(
                  [sys.executable, "-m", "pip", "uninstall", "-y",
                   "--disable-pip-version-check", "opencv-python"],
              )
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet",
                   "--disable-pip-version-check",
                   "--force-reinstall", "opencv-python-headless"],
                  timeout=180,
              )
          except subprocess.CalledProcessError as e:
              _bail(f"ultralytics install failed: {e}")
          except subprocess.TimeoutExpired:
              _bail("ultralytics install timed out (>10min)")

      try:
          os.makedirs(cache_dir, exist_ok=True)
          os.makedirs(dense_dir, exist_ok=True)
          os.environ["YOLO_CONFIG_DIR"] = cache_dir
          import cv2
          from ultralytics import YOLO
          model = YOLO(weights_path if os.path.exists(weights_path) else "yolov8n.pt")
      except Exception as e:
          _bail(f"model load failed: {type(e).__name__}: {e}")

      try:
          cap = cv2.VideoCapture(video_path)
          src_fps = cap.get(cv2.CAP_PROP_FPS) or 30.0
          src_frame_count = int(cap.get(cv2.CAP_PROP_FRAME_COUNT) or 0)
          cap.release()
      except Exception:
          src_fps = 30.0
          src_frame_count = 0
      if src_fps < 1:
          src_fps = 30.0
      TARGET_FPS = 8.0
      vid_stride = max(1, int(round(src_fps / TARGET_FPS)))
      effective_fps = src_fps / vid_stride
      print(f"[object-detect] video src_fps={src_fps:.1f} src_frames={src_frame_count} "
            f"vid_stride={vid_stride} effective_fps={effective_fps:.2f}", flush=True)

      for old in os.listdir(dense_dir):
          if old.startswith("f_") and old.endswith(".jpg"):
              try: os.remove(os.path.join(dense_dir, old))
              except OSError: pass

      try:
          num_windows = int(open(f"{clip_dir}/.num-windows").read().strip())
          window_dur = float(open(f"{clip_dir}/.window-durations").read().strip())
      except Exception:
          num_windows, window_dur = 1, 60.0
      try:
          duration_sec = int(open(f"{clip_dir}/.clip-duration-sec").read().strip())
      except Exception:
          duration_sec = int(num_windows * window_dur)

      CONF = 0.4
      IMGSZ = 640
      SAVE_W = 640   # width of saved dense_frame JPEGs

      tracks = {}
      persons_per_frame = []
      per_window_max = {str(w): 0 for w in range(1, num_windows + 1)}
      frame_count = 0

      try:
          stream = model.track(
              source=video_path, tracker="bytetrack.yaml",
              classes=[0], conf=CONF, imgsz=IMGSZ,
              vid_stride=vid_stride, stream=True,
              persist=True, save=False, verbose=False,
          )
          src_w_native = None  # captured on first frame
          scale_to_dense = 1.0
          dense_w = None
          dense_h = None
          for frame_idx, res in enumerate(stream):
              frame_count = frame_idx + 1
              sec = round(frame_idx * vid_stride / src_fps, 3)
              if res.orig_img is not None:
                  h, w = res.orig_img.shape[:2]
                  if src_w_native is None:
                      src_w_native = w
                      if w > SAVE_W:
                          scale_to_dense = SAVE_W / float(w)
                          dense_w = SAVE_W
                          dense_h = int(round(h * scale_to_dense))
                      else:
                          scale_to_dense = 1.0
                          dense_w, dense_h = w, h
                  if w > SAVE_W:
                      new_h = int(h * SAVE_W / w)
                      img_out = cv2.resize(res.orig_img, (SAVE_W, new_h))
                  else:
                      img_out = res.orig_img
                  cv2.imwrite(
                      f"{dense_dir}/f_{frame_idx:06d}.jpg",
                      img_out, [int(cv2.IMWRITE_JPEG_QUALITY), 85],
                  )
              ids = boxes = confs = None
              if res.boxes is not None and res.boxes.id is not None:
                  ids = res.boxes.id.int().cpu().tolist()
                  boxes = res.boxes.xyxy.cpu().tolist()
                  confs = res.boxes.conf.cpu().tolist()
              n = len(ids) if ids else 0
              persons_per_frame.append(n)
              if ids:
                  for tid, bx, cf in zip(ids, boxes, confs):
                      bx_dense = [round(x * scale_to_dense, 1) for x in bx]
                      tracks.setdefault(str(tid), []).append({
                          "frame_idx": frame_idx,
                          "sec": sec,
                          "bbox": bx_dense,
                          "conf": round(float(cf), 3),
                      })
              w2 = min(int(sec / window_dur) + 1, num_windows) if window_dur > 0 else 1
              key = str(w2)
              per_window_max[key] = max(per_window_max.get(key, 0), n)
      except Exception as e:
          traceback.print_exc()
          _bail(f"tracking failed: {type(e).__name__}: {e}")

      tracks_meta = {}
      for tid, dets in tracks.items():
          firsts, lasts = dets[0], dets[-1]
          confs = [d["conf"] for d in dets]
          tracks_meta[tid] = {
              "track_id": int(tid),
              "first_frame_idx": firsts["frame_idx"],
              "last_frame_idx":  lasts["frame_idx"],
              "first_sec": firsts["sec"],
              "last_sec":  lasts["sec"],
              "duration_sec": round(lasts["sec"] - firsts["sec"], 2),
              "num_detections": len(dets),
              "mean_confidence": round(sum(confs)/len(confs), 3),
              "first_bbox": firsts["bbox"],
              "last_bbox":  lasts["bbox"],
              "detections": dets,
          }

      MIN_DETS, MIN_DUR = 3, 0.4
      stable_tracks = {
          tid: t for tid, t in tracks_meta.items()
          if t["num_detections"] >= MIN_DETS and t["duration_sec"] >= MIN_DUR
      }
      dropped = len(tracks_meta) - len(stable_tracks)

      max_simultaneous = max(persons_per_frame) if persons_per_frame else 0
      counts_sorted = sorted(persons_per_frame)
      median_count = counts_sorted[len(counts_sorted)//2] if counts_sorted else 0

      signals = {
          "available": True,
          "detector": "yolov8n",
          "tracker": "bytetrack",
          "class_filter": "person",
          "confidence_threshold": CONF,
          "effective_fps": round(effective_fps, 2),
          "frame_count_scanned": frame_count,
          "max_simultaneous_people": max_simultaneous,
          "median_people_per_frame": int(median_count),
          "unique_subjects_lower_bound": len(stable_tracks),
          "num_unique_tracks": len(stable_tracks),
          "noise_tracks_dropped": dropped,
          "per_window_max_people": per_window_max,
      }
      with open(signals_path, "w") as f:
          json.dump(signals, f, indent=2)

      tracks_out = {
          "available": True,
          "source": "yolov8n + bytetrack",
          "video_src_fps": round(src_fps, 2),
          "effective_fps": round(effective_fps, 2),
          "vid_stride": vid_stride,
          "frame_count": frame_count,
          "clip_duration_sec": duration_sec,
          "src_video_native_w": src_w_native,
          "dense_frame_w": dense_w,
          "dense_frame_h": dense_h,
          "coord_space": "dense_frames",
          "num_unique_tracks": len(stable_tracks),
          "noise_tracks_dropped": dropped,
          "tracks": stable_tracks,
      }
      with open(tracks_path, "w") as f:
          json.dump(tracks_out, f, indent=2)

      print(f"[object-detect] frames={frame_count} tracks={len(tracks_meta)} "
            f"stable={len(stable_tracks)} dropped_noise={dropped} "
            f"max_simultaneous={max_simultaneous} per_window={per_window_max}", flush=True)
      for tid, t in sorted(stable_tracks.items(), key=lambda x: int(x[0])):
          print(f"  track {tid}: {t['first_sec']:.1f}s → {t['last_sec']:.1f}s "
                f"({t['num_detections']} dets, mean_conf={t['mean_confidence']:.2f})",
                flush=True)

  # Phase 2: YOLOv8n-pose keypoints + posture classification per track.
  # Matches poses to ByteTrack IDs via IoU on 640-wide dense_frames.
  # Emits .poses.json (per-track segments/changes/downsampled_kps +
  # geometric_incident_candidates from raw bbox aspect trajectory).
  - name: pose-estimate
    image: registry.access.redhat.com/ubi9/python-311:latest
    computeResources:
      limits: { nvidia.com/gpu: "1" }
    script: |
      #!/usr/bin/env python3
      import os, sys, json, glob, math, subprocess, traceback

      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      clip_dir = f"{workspace}/{clip_id}"
      dense_dir = f"{clip_dir}/dense_frames"
      tracks_path = f"{clip_dir}/.tracks.json"
      poses_path = f"{clip_dir}/.poses.json"
      cache_dir = f"{workspace}/.ultralytics-cache"
      pose_weights = f"{cache_dir}/yolov8n-pose.pt"

      def _bail(reason):
          try:
              with open(poses_path, "w") as f:
                  json.dump({"available": False, "reason": reason}, f)
          except Exception:
              pass
          print(f"[pose-estimate] skipped — {reason}", flush=True)
          sys.exit(0)

      if not os.path.exists(tracks_path):
          _bail(".tracks.json not found — Phase 1 (object-detect) must run first")
      if not os.path.isdir(dense_dir) or not os.listdir(dense_dir):
          _bail("dense_frames/ empty — object-detect didn't save frames")
      try:
          with open(tracks_path) as f:
              tracks_data = json.load(f)
          if not tracks_data.get("available"):
              _bail(f"tracks unavailable: {tracks_data.get('reason','unknown')}")
      except Exception as e:
          _bail(f"tracks.json read failed: {e}")

      try:
          import ultralytics  # noqa
      except ImportError:
          print("[pose-estimate] installing ultralytics + torch (headless cv2)...", flush=True)
          try:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet",
                   "--disable-pip-version-check",
                   # CUDA wheels (default PyPI); GPU auto-detected
                   "opencv-python-headless", "ultralytics"],
                  timeout=600,
              )
              subprocess.call([sys.executable, "-m", "pip", "uninstall", "-y",
                               "--disable-pip-version-check", "opencv-python"])
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet",
                   "--disable-pip-version-check",
                   "--force-reinstall", "opencv-python-headless"],
                  timeout=180,
              )
          except subprocess.CalledProcessError as e:
              _bail(f"install failed: {e}")

      try:
          os.environ["YOLO_CONFIG_DIR"] = cache_dir
          from ultralytics import YOLO
          model = YOLO(pose_weights if os.path.exists(pose_weights) else "yolov8n-pose.pt")
      except Exception as e:
          _bail(f"model load failed: {type(e).__name__}: {e}")

      tracks = tracks_data.get("tracks", {})
      frame_to_track_bboxes = {}
      for tid, t in tracks.items():
          for det in t.get("detections", []):
              frame_to_track_bboxes.setdefault(det["frame_idx"], []).append(
                  (int(tid), det["bbox"])
              )

      def _mid(a, b):
          return ((a[0] + b[0]) / 2, (a[1] + b[1]) / 2)
      def _dist(a, b):
          return math.hypot(a[0] - b[0], a[1] - b[1])
      def _visible(kp, thr=0.3):
          return kp[2] >= thr

      def classify_posture(kps, bbox):
          bw = max(1.0, bbox[2] - bbox[0])
          bh = max(1.0, bbox[3] - bbox[1])
          aspect = bw / bh  # >1 means wider than tall → prone-ish
          nose = kps[0]; ls, rs = kps[5], kps[6]
          lh, rh = kps[11], kps[12]; lk, rk = kps[13], kps[14]
          la, ra = kps[15], kps[16]; lw, rw = kps[9], kps[10]
          le, re = kps[7], kps[8]

          if _visible(ls) and _visible(rs) and _visible(lh) and _visible(rh):
              sh = _mid(ls, rs); hp = _mid(lh, rh)
              dy, dx = hp[1] - sh[1], hp[0] - sh[0]
              torso_from_vertical_deg = math.degrees(math.atan2(abs(dx), max(abs(dy), 0.001)))
              if aspect > 1.4 and torso_from_vertical_deg > 45:
                  return "prone", {"torso_angle_deg": round(torso_from_vertical_deg, 1),
                                   "bbox_aspect": round(aspect, 2)}
              if torso_from_vertical_deg > 60:
                  return "falling", {"torso_angle_deg": round(torso_from_vertical_deg, 1)}

          def arm_extended(s, e, w, torso_mid_x):
              if not (_visible(s) and _visible(e) and _visible(w)):
                  return False
              v1 = (s[0] - e[0], s[1] - e[1])
              v2 = (w[0] - e[0], w[1] - e[1])
              n1 = math.hypot(*v1); n2 = math.hypot(*v2)
              if n1 < 5 or n2 < 5:
                  return False
              cosang = (v1[0]*v2[0] + v1[1]*v2[1]) / (n1 * n2)
              cosang = max(-1.0, min(1.0, cosang))
              ang = math.degrees(math.acos(cosang))
              wrist_lateral = abs(w[0] - torso_mid_x) > 0.35 * bw
              return ang > 150 and wrist_lateral
          if _visible(ls) and _visible(rs):
              tmid_x = (ls[0] + rs[0]) / 2
              if arm_extended(ls, le, lw, tmid_x) or arm_extended(rs, re, rw, tmid_x):
                  return "arm-extended", {"note": "possible aim/point/reach"}

          if _visible(lk) and _visible(rk) and _visible(lh) and _visible(rh):
              if lk[1] < lh[1] and rk[1] < rh[1]:
                  return "crouched", {}

          if _visible(la) and _visible(ra) and _visible(ls) and _visible(rs):
              ankle_spread = _dist(la, ra)
              shoulder_spread = _dist(ls, rs)
              if ankle_spread > 1.6 * shoulder_spread:
                  return "running", {"ankle_over_shoulder_ratio":
                                     round(ankle_spread / max(shoulder_spread, 1), 2)}

          return "standing", {}

      frame_paths = sorted(glob.glob(f"{dense_dir}/f_*.jpg"))
      if not frame_paths:
          _bail("no dense frames to process")

      def frame_idx_from_path(p):
          try:
              return int(os.path.basename(p)[2:8])
          except Exception:
              return -1

      BATCH = 16
      per_track_postures = {tid: [] for tid in tracks.keys()}
      processed_frames = 0
      matched_poses = 0
      unmatched_poses = 0

      def iou(a, b):
          ax1, ay1, ax2, ay2 = a; bx1, by1, bx2, by2 = b
          ix1 = max(ax1, bx1); iy1 = max(ay1, by1)
          ix2 = min(ax2, bx2); iy2 = min(ay2, by2)
          iw = max(0, ix2 - ix1); ih = max(0, iy2 - iy1)
          inter = iw * ih
          ua = (ax2 - ax1) * (ay2 - ay1)
          ub = (bx2 - bx1) * (by2 - by1)
          union = ua + ub - inter
          return inter / union if union > 0 else 0.0

      try:
          for i in range(0, len(frame_paths), BATCH):
              batch = frame_paths[i:i+BATCH]
              results = model(batch, conf=0.3, imgsz=640, verbose=False)
              for fp, res in zip(batch, results):
                  fidx = frame_idx_from_path(fp)
                  processed_frames += 1
                  if res.keypoints is None or res.boxes is None:
                      continue
                  try:
                      boxes = res.boxes.xyxy.cpu().tolist()
                      kps_all = res.keypoints.data.cpu().tolist()
                  except Exception:
                      continue
                  candidates = frame_to_track_bboxes.get(fidx, [])
                  for box, kps in zip(boxes, kps_all):
                      best_tid, best_iou = None, 0.0
                      for tid, tbbox in candidates:
                          ov = iou(box, tbbox)
                          if ov > best_iou:
                              best_tid, best_iou = tid, ov
                      if best_tid is None or best_iou < 0.3:
                          unmatched_poses += 1
                          continue
                      matched_poses += 1
                      posture, meta = classify_posture(kps, box)
                      per_track_postures[str(best_tid)].append({
                          "frame_idx": fidx,
                          "sec": round(fidx * tracks_data["vid_stride"]
                                        / tracks_data["video_src_fps"], 3),
                          "posture": posture,
                          "posture_meta": meta,
                          "kps": [[round(k[0], 1), round(k[1], 1),
                                    round(k[2], 3)] for k in kps],
                          "bbox": [round(x, 1) for x in box],
                      })
      except Exception as e:
          traceback.print_exc()
          _bail(f"pose inference failed: {type(e).__name__}: {e}")

      per_track_summary = {}
      for tid, postures in per_track_postures.items():
          if not postures:
              continue
          postures.sort(key=lambda p: p["frame_idx"])
          segments = []
          cur = None
          for p in postures:
              if cur is None:
                  cur = {"posture": p["posture"], "start_sec": p["sec"],
                         "end_sec": p["sec"], "frame_count": 1}
                  continue
              if p["posture"] == cur["posture"]:
                  cur["end_sec"] = p["sec"]
                  cur["frame_count"] += 1
              else:
                  segments.append(cur)
                  cur = {"posture": p["posture"], "start_sec": p["sec"],
                         "end_sec": p["sec"], "frame_count": 1}
          if cur:
              segments.append(cur)
          segments = [s for s in segments if s["frame_count"] >= 2]
          changes = []
          for a, b in zip(segments, segments[1:]):
              changes.append({
                  "sec": round(b["start_sec"], 2),
                  "from": a["posture"],
                  "to":   b["posture"],
              })
          counts = {}
          for s in segments:
              counts[s["posture"]] = counts.get(s["posture"], 0) + s["frame_count"]
          kps_downsampled = postures[::4]
          per_track_summary[tid] = {
              "track_id": int(tid),
              "pose_frame_count": len(postures),
              "posture_counts": counts,
              "segments": segments,
              "changes": changes,
              "keypoints_downsampled": kps_downsampled,
          }

      geometric_all = {}
      for tid, t in tracks.items():
          dets = t.get("detections", [])
          if len(dets) < 3:
              continue
          per_frame = []
          for d in dets:
              x1, y1, x2, y2 = d["bbox"]
              w, h = max(x2-x1, 0.001), max(y2-y1, 0.001)
              per_frame.append({"sec": d["sec"], "aspect": w/h,
                                "bbox_h": h, "bbox_w": w})
          intervals = []
          cur = None
          for pf in per_frame:
              if pf["aspect"] > 0.9:
                  if cur is None:
                      cur = {"start_sec": pf["sec"], "end_sec": pf["sec"],
                              "peak_aspect": pf["aspect"], "frames": 1}
                  else:
                      cur["end_sec"] = pf["sec"]
                      cur["peak_aspect"] = max(cur["peak_aspect"], pf["aspect"])
                      cur["frames"] += 1
              else:
                  if cur and cur["frames"] >= 3:
                      cur["duration_sec"] = round(cur["end_sec"] - cur["start_sec"], 2)
                      intervals.append(cur)
                  cur = None
          if cur and cur["frames"] >= 3:
              cur["duration_sec"] = round(cur["end_sec"] - cur["start_sec"], 2)
              intervals.append(cur)
          fall_events = []
          for i in range(4, len(per_frame)):
              window = per_frame[max(0, i-6):i]
              if not window:
                  continue
              min_prev = min(pf["aspect"] for pf in window)
              curr = per_frame[i]["aspect"]
              if curr > 0.9 and min_prev < 0.75 and (curr / max(min_prev, 0.1)) >= 1.5:
                  fall_events.append({
                      "sec": round(per_frame[i]["sec"], 2),
                      "aspect_before": round(min_prev, 2),
                      "aspect_after": round(curr, 2),
                  })
          prone_ratio = sum(1 for pf in per_frame if pf["aspect"] > 0.9) / len(per_frame)
          aspect_range = (max(pf["aspect"] for pf in per_frame)
                          - min(pf["aspect"] for pf in per_frame))
          longest_interval_dur = max((iv["duration_sec"] for iv in intervals),
                                      default=0.0)
          if fall_events or (0.3 < prone_ratio < 0.95
                              and longest_interval_dur > 3.0
                              and aspect_range > 0.4):
              tier = "HIGH_CONFIDENCE"
          else:
              tier = "NOISE"
          if intervals or fall_events or prone_ratio > 0.3:
              geometric_all[tid] = {
                  "track_id": int(tid),
                  "tier": tier,
                  "prone_ratio": round(prone_ratio, 3),
                  "aspect_range": round(aspect_range, 2),
                  "num_detections": len(dets),
                  "sustained_prone_intervals": intervals,
                  "longest_prone_duration_sec": round(longest_interval_dur, 2),
                  "fall_events": fall_events,
              }
      geometric = {tid: g for tid, g in geometric_all.items()
                   if g["tier"] == "HIGH_CONFIDENCE"}
      geometric_noise = {tid: g for tid, g in geometric_all.items()
                          if g["tier"] == "NOISE"}

      poses_out = {
          "available": True,
          "model": "yolov8n-pose",
          "iou_match_threshold": 0.3,
          "processed_frames": processed_frames,
          "matched_poses": matched_poses,
          "unmatched_poses": unmatched_poses,
          "num_tracks_with_poses": len(per_track_summary),
          "tracks": per_track_summary,
          "geometric_incident_candidates": geometric,
          "geometric_noise_tracks_count": len(geometric_noise),
      }
      with open(poses_path, "w") as f:
          json.dump(poses_out, f)
      size_kb = os.path.getsize(poses_path) / 1024
      print(f"[pose-estimate] frames_processed={processed_frames} matched={matched_poses} "
            f"unmatched={unmatched_poses} tracks_with_poses={len(per_track_summary)} "
            f"HIGH_CONFIDENCE_incident={len(geometric)} NOISE_prone_tracks={len(geometric_noise)} "
            f"payload={size_kb:.1f}KB", flush=True)
      if geometric:
          print("[pose-estimate] 🚨 HIGH-CONFIDENCE incident candidates (posture-change based):")
          for tid, g in sorted(geometric.items(), key=lambda x: int(x[0])):
              parts = [f"track {tid}: prone_ratio={g['prone_ratio']} aspect_range={g['aspect_range']} "
                       f"longest_prone={g['longest_prone_duration_sec']}s"]
              for iv in g["sustained_prone_intervals"][:3]:
                  parts.append(f"prone-interval {iv['start_sec']:.1f}s→{iv['end_sec']:.1f}s ({iv['frames']}f, peak_aspect={iv['peak_aspect']:.2f})")
              for fe in g["fall_events"][:3]:
                  parts.append(f"FALL@{fe['sec']:.1f}s (aspect {fe['aspect_before']}→{fe['aspect_after']})")
              print("  " + "; ".join(parts), flush=True)
      for tid, s in sorted(per_track_summary.items(), key=lambda x: int(x[0])):
          counts_str = ", ".join(f"{p}:{n}" for p, n in
                                  sorted(s["posture_counts"].items(),
                                         key=lambda kv: -kv[1]))
          changes_str = " → ".join(f"{c['from']}→{c['to']}@{c['sec']}s"
                                    for c in s["changes"][:6])
          print(f"  track {tid}: [{counts_str}]" +
                (f"  changes: {changes_str}" if changes_str else ""),
                flush=True)

  # Phase 3: open-vocabulary weapon detector (YOLO-World v2-S, Apache-2.0).
  # Matches every weapon detection to the nearest ByteTrack ID via IoU +
  # bbox-containment. Emits .weapons.json with per-track associations
  # filtered to tracks with 2+ weapon frames (single-frame noise dropped).
  - name: weapon-detect
    image: registry.access.redhat.com/ubi9/python-311:latest
    computeResources:
      limits: { nvidia.com/gpu: "1" }
    script: |
      #!/usr/bin/env python3
      import os, sys, json, glob, re, subprocess, traceback

      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      clip_dir = f"{workspace}/{clip_id}"
      dense_dir = f"{clip_dir}/dense_frames"
      tracks_path = f"{clip_dir}/.tracks.json"
      weapons_path = f"{clip_dir}/.weapons.json"
      cache_dir = f"{workspace}/.ultralytics-cache"
      weapon_weights = f"{cache_dir}/yolov8s-worldv2.pt"

      WEAPON_CLASSES = [
          "pistol", "handgun", "gun", "firearm", "revolver",
          "rifle", "long gun", "shotgun", "assault rifle",
          "knife", "blade", "kitchen knife", "machete",
          "baseball bat", "crowbar", "hammer",
      ]

      def _bail(reason):
          try:
              with open(weapons_path, "w") as f:
                  json.dump({"available": False, "reason": reason}, f)
          except Exception:
              pass
          print(f"[weapon-detect] skipped — {reason}", flush=True)
          sys.exit(0)

      if not os.path.isdir(dense_dir):
          _bail("dense_frames/ not present — Phase 1 must run first")
      if not os.path.exists(tracks_path):
          _bail(".tracks.json not found — Phase 1 must run first")
      try:
          with open(tracks_path) as f:
              tracks_data = json.load(f)
          if not tracks_data.get("available"):
              _bail(f"tracks unavailable: {tracks_data.get('reason','unknown')}")
      except Exception as e:
          _bail(f"tracks.json read failed: {e}")

      try:
          import ultralytics  # noqa
      except ImportError:
          print("[weapon-detect] installing ultralytics + torch (headless cv2)...", flush=True)
          try:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet",
                   "--disable-pip-version-check",
                   # CUDA wheels (default PyPI); GPU auto-detected
                   "opencv-python-headless", "ultralytics"],
                  timeout=600,
              )
              subprocess.call([sys.executable, "-m", "pip", "uninstall", "-y",
                               "--disable-pip-version-check", "opencv-python"])
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet",
                   "--disable-pip-version-check", "--force-reinstall",
                   "opencv-python-headless"],
                  timeout=180,
              )
          except subprocess.CalledProcessError as e:
              _bail(f"install failed: {e}")

      try:
          os.environ["YOLO_CONFIG_DIR"] = cache_dir
          from ultralytics import YOLOWorld
          model_id = (weapon_weights if os.path.exists(weapon_weights)
                      else "yolov8s-worldv2.pt")
          model = YOLOWorld(model_id)
          model.set_classes(WEAPON_CLASSES)
      except Exception as e:
          _bail(f"model load failed: {type(e).__name__}: {e}")

      tracks = tracks_data.get("tracks", {})
      frame_to_track_bboxes = {}
      for tid, t in tracks.items():
          for det in t.get("detections", []):
              frame_to_track_bboxes.setdefault(det["frame_idx"], []).append(
                  (int(tid), det["bbox"])
              )

      frame_paths = sorted(glob.glob(f"{dense_dir}/f_*.jpg"))
      if not frame_paths:
          _bail("no dense frames on workspace")

      def frame_idx_from_path(p):
          try:
              return int(os.path.basename(p)[2:8])
          except Exception:
              return -1

      def iou(a, b):
          ax1, ay1, ax2, ay2 = a; bx1, by1, bx2, by2 = b
          ix1 = max(ax1, bx1); iy1 = max(ay1, by1)
          ix2 = min(ax2, bx2); iy2 = min(ay2, by2)
          iw = max(0, ix2 - ix1); ih = max(0, iy2 - iy1)
          inter = iw * ih
          ua = (ax2 - ax1) * (ay2 - ay1); ub = (bx2 - bx1) * (by2 - by1)
          union = ua + ub - inter
          return inter / union if union > 0 else 0.0

      def bbox_contains(person_bbox, weapon_bbox):
          px1, py1, px2, py2 = person_bbox
          wcx = (weapon_bbox[0] + weapon_bbox[2]) / 2
          wcy = (weapon_bbox[1] + weapon_bbox[3]) / 2
          pw = px2 - px1
          ex = pw * 0.3
          return (px1 - ex) <= wcx <= (px2 + ex) and py1 <= wcy <= py2

      CONF = 0.15
      IMGSZ = 640
      BATCH = 8

      weapons_per_frame = {}  # frame_idx → list of {bbox, cls, conf}
      per_track_weapons = {}  # tid → list of {frame_idx, sec, class, conf, bbox, iou_or_contain}
      total_detections = 0
      unmatched = 0

      try:
          for i in range(0, len(frame_paths), BATCH):
              batch = frame_paths[i:i+BATCH]
              results = model(batch, conf=CONF, imgsz=IMGSZ, verbose=False)
              for fp, res in zip(batch, results):
                  fidx = frame_idx_from_path(fp)
                  if res.boxes is None or len(res.boxes) == 0:
                      continue
                  try:
                      boxes = res.boxes.xyxy.cpu().tolist()
                      classes = res.boxes.cls.int().cpu().tolist()
                      confs = res.boxes.conf.cpu().tolist()
                  except Exception:
                      continue
                  weapons_per_frame.setdefault(fidx, [])
                  candidates = frame_to_track_bboxes.get(fidx, [])
                  for bx, cls_idx, cf in zip(boxes, classes, confs):
                      total_detections += 1
                      cls_name = WEAPON_CLASSES[cls_idx] if 0 <= cls_idx < len(WEAPON_CLASSES) else str(cls_idx)
                      wep = {"bbox": [round(v, 1) for v in bx],
                             "class": cls_name, "conf": round(float(cf), 3)}
                      weapons_per_frame[fidx].append(wep)
                      best_tid, best_score = None, 0.0
                      for tid, tbbox in candidates:
                          ov = iou(bx, tbbox)
                          contained = bbox_contains(tbbox, bx)
                          score = max(ov, 0.35 if contained else 0.0)
                          if score > best_score:
                              best_tid, best_score = tid, score
                      if best_tid is None or best_score < 0.15:
                          unmatched += 1
                          continue
                      sec = round(fidx * tracks_data["vid_stride"]
                                    / tracks_data["video_src_fps"], 3)
                      per_track_weapons.setdefault(str(best_tid), []).append({
                          "frame_idx": fidx, "sec": sec,
                          "class": cls_name, "conf": round(float(cf), 3),
                          "bbox": [round(v, 1) for v in bx],
                          "match_score": round(best_score, 3),
                      })
      except Exception as e:
          traceback.print_exc()
          _bail(f"inference failed: {type(e).__name__}: {e}")

      MIN_WEAPON_FRAMES = 2
      per_track_summary = {}
      for tid, dets in per_track_weapons.items():
          if len(dets) < MIN_WEAPON_FRAMES:
              continue
          dets.sort(key=lambda d: d["frame_idx"])
          class_counts = {}
          for d in dets:
              class_counts[d["class"]] = class_counts.get(d["class"], 0) + 1
          per_track_summary[tid] = {
              "track_id": int(tid),
              "num_weapon_frames": len(dets),
              "first_weapon_sec": dets[0]["sec"],
              "last_weapon_sec":  dets[-1]["sec"],
              "weapon_classes": class_counts,
              "max_conf": max(d["conf"] for d in dets),
              "mean_conf": round(sum(d["conf"] for d in dets)/len(dets), 3),
              "detections": dets[:20],  # cap payload
          }

      weapons_out = {
          "available": True,
          "model": "yolov8s-worldv2",
          "classes": WEAPON_CLASSES,
          "confidence_threshold": CONF,
          "min_frames_for_track_association": MIN_WEAPON_FRAMES,
          "processed_frames": len(frame_paths),
          "total_raw_detections": total_detections,
          "unmatched_detections": unmatched,
          "num_tracks_with_weapons": len(per_track_summary),
          "tracks_with_weapons": per_track_summary,
      }
      with open(weapons_path, "w") as f:
          json.dump(weapons_out, f)
      size_kb = os.path.getsize(weapons_path) / 1024
      print(f"[weapon-detect] frames={len(frame_paths)} raw_detections={total_detections} "
            f"unmatched={unmatched} tracks_with_weapons={len(per_track_summary)} "
            f"payload={size_kb:.1f}KB", flush=True)
      if per_track_summary:
          print("[weapon-detect] 🚨 Armed subjects detected:")
          for tid, s in sorted(per_track_summary.items(), key=lambda x: int(x[0])):
              cls_str = ", ".join(f"{c}:{n}" for c, n in s["weapon_classes"].items())
              print(f"  track {tid}: {s['num_weapon_frames']} weapon-frames "
                    f"({s['first_weapon_sec']}s → {s['last_weapon_sec']}s) "
                    f"[{cls_str}] max_conf={s['max_conf']}", flush=True)


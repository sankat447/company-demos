  # Kinetics-400 has ~400 human-action labels including many that map to
  # forensic events: `punching person (boxing)`, `wrestling`, `sword
  # fighting`, `high kick`, `jogging`, `running on treadmill`, `falling off
  # bike`, `situp`. The pipeline surfaces the top-3 predictions per track
  # AND a hand-curated `violence_signal` boolean when any top-3 class
  # matches a violence-relevant label.
  #
  # Model: torchvision.models.video.mvit_v2_s (Apache-2.0, ~35MB weights,
  # ~500-800ms per 32-frame clip on CPU).
  # Runtime: 30 tracks × ~700ms = ~20s + torchvision install if not cached.
  # Defensive: on any failure, .actions.json is written with available=false
  # and caption degrades gracefully.
  # ─────────────────────────────────────────────────────────────────────────
  - name: action-recognize
    image: registry.access.redhat.com/ubi9/python-311:latest
    script: |
      #!/usr/bin/env python3
      import os, sys, json, subprocess, traceback

      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      clip_dir = f"{workspace}/{clip_id}"
      dense_dir = f"{clip_dir}/dense_frames"
      tracks_path  = f"{clip_dir}/.tracks.json"
      actions_path = f"{clip_dir}/.actions.json"
      cache_dir = f"{workspace}/.torchvision-cache"

      # Kinetics-400 labels that Claude should treat as forensic violence
      # signals. Model outputs the top-1 label ID per class; we map back
      # to strings and check membership.
      VIOLENCE_LABELS = {
          "punching person (boxing)", "boxing punching bag",
          "wrestling", "sword fighting", "high kick", "side kick",
          "punching bag", "krav maga", "capoeira", "arm wrestling",
          "headbutting", "slapping", "sword swallowing",  # sanity — mostly harmless
      }
      # Kinetics also has movement labels that are useful context:
      RUNNING_LABELS = {"running on treadmill", "jogging", "sprint racing"}
      FALL_LABELS = {"falling off bike", "falling off chair"}

      def _bail(reason):
          try:
              with open(actions_path, "w") as f:
                  json.dump({"available": False, "reason": reason}, f)
          except Exception:
              pass
          print(f"[action-recognize] skipped — {reason}", flush=True)
          sys.exit(0)

      if not os.path.exists(tracks_path):
          _bail(".tracks.json not found — Phase 1 must run first")
      if not os.path.isdir(dense_dir):
          _bail("dense_frames/ not present")
      try:
          with open(tracks_path) as f:
              tracks_data = json.load(f)
          if not tracks_data.get("available"):
              _bail(f"tracks unavailable: {tracks_data.get('reason','unknown')}")
      except Exception as e:
          _bail(f"tracks.json read failed: {e}")

      # Install torch/torchvision if not present. Object-detect / pose-estimate
      # already pull torch as a transitive dep, so this is usually a no-op
      # except for the torchvision video-model weights.
      try:
          import torch  # noqa
          import torchvision  # noqa
      except ImportError:
          print("[action-recognize] installing torch + torchvision (CPU-only)...", flush=True)
          try:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet",
                   "--disable-pip-version-check",
                   "--extra-index-url", "https://download.pytorch.org/whl/cpu",
                   "opencv-python-headless", "torch", "torchvision"],
                  timeout=600,
              )
              subprocess.call([sys.executable, "-m", "pip", "uninstall", "-y",
                               "--disable-pip-version-check", "opencv-python"])
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet",
                   "--disable-pip-version-check", "--force-reinstall",
                   "opencv-python-headless"],
                  timeout=180,
              )
          except subprocess.CalledProcessError as e:
              _bail(f"install failed: {e}")

      try:
          import cv2, torch, numpy as np
          from torchvision.models.video import mvit_v2_s, MViT_V2_S_Weights
          from torchvision.transforms import v2 as T
          os.makedirs(cache_dir, exist_ok=True)
          os.environ["TORCH_HOME"] = cache_dir
          weights = MViT_V2_S_Weights.KINETICS400_V1
          model = mvit_v2_s(weights=weights).eval()
          labels = weights.meta["categories"]
          transforms = weights.transforms()
          print(f"[action-recognize] model=mvit_v2_s Kinetics-400 loaded ({len(labels)} classes)",
                flush=True)
      except Exception as e:
          traceback.print_exc()
          _bail(f"model load failed: {type(e).__name__}: {e}")

      tracks = tracks_data.get("tracks", {})
      vid_stride = tracks_data.get("vid_stride", 1)
      src_fps = tracks_data.get("video_src_fps", 30.0)

      def sec_of(fidx):
          return round(fidx * vid_stride / src_fps, 3)

      # Model expects (T, C, H, W). For MViT_V2_S: 16 frames @ 224×224
      # (from transforms metadata: `crop_size`=224, `min_size`=200,
      # `frames_per_clip`=16 for v2-S).
      NUM_FRAMES = 16
      CROP_PAD = 0.25   # add 25% padding around bbox for context

      def crop_and_stack(track_dets):
          """Return a tensor (T, C, H, W) of NUM_FRAMES bbox crops
          uniformly sampled across the track's lifetime, or None if too
          few detections available."""
          if len(track_dets) < 3:
              return None
          # Pick NUM_FRAMES detections evenly spaced across the track
          idxs = [int(round(i * (len(track_dets) - 1) / (NUM_FRAMES - 1)))
                  for i in range(NUM_FRAMES)]
          frames = []
          for i in idxs:
              det = track_dets[i]
              fp = f"{dense_dir}/f_{det['frame_idx']:06d}.jpg"
              if not os.path.exists(fp):
                  return None
              img = cv2.imread(fp)  # BGR
              if img is None:
                  return None
              h, w = img.shape[:2]
              x1, y1, x2, y2 = det["bbox"]
              bw, bh = x2 - x1, y2 - y1
              # Pad
              pad_x = bw * CROP_PAD; pad_y = bh * CROP_PAD
              cx1 = max(0, int(x1 - pad_x))
              cy1 = max(0, int(y1 - pad_y))
              cx2 = min(w, int(x2 + pad_x))
              cy2 = min(h, int(y2 + pad_y))
              crop = img[cy1:cy2, cx1:cx2]
              if crop.size == 0:
                  return None
              # Resize crop to 256×256 to keep it above the transforms'
              # min_size before the pipeline resizes to 224 anyway
              resized = cv2.resize(crop, (256, 256))
              # BGR → RGB
              resized = cv2.cvtColor(resized, cv2.COLOR_BGR2RGB)
              frames.append(resized)
          # Stack to (T, H, W, C) → (T, C, H, W) → (1, T, C, H, W) → apply
          # torchvision video transforms (which want (T, C, H, W)).
          arr = np.stack(frames, axis=0)   # (T, H, W, C)
          tensor = torch.from_numpy(arr).permute(0, 3, 1, 2)   # (T, C, H, W)
          return tensor

      per_track_actions = {}
      violence_flagged = []
      running_flagged = []

      for tid, t in tracks.items():
          dets = t.get("detections", [])
          if len(dets) < 3:
              continue
          try:
              clip = crop_and_stack(dets)
              if clip is None:
                  continue
              # torchvision's video-classification transforms take (T, C, H, W)
              # input and RETURN (C, T, H, W) — channels-first spatiotemporal
              # order which is what the 3D-conv model expects. Only need to
              # unsqueeze the batch dim; do NOT permute again.
              x = transforms(clip)         # (C, T, H, W)
              x = x.unsqueeze(0)           # (1, C, T, H, W)
              with torch.no_grad():
                  logits = model(x)
              probs = torch.softmax(logits, dim=-1)[0]
              top_p, top_i = torch.topk(probs, 5)
              preds = [(labels[i.item()], round(p.item(), 4))
                       for p, i in zip(top_p, top_i)]
              is_violence = any(cls in VIOLENCE_LABELS for cls, _ in preds)
              is_running = any(cls in RUNNING_LABELS for cls, _ in preds)
              per_track_actions[tid] = {
                  "track_id": int(tid),
                  "middle_sec": round((t["first_sec"] + t["last_sec"]) / 2, 2),
                  "duration_sec": t["duration_sec"],
                  "top5": preds,
                  "top1": preds[0][0],
                  "top1_conf": preds[0][1],
                  "violence_signal": is_violence,
                  "running_signal": is_running,
              }
              if is_violence:
                  violence_flagged.append((tid, preds[0][0], preds[0][1]))
              if is_running:
                  running_flagged.append((tid, preds[0][0], preds[0][1]))
          except Exception as e:
              print(f"  ⚠️ track {tid} failed: {type(e).__name__}: {e}", flush=True)
              continue

      actions_out = {
          "available": True,
          "model": "mvit_v2_s",
          "dataset": "Kinetics-400",
          "frames_per_clip": NUM_FRAMES,
          "crop_padding_ratio": CROP_PAD,
          "num_tracks_analyzed": len(per_track_actions),
          "num_tracks_violence_flagged": len(violence_flagged),
          "num_tracks_running_flagged": len(running_flagged),
          "tracks": per_track_actions,
      }
      with open(actions_path, "w") as f:
          json.dump(actions_out, f)
      size_kb = os.path.getsize(actions_path) / 1024
      print(f"[action-recognize] tracks_analyzed={len(per_track_actions)} "
            f"violence_flagged={len(violence_flagged)} "
            f"running_flagged={len(running_flagged)} "
            f"payload={size_kb:.1f}KB", flush=True)
      if violence_flagged:
          print("[action-recognize] 🚨 Violence-labeled tracks (Kinetics-400):")
          for tid, cls, cf in violence_flagged:
              print(f"  track {tid}: '{cls}' conf={cf}", flush=True)
      if running_flagged:
          print("[action-recognize] 🏃 Running-labeled tracks:")
          for tid, cls, cf in running_flagged:
              print(f"  track {tid}: '{cls}' conf={cf}", flush=True)

  # ─────────────────────────────────────────────────────────────────────────
  # muzzle-flash-detect (visual shootout detector — motion + pose + flash)
  # PHASE 5 of the CV-stack upgrade. Pure-Python; no new ML model.
  #
  # For each track with an arm-extended pose segment, iterate the pose-
  # estimator's downsampled keypoint frames within that segment and check
  # the pixel region near the wrist for a saturated-brightness spike (>=225
  # / 255) that is BOTH brighter than the same location in adjacent frames
  # AND localized (small hot spot, not a global brightness change). Also
  # check the projected "muzzle" point (wrist extended along the arm
  # direction by ~1.5x forearm length) so hand-guarded weapons like a
  # pistol still produce a flash we can find.
  #
  # A flash event =
  #   * arm-extended posture at time T on track A
  #   * localized brightness spike near A's wrist / muzzle-projection at T
  #   * spike is transient (present in <=2 consecutive keypoint frames)
  #   * NOT explained by ambient (surrounding pixels stay at their baseline)
  #
  # Emits .flashes.json — per-track flash events with timestamps and ROI
  # bright-value. The caption step + system prompt then cross-check with
  # geometric_incident_candidates (victim goes prone within 2s of a flash)
  # to confirm SHOOTING vs BRANDISHING vs FALSE POSITIVE.
  # ─────────────────────────────────────────────────────────────────────────
  - name: muzzle-flash-detect
    image: registry.access.redhat.com/ubi9/python-311:latest
    script: |
      #!/usr/bin/env python3
      import os, sys, json, subprocess, math

      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      clip_dir = f"{workspace}/{clip_id}"
      dense_dir = f"{clip_dir}/dense_frames"
      poses_path   = f"{clip_dir}/.poses.json"
      tracks_path  = f"{clip_dir}/.tracks.json"
      flashes_path = f"{clip_dir}/.flashes.json"

      def _bail(reason):
          try:
              with open(flashes_path, "w") as f:
                  json.dump({"available": False, "reason": reason}, f)
          except Exception:
              pass
          print(f"[muzzle-flash-detect] skipped — {reason}", flush=True)
          sys.exit(0)

      if not os.path.isdir(dense_dir):
          _bail("dense_frames/ not present")
      if not os.path.exists(poses_path):
          _bail(".poses.json missing")
      if not os.path.exists(tracks_path):
          _bail(".tracks.json missing")
      try:
          poses_data = json.load(open(poses_path))
          tracks_data = json.load(open(tracks_path))
          if not poses_data.get("available") or not tracks_data.get("available"):
              _bail("prerequisite signal(s) unavailable")
      except Exception as e:
          _bail(f"json read failed: {e}")

      try:
          from PIL import Image
      except ImportError:
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--quiet",
               "--disable-pip-version-check", "Pillow"],
              timeout=120,
          )
          from PIL import Image

      # ── Config ──────────────────────────────────────────────────────────
      # A saturated flash on 8-bit grayscale is >~225 (near-white). Ambient
      # night CCTV rarely exceeds ~180 outside floodlit surfaces, so 225 is
      # a reasonable threshold. Flash region is small (~5-15 px on a
      # 640-wide frame), so a 25x25 ROI captures it.
      FLASH_LUMA_THRESHOLD = 225
      ROI_HALF = 12          # 25x25 window
      MIN_SPIKE_OVER_BASELINE = 40   # ROI max must exceed clip-baseline+40
      # Filter: any "flash" that persists for > 3 consecutive keypoint
      # frames (0.5s at 4-frame downsampling) is probably a fixed light
      # source, not a muzzle flash — reject.
      MAX_CONSECUTIVE_FLASH_FRAMES = 3

      vid_stride = tracks_data.get("vid_stride", 1)
      src_fps = tracks_data.get("video_src_fps", 30.0)

      def wrist_and_muzzle(kps):
          # COCO: 5=Lsh 6=Rsh 7=Lelbow 8=Relbow 9=Lwrist 10=Rwrist
          def visible(k): return k[2] >= 0.3
          wrist = None; elbow = None; shoulder = None
          if visible(kps[10]):
              wrist, elbow, shoulder = kps[10], kps[8], kps[6]
          elif visible(kps[9]):
              wrist, elbow, shoulder = kps[9], kps[7], kps[5]
          if wrist is None:
              return None, None
          # Muzzle projection: wrist extended along elbow→wrist direction
          # by half of forearm length. If elbow is invisible, project from
          # shoulder→wrist direction instead.
          origin = elbow if elbow and elbow[2] >= 0.3 else shoulder
          if origin is None or origin[2] < 0.3:
              return (wrist[0], wrist[1]), None
          dx = wrist[0] - origin[0]; dy = wrist[1] - origin[1]
          scale = 0.5
          muzzle = (wrist[0] + dx * scale, wrist[1] + dy * scale)
          return (wrist[0], wrist[1]), muzzle

      def sample_roi_max(img_gray, cx, cy):
          w, h = img_gray.size
          x1 = max(0, int(cx - ROI_HALF)); y1 = max(0, int(cy - ROI_HALF))
          x2 = min(w, int(cx + ROI_HALF)); y2 = min(h, int(cy + ROI_HALF))
          if x2 <= x1 or y2 <= y1:
              return 0
          crop = img_gray.crop((x1, y1, x2, y2))
          return max(crop.getdata())

      # ── Compute clip-baseline luma so we can spot spikes over ambient ────
      # Global-max baseline is broken for night scenes with any fixed bright
      # source (canopy light, LED signage, headlight) — even one saturated
      # pixel forces max→255 and no flash can beat it. Instead use the 99th
      # percentile of pixel values across a stratified sample. This lets
      # small clusters of saturated pixels (real transient flashes) still
      # register while ignoring the handful of always-lit pixels.
      import glob
      all_frames = sorted(glob.glob(f"{dense_dir}/f_*.jpg"))
      if len(all_frames) < 5:
          _bail("too few dense frames")
      baseline_samples = all_frames[::max(1, len(all_frames)//20)][:20]
      # Collect a sample of top-1% values from each sampled frame — that's
      # the 99th percentile approach that ignores rare saturated pixels.
      p99_values = []
      for fp in baseline_samples:
          g = Image.open(fp).convert("L")
          data = sorted(g.getdata(), reverse=True)
          # Take the value at the 1% mark (top-1% cutoff)
          cutoff_idx = max(1, len(data) // 100)
          p99_values.append(data[cutoff_idx])
      baseline_max = max(p99_values)   # 99th-percentile-max across sampled frames
      spike_threshold = max(FLASH_LUMA_THRESHOLD, baseline_max + MIN_SPIKE_OVER_BASELINE)
      print(f"[muzzle-flash-detect] baseline_p99_max={baseline_max} "
            f"spike_threshold={spike_threshold}", flush=True)

      # ── Iterate per-track pose keypoints ────────────────────────────────
      per_track_flashes = {}
      arm_extended_track_count = 0
      arm_extended_frames_scanned = 0

      for tid, t in poses_data.get("tracks", {}).items():
          # Determine which frames are within an arm-extended segment
          arm_segments = [s for s in t.get("segments", [])
                          if s.get("posture") == "arm-extended"]
          if not arm_segments:
              continue
          arm_extended_track_count += 1
          def in_arm_segment(sec):
              return any(s["start_sec"] <= sec <= s["end_sec"] for s in arm_segments)

          # Keypoints are downsampled per pose-estimate step
          kp_frames = t.get("keypoints_downsampled", [])
          candidate_events = []   # list of {sec, kind, wrist, muzzle, roi_max}
          for kpf in kp_frames:
              sec = kpf["sec"]
              if not in_arm_segment(sec):
                  continue
              arm_extended_frames_scanned += 1
              kps = kpf.get("kps") or []
              if len(kps) < 17:
                  continue
              wrist, muzzle = wrist_and_muzzle(kps)
              if wrist is None:
                  continue
              fp = f"{dense_dir}/f_{kpf['frame_idx']:06d}.jpg"
              if not os.path.exists(fp):
                  continue
              img_gray = Image.open(fp).convert("L")
              w_max = sample_roi_max(img_gray, wrist[0], wrist[1])
              m_max = sample_roi_max(img_gray, muzzle[0], muzzle[1]) if muzzle else 0
              roi_max = max(w_max, m_max)
              if roi_max >= spike_threshold:
                  candidate_events.append({
                      "sec": sec,
                      "frame_idx": kpf["frame_idx"],
                      "wrist_roi_max": w_max,
                      "muzzle_roi_max": m_max,
                      "over_baseline": roi_max - baseline_max,
                  })

          # Reject persistent bright spots — group consecutive keypoint
          # frames (≤~0.5s apart) and only keep groups <= MAX_CONSECUTIVE_FLASH_FRAMES.
          if not candidate_events:
              continue
          candidate_events.sort(key=lambda e: e["sec"])
          groups = []
          cur = [candidate_events[0]]
          for e in candidate_events[1:]:
              if e["sec"] - cur[-1]["sec"] <= 0.75:
                  cur.append(e)
              else:
                  groups.append(cur); cur = [e]
          groups.append(cur)
          transient = [g for g in groups if len(g) <= MAX_CONSECUTIVE_FLASH_FRAMES]
          if not transient:
              continue
          # Emit one flash event per transient group (its peak)
          flashes = []
          for g in transient:
              peak = max(g, key=lambda e: max(e["wrist_roi_max"], e["muzzle_roi_max"]))
              flashes.append({
                  "sec": round(peak["sec"], 2),
                  "frame_idx": peak["frame_idx"],
                  "peak_roi_max": max(peak["wrist_roi_max"], peak["muzzle_roi_max"]),
                  "over_baseline": peak["over_baseline"],
                  "group_size": len(g),
              })
          per_track_flashes[tid] = {
              "track_id": int(tid),
              "num_flashes": len(flashes),
              "flashes": flashes,
          }

      flashes_out = {
          "available": True,
          "baseline_max": baseline_max,
          "spike_threshold": spike_threshold,
          "flash_luma_threshold": FLASH_LUMA_THRESHOLD,
          "roi_half": ROI_HALF,
          "arm_extended_tracks_scanned": arm_extended_track_count,
          "arm_extended_frames_scanned": arm_extended_frames_scanned,
          "num_tracks_with_flashes": len(per_track_flashes),
          "tracks_with_flashes": per_track_flashes,
      }
      with open(flashes_path, "w") as f:
          json.dump(flashes_out, f)
      size_kb = os.path.getsize(flashes_path) / 1024
      print(f"[muzzle-flash-detect] arm_extended_tracks={arm_extended_track_count} "
            f"frames_scanned={arm_extended_frames_scanned} "
            f"tracks_with_flashes={len(per_track_flashes)} "
            f"payload={size_kb:.1f}KB", flush=True)
      if per_track_flashes:
          print("[muzzle-flash-detect] 💥 Flash candidates:")
          for tid, ft in sorted(per_track_flashes.items(), key=lambda x: int(x[0])):
              for f in ft["flashes"]:
                  print(f"  track {tid}: flash@{f['sec']}s peak={f['peak_roi_max']} "
                        f"(+{f['over_baseline']} over baseline, group={f['group_size']})",
                        flush=True)

  - name: caption
    image: registry.access.redhat.com/ubi9/python-311:latest
    env:
    # Local Qwen-VL endpoint (Knative Route, OpenShift Router → activator → vLLM).
    - name: VLM_ENDPOINT
      value: "https://pd-qwen25-vl-7b-predictor-pd-cctv.apps.ai-demo.iisdemolab.click/v1/chat/completions"
    - name: VLM_MODEL
      value: "pd-qwen25-vl-7b"
    # Anthropic API for claude-multimodal mode.
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: pd-anthropic-key
          key: api_key
          optional: true
    - name: ANTHROPIC_MODEL
      value: "claude-sonnet-4-5"
    volumeMounts:
    - name: vlm-mode-cm
      mountPath: /etc/pd-vlm-mode
      readOnly: true
    - name: vlm-system-prompt
      mountPath: /etc/pd-vlm-system-prompt
      readOnly: true
    script: |
      #!/usr/bin/env python3
      import base64, json, os, sys, glob, subprocess, urllib.request, urllib.error, ssl

      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      frames_dir = f"{workspace}/{clip_id}/frames"
      out_path  = f"{workspace}/{clip_id}/caption.json"
      mode_path = f"{workspace}/{clip_id}/.vlm-mode"
      dur_path  = f"{workspace}/{clip_id}/.clip-duration-sec"
      step_path = f"{workspace}/{clip_id}/.clip-frame-step-sec"
      try:
          mode = open(mode_path).read().strip()
      except FileNotFoundError:
          mode = "local"
      try:
          duration_sec = int(open(dur_path).read().strip())
      except (FileNotFoundError, ValueError):
          duration_sec = 0
      try:
          frame_step_sec = float(open(step_path).read().strip())
      except (FileNotFoundError, ValueError):
          frame_step_sec = 0.0

      # ── Install Pillow at runtime (UBI9 python-311 has no PIL preinstalled) ─
      # We use it to compute pixel-derived TRUSTED SIGNALS that the VLM cannot
      # hallucinate: mean luminance for day/night classification, inter-frame
      # motion score for hotspot detection. ~1s install; ~3MB wheel.
      try:
          from PIL import Image, ImageChops  # noqa
      except ImportError:
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--quiet",
               "--disable-pip-version-check", "Pillow"],
          )
          from PIL import Image, ImageChops

      # Read the window count from extract-keyframes step
      try:
          num_windows = int(open(f"{workspace}/{clip_id}/.num-windows").read().strip())
      except (FileNotFoundError, ValueError):
          num_windows = 1
      try:
          window_duration_sec = float(open(f"{workspace}/{clip_id}/.window-durations").read().strip())
      except (FileNotFoundError, ValueError):
          window_duration_sec = float(duration_sec) if num_windows == 1 else float(duration_sec) / max(num_windows, 1)

      # Group frames by their window (filename convention: windowN_MMM.jpg)
      # Order: window1_001, window1_002, …, window2_001, …
      import re as _re_fname
      frame_paths = sorted(glob.glob(f"{frames_dir}/window*_*.jpg"))
      # Fallback for backward-compat (old fname convention frame_MMM.jpg)
      if not frame_paths:
          frame_paths = sorted(glob.glob(f"{frames_dir}/*.jpg"))
      windowed_frames = {}  # {window_index: [(within_win_idx, filepath), ...]}
      for fp in frame_paths:
          name = os.path.basename(fp)
          m = _re_fname.match(r"window(\d+)_(\d+)\.jpg", name)
          if m:
              w_idx, w_pos = int(m.group(1)), int(m.group(2))
          else:
              w_idx, w_pos = 1, len(windowed_frames.get(1, [])) + 1
          windowed_frames.setdefault(w_idx, []).append((w_pos, fp))
      for w in windowed_frames:
          windowed_frames[w].sort()

      # Build flat ordered list + parallel per-frame metadata
      frame_meta = []
      images_b64 = []
      for w_idx in sorted(windowed_frames.keys()):
          fpw = len(windowed_frames[w_idx])
          win_start_sec = (w_idx - 1) * window_duration_sec
          step_in_win = window_duration_sec / fpw if fpw else 0
          for pos, (w_pos, fp) in enumerate(windowed_frames[w_idx]):
              t_sec = round(win_start_sec + (w_pos - 1) * step_in_win, 2)
              with open(fp, "rb") as f:
                  images_b64.append(base64.b64encode(f.read()).decode("ascii"))
              frame_meta.append({"window": w_idx, "within_window_idx": w_pos,
                                 "clip_time_sec": t_sec, "path": fp})
      frame_paths = [m["path"] for m in frame_meta]

      print(f"[caption] mode={mode} frames={len(images_b64)} in {num_windows} window(s) · "
            f"duration={duration_sec}s window_dur={window_duration_sec:.1f}s")

      # ── TRUSTED SIGNALS pre-pass (lesson 17.36) ─────────────────────────────
      # Compute what pixels actually say, so the VLM can't invent contradictory
      # metadata like "daylight" over a night clip.
      per_frame_luminance = []
      motion_scores = []
      prev_img = None
      for fp in frame_paths:
          img = Image.open(fp).convert("L")            # grayscale, 0–255
          w, h = img.size
          mean_lum = sum(img.getdata()) / (w * h)
          per_frame_luminance.append(round(mean_lum, 1))
          # Downscale for fast motion score
          small = img.resize((160, 90))
          if prev_img is not None:
              diff = ImageChops.difference(small, prev_img)
              motion_scores.append(round(sum(diff.getdata()) / (160 * 90), 2))
          prev_img = small

      avg_lum = sum(per_frame_luminance) / len(per_frame_luminance) if per_frame_luminance else 0
      # Thresholds tuned on typical CCTV: <60 is clearly night (canopy lighting or
      # dim streetlight); >130 is clearly day; in between = ambiguous / dusk.
      if avg_lum < 60:
          lighting_class = "NIGHT"
      elif avg_lum > 130:
          lighting_class = "DAY"
      else:
          lighting_class = "AMBIGUOUS"

      # Top motion hotspots — the frames where visual change is most concentrated.
      # These are where transient events (running, falling, weapon-drawing) live.
      hotspot_ranked = sorted(enumerate(motion_scores), key=lambda x: -x[1])[:5]
      hotspot_frames = sorted(idx + 2 for idx, _ in hotspot_ranked)   # +2: motion is diff between frame N-1 and N
      hotspot_times  = sorted(round((idx - 1) * frame_step_sec, 1) for idx, _ in hotspot_ranked) if frame_step_sec else []

      # Per-window summary — Claude uses these to know each window's time span
      windows_meta = []
      for w_idx in sorted(windowed_frames.keys()):
          fpw = len(windowed_frames[w_idx])
          w_start = round((w_idx - 1) * window_duration_sec, 2)
          w_end   = round(w_idx * window_duration_sec, 2) if w_idx < num_windows else duration_sec
          windows_meta.append({"window": w_idx, "start_sec": w_start,
                               "end_sec": w_end, "frame_count": fpw})

      # ── People-count + track signals from object-detect (YOLOv8n+ByteTrack) ─
      # Optional — the step is defensive and may skip on any error. When
      # present, this gives Claude HARD ground-truth counts + per-track
      # lifetimes it cannot hallucinate away.
      object_signals = None
      obj_path = f"{workspace}/{clip_id}/.object-signals.json"
      tracks_path = f"{workspace}/{clip_id}/.tracks.json"
      try:
          with open(obj_path) as f:
              _obj = json.load(f)
          if _obj.get("available"):
              # If .tracks.json is also available, surface each track's
              # first/last-seen timestamps — this tells Claude exactly
              # when each subject appears and disappears in the clip.
              tracks_summary = []
              try:
                  with open(tracks_path) as tf:
                      _tr = json.load(tf)
                  if _tr.get("available"):
                      for tid, t in sorted(_tr.get("tracks", {}).items(),
                                            key=lambda x: int(x[0])):
                          tracks_summary.append({
                              "track_id": t["track_id"],
                              "first_sec": t["first_sec"],
                              "last_sec":  t["last_sec"],
                              "duration_sec": t["duration_sec"],
                              "detections": t["num_detections"],
                              "mean_conf": t["mean_confidence"],
                          })
              except FileNotFoundError:
                  pass
              except Exception as e:
                  print(f"[caption] tracks.json read failed: {e}")

              object_signals = {
                  "detector": _obj.get("detector"),
                  "tracker":  _obj.get("tracker"),
                  "effective_fps": _obj.get("effective_fps"),
                  "frame_count_scanned": _obj.get("frame_count_scanned"),
                  "max_simultaneous_people": _obj.get("max_simultaneous_people", 0),
                  "median_people_per_frame": _obj.get("median_people_per_frame", 0),
                  "num_unique_tracks": _obj.get("num_unique_tracks",
                                                _obj.get("unique_subjects_lower_bound", 0)),
                  "unique_subjects_lower_bound": _obj.get("unique_subjects_lower_bound", 0),
                  "per_window_max_people": _obj.get("per_window_max_people", {}),
                  "per_track_lifetimes": tracks_summary,
                  "note": ("These are HARD counts from a YOLOv8n detector + "
                           "ByteTrack tracker running on the full video at "
                           "~8 fps. `num_unique_tracks` is the count of "
                           "PERSISTENT SUBJECT IDs the tracker maintained "
                           "across the whole clip — this is the TRUE number "
                           "of distinguishable people, resolved for "
                           "occlusion and re-entry. Your Suspects/People "
                           "table MUST enumerate at least this many rows. "
                           "The `per_track_lifetimes` array tells you WHEN "
                           "each subject was on-screen — use these "
                           "timestamps to place each person on the "
                           "Timeline. If a subject appears only in the "
                           "last 3 seconds, they are NOT the ringleader; "
                           "if a track spans the whole clip, that subject "
                           "is a persistent presence (loiterer, victim, "
                           "or fixed observer). NEVER assert more subjects "
                           "than num_unique_tracks — the tracker cannot be "
                           "beaten by imagination. NEVER under-count."),
              }
              print(f"[caption] object-signals: tracks={object_signals['num_unique_tracks']} "
                    f"max_simultaneous={object_signals['max_simultaneous_people']} "
                    f"per_window={object_signals['per_window_max_people']}")
              for ts in tracks_summary:
                  print(f"  track {ts['track_id']}: {ts['first_sec']}s → {ts['last_sec']}s "
                        f"({ts['detections']} dets)")
          else:
              print(f"[caption] object-signals unavailable: {_obj.get('reason','unknown')}")
      except FileNotFoundError:
          print("[caption] object-signals file not found (object-detect step may have failed silently)")
      except Exception as e:
          print(f"[caption] object-signals read failed: {e}")

      # ── Pose signals from pose-estimate step (Phase 2) ───────────────────
      # Per-track posture segments + posture-change events. Lets Claude
      # write things like "Subject #4 transitions to prone at 12.3s" that
      # the VLM alone cannot reliably assert from unlabeled keyframes.
      pose_signals = None
      poses_path = f"{workspace}/{clip_id}/.poses.json"
      try:
          with open(poses_path) as f:
              _pose = json.load(f)
          if _pose.get("available"):
              # Trim payload for the prompt: drop raw keypoints, keep
              # per-track posture counts + change events.
              track_pose_summary = {}
              for tid, s in _pose.get("tracks", {}).items():
                  track_pose_summary[tid] = {
                      "track_id": s["track_id"],
                      "posture_counts": s["posture_counts"],
                      "segments": s["segments"],
                      "changes": s["changes"],
                  }
              geometric = _pose.get("geometric_incident_candidates", {}) or {}
              geometric_noise_count = _pose.get("geometric_noise_tracks_count", 0)
              pose_signals = {
                  "model": _pose.get("model"),
                  "num_tracks_with_poses": _pose.get("num_tracks_with_poses"),
                  "match_rate": (round(_pose.get("matched_poses", 0) /
                                        max(_pose.get("matched_poses", 0)
                                             + _pose.get("unmatched_poses", 0), 1), 3)),
                  "tracks": track_pose_summary,
                  "geometric_incident_candidates": geometric,
                  "geometric_noise_tracks_count": geometric_noise_count,
                  "note": ("Per-subject posture data from a YOLOv8-pose "
                           "estimator matched to ByteTrack IDs by IoU. "
                           "`segments` is the contiguous posture-time "
                           "of each track; `changes` are the transition "
                           "events (e.g. standing→prone at 12.3s = "
                           "person hit the ground). If any track has a "
                           "posture-change to `prone`, `arm-extended`, "
                           "or `falling`, that IS the incident — surface "
                           "it prominently in Modus Operandi, Timeline, "
                           "and Forensic Conclusion. `standing`/`walking`/"
                           "`running` are ambulatory; `prone`/`crouched`/"
                           "`arm-extended` warrant scrutiny."),
              }
              print(f"[caption] pose-signals: tracks_with_poses={pose_signals['num_tracks_with_poses']} "
                    f"match_rate={pose_signals['match_rate']} "
                    f"HIGH_CONFIDENCE_incident={len(geometric)} "
                    f"NOISE_dropped={geometric_noise_count}")
              for tid, s in sorted(track_pose_summary.items(), key=lambda x: int(x[0])):
                  print(f"  track {tid}: postures={s['posture_counts']} "
                        f"changes={len(s['changes'])}")
              if geometric:
                  print("[caption] 🚨 HIGH-CONFIDENCE incident candidates injected into TRUSTED SIGNALS:")
                  for tid, g in sorted(geometric.items(), key=lambda x: int(x[0])):
                      msg = (f"    track {tid}: prone_ratio={g['prone_ratio']} "
                             f"aspect_range={g['aspect_range']} "
                             f"longest_prone={g['longest_prone_duration_sec']}s "
                             f"intervals={len(g['sustained_prone_intervals'])} "
                             f"fall_events={len(g['fall_events'])}")
                      print(msg)
          else:
              print(f"[caption] pose-signals unavailable: {_pose.get('reason','unknown')}")
      except FileNotFoundError:
          print("[caption] .poses.json not found (pose-estimate step may have failed silently)")
      except Exception as e:
          print(f"[caption] pose-signals read failed: {e}")

      # ── Weapon signals from weapon-detect (Phase 3) ─────────────────────
      weapon_signals = None
      weapons_path = f"{workspace}/{clip_id}/.weapons.json"
      try:
          with open(weapons_path) as f:
              _wep = json.load(f)
          if _wep.get("available"):
              tracks_wep = _wep.get("tracks_with_weapons", {}) or {}
              weapon_signals = {
                  "model": _wep.get("model"),
                  "num_tracks_with_weapons": _wep.get("num_tracks_with_weapons"),
                  "total_raw_detections": _wep.get("total_raw_detections"),
                  "tracks_with_weapons": tracks_wep,
                  "note": ("Per-subject weapon detections from a YOLO-World "
                           "open-vocabulary detector. Each entry ties a "
                           "weapon type (pistol / rifle / knife / etc.) "
                           "to a persistent ByteTrack subject via IoU "
                           "and bbox-containment matching. Only tracks "
                           "with 2+ frames of weapon presence are "
                           "surfaced (single-frame detections are "
                           "filtered as noise). IF ANY TRACK APPEARS "
                           "HERE, THAT SUBJECT IS ARMED — call it out "
                           "explicitly in Weapons & Threats, Modus "
                           "Operandi, and Forensic Conclusion with the "
                           "weapon class and the timestamp range. "
                           "Combine with pose_signals.geometric_"
                           "incident_candidates: an armed subject + "
                           "another subject going prone within a few "
                           "seconds = armed assault. This is the "
                           "definitive shootout / brandishing signal."),
              }
              print(f"[caption] weapon-signals: tracks_with_weapons="
                    f"{weapon_signals['num_tracks_with_weapons']} "
                    f"total_raw={weapon_signals['total_raw_detections']}")
              for tid, s in sorted(tracks_wep.items(), key=lambda x: int(x[0])):
                  classes = ", ".join(f"{c}:{n}" for c, n in
                                       s["weapon_classes"].items())
                  print(f"  🔫 track {tid}: {s['num_weapon_frames']} frames "
                        f"({s['first_weapon_sec']}s→{s['last_weapon_sec']}s) "
                        f"[{classes}] max_conf={s['max_conf']}")
          else:
              print(f"[caption] weapon-signals unavailable: {_wep.get('reason','unknown')}")
      except FileNotFoundError:
          print("[caption] .weapons.json not found (weapon-detect step may have failed silently)")
      except Exception as e:
          print(f"[caption] weapon-signals read failed: {e}")

      # ── Action signals from action-recognize step (Phase 4) ─────────────
      action_signals = None
      actions_path = f"{workspace}/{clip_id}/.actions.json"
      try:
          with open(actions_path) as f:
              _act = json.load(f)
          if _act.get("available"):
              action_signals = {
                  "model": _act.get("model"),
                  "dataset": _act.get("dataset"),
                  "num_tracks_analyzed": _act.get("num_tracks_analyzed"),
                  "num_tracks_violence_flagged": _act.get("num_tracks_violence_flagged"),
                  "num_tracks_running_flagged": _act.get("num_tracks_running_flagged"),
                  "tracks": _act.get("tracks", {}),
                  "note": ("Per-track Kinetics-400 action recognition from a "
                           "torchvision MViT v2-S classifier applied to bbox "
                           "crops sampled across each subject's on-screen "
                           "lifetime. `top1` is the model's single best guess, "
                           "`top5` is the confidence-ranked shortlist. Two "
                           "boolean signals summarize forensic relevance:\n"
                           " - violence_signal = TRUE if any top-5 class is a "
                           "close-combat / striking action (boxing / wrestling / "
                           "kicking / sword fighting etc.). Combine with "
                           "pose_signals.geometric_incident_candidates: if a "
                           "track has both violence_signal AND another track is "
                           "prone within 5s, that's the assailant. Kinetics-400 "
                           "has NO firearm-firing class, so shooting subjects "
                           "will typically appear as 'punching person' or "
                           "'boxing' when combined with arm-extended pose.\n"
                           " - running_signal = TRUE if top-5 includes jogging/"
                           "running. Late-clip runners are typically fleeing.\n"
                           "Action confidence is often moderate (0.1-0.3) at "
                           "night / on small subjects; treat as corroborating "
                           "evidence, NOT as sole basis for a determination."),
              }
              print(f"[caption] action-signals: analyzed={action_signals['num_tracks_analyzed']} "
                    f"violence_flagged={action_signals['num_tracks_violence_flagged']} "
                    f"running_flagged={action_signals['num_tracks_running_flagged']}")
              for tid, s in sorted(action_signals["tracks"].items(),
                                    key=lambda x: int(x[0])):
                  markers = []
                  if s.get("violence_signal"): markers.append("💥")
                  if s.get("running_signal"): markers.append("🏃")
                  print(f"  track {tid}: top1='{s['top1']}' ({s['top1_conf']:.2f}) "
                        f"{''.join(markers)}")
          else:
              print(f"[caption] action-signals unavailable: {_act.get('reason','unknown')}")
      except FileNotFoundError:
          print("[caption] .actions.json not found (action-recognize step may have failed silently)")
      except Exception as e:
          print(f"[caption] action-signals read failed: {e}")

      # ── Muzzle-flash signals from muzzle-flash-detect step (Phase 5) ─────
      flash_signals = None
      flashes_path = f"{workspace}/{clip_id}/.flashes.json"
      try:
          with open(flashes_path) as f:
              _flash = json.load(f)
          if _flash.get("available"):
              flash_signals = {
                  "baseline_max_luma": _flash.get("baseline_max"),
                  "spike_threshold": _flash.get("spike_threshold"),
                  "arm_extended_tracks_scanned": _flash.get("arm_extended_tracks_scanned"),
                  "num_tracks_with_flashes": _flash.get("num_tracks_with_flashes"),
                  "tracks_with_flashes": _flash.get("tracks_with_flashes", {}),
                  "note": ("Muzzle-flash detector: pixel-level brightness "
                           "spike search around each arm-extended track's "
                           "wrist and projected muzzle point. A candidate "
                           "flash exceeds `spike_threshold` AND is transient "
                           "(≤3 keypoint frames, ~0.4s) — persistent bright "
                           "spots (headlights, floodlights) are rejected. "
                           "Combined with weapon_signals and geometric_"
                           "incident_candidates: a flash on Subject #A "
                           "co-timed with weapon detection on the same "
                           "track AND Subject #B going prone within ~2s = "
                           "SHOOTING (not brandishing). A flash without a "
                           "co-timed prone-transition on another track "
                           "is BRANDISHING or a warning-shot. Low peak_roi_"
                           "max (<250) and small over_baseline (<50) are "
                           "less-certain and should be qualified as "
                           "'possible muzzle flash'."),
              }
              print(f"[caption] flash-signals: tracks_with_flashes="
                    f"{flash_signals['num_tracks_with_flashes']} "
                    f"threshold={flash_signals['spike_threshold']}")
              for tid, ft in sorted(flash_signals["tracks_with_flashes"].items(),
                                     key=lambda x: int(x[0])):
                  for f in ft["flashes"]:
                      print(f"  💥 track {tid}: flash@{f['sec']}s "
                            f"peak={f['peak_roi_max']} "
                            f"(+{f['over_baseline']} over baseline)")
          else:
              print(f"[caption] flash-signals unavailable: {_flash.get('reason','unknown')}")
      except FileNotFoundError:
          print("[caption] .flashes.json not found (muzzle-flash-detect step may have failed silently)")
      except Exception as e:
          print(f"[caption] flash-signals read failed: {e}")

      trusted_signals = {
          "clip_duration_sec": duration_sec,
          "frame_count": len(frame_paths),
          "num_windows": num_windows,
          "window_duration_sec": round(window_duration_sec, 2),
          "mean_luminance_0_255": round(avg_lum, 1),
          "lighting_class": lighting_class,
          "per_frame_luminance": per_frame_luminance,
          "top_motion_hotspot_frames_1indexed": hotspot_frames,
          "top_motion_hotspot_timestamps_sec": hotspot_times,
          "windows": windows_meta,
          "object_detector_signals": object_signals,
          "pose_signals": pose_signals,
          "weapon_signals": weapon_signals,
          "action_signals": action_signals,
          "flash_signals": flash_signals,
      }
      print(f"[caption] TRUSTED SIGNALS lighting={lighting_class} avg_lum={avg_lum:.1f} "
            f"hotspots={hotspot_frames}")

      _ctx = ssl.create_default_context()
      _ctx.check_hostname = False
      _ctx.verify_mode = ssl.CERT_NONE

      # ── Forensic system prompt (used by both modes) ─────────────────
      # Asks for the same JSON shape so structure-and-write doesn't care.
      # Claude's reasoning is much richer over this prompt; Qwen-VL 7B
      # ignores most of the analytical asks and produces a generic
      # description, which is fine — the prompt floor doesn't hurt it.
      # ── Forensic system prompt (used by both modes) ─────────────────
      # Loaded from ConfigMap pd-vlm-system-prompt (mounted at
      # /etc/pd-vlm-system-prompt/system.txt). Externalised because the
      # inline literal + all other step scripts crossed the Linux
      # ARG_MAX ceiling that Tekton's place-scripts init container
      # runs into (~128KB across all steps).
      try:
          with open("/etc/pd-vlm-system-prompt/system.txt") as f:
              SYSTEM_PROMPT = f.read()
      except FileNotFoundError:
          # Defensive fallback so the pipeline still runs if the ConfigMap
          # is missing — Claude will produce a plain caption instead of the
          # 8-section forensic report.
          SYSTEM_PROMPT = (
              "You are a forensic CCTV analyst. Describe the clip in JSON with "
              "keys {summary, prose, entities, events}."
          )
          print("[caption] WARN: system-prompt ConfigMap missing, using stub", flush=True)

      # The events array drives the Aurora pd_cctv.events table; the
      # entities array drives pd_cctv.entities; both feed downstream chat
      # context. claims[] is consumed by the persona service only.
      #
      # USER_TEXT now leads with a `## TRUSTED SIGNALS` JSON block that the
      # SYSTEM PROMPT has trained the model to treat as ground truth. This is
      # the defense against the day/night-hallucination class of failure —
      # the model cannot invent lighting that contradicts computed luminance.
      USER_TEXT = (
          "## TRUSTED SIGNALS (pixel-derived — DO NOT contradict)\n"
          f"```json\n{json.dumps(trusted_signals, indent=2)}\n```\n\n"
          f"Clip {clip_id} · duration {trusted_signals['clip_duration_sec']}s · "
          f"split into {num_windows} time-windows.\n\n"
          "The images below are **grouped by window**. Between each window you "
          "will see a text label like `── Window N (start–end sec) ──` marking "
          "the boundary. Each window contains a chunk of frames evenly sampled "
          "across that time slice. Do NOT flatten these into one averaged "
          "picture — analyze EACH WINDOW SEPARATELY as its own scene, then "
          "synthesize the full-clip narrative from your per-window observations.\n\n"
          "For each window, before you write anything else, silently ask:\n"
          "  1. What is the lighting / setting? (must match TRUSTED SIGNALS lighting_class)\n"
          "  2. Who is present? Where are they positioned? What are their body postures?\n"
          "  3. Is anyone RUNNING, HIDING, JUMPING, PRONE, FALLING, CROUCHING, POINTING, FIGHTING,\n"
          "     or otherwise in a non-ambulatory posture? If yes: what and when.\n"
          "  4. Are there objects on the ground (weapons, bodies, debris) that weren't there before?\n"
          "  5. What CHANGED between this window and the previous one?\n"
          "If your answer to any of 3/4/5 is 'yes' → the incident lives in that window and MUST "
          "surface as a top-priority event in your Timeline + Modus Operandi + Forensic Conclusion. "
          "You are NOT permitted to conclude 'no incident occurred' or 'routine traffic' if ANY window "
          "shows a person on the ground, an arm extended in a firing/pointing posture, running that "
          "isn't jogging, or someone scrambling low. That's the exact failure class we're guarding "
          "against.\n\n"
          "Produce the JSON-only forensic narration as instructed by the SYSTEM prompt."
      )

      def _do_local_qwen():
          # OpenAI-compat chat-completion against in-cluster Qwen-VL.
          payload = {
              "model": os.environ["VLM_MODEL"],
              "max_tokens": 4096,
              "temperature": 0.2,
              "messages": [
                  {"role": "system", "content": SYSTEM_PROMPT},
                  {"role": "user", "content":
                      [{"type": "text", "text": USER_TEXT}] +
                      [{"type": "image_url",
                        "image_url": {"url": f"data:image/jpeg;base64,{b}"}}
                       for b in images_b64],
                  },
              ],
          }
          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              os.environ["VLM_ENDPOINT"],
              data=data,
              headers={"content-type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=300, context=_ctx) as resp:
              return json.loads(resp.read())

      def _do_claude_multimodal():
          # Anthropic Messages API. Wrap the response back into an
          # OpenAI-compat shape so structure-and-write doesn't branch.
          api_key = os.environ.get("ANTHROPIC_API_KEY", "")
          if not api_key:
              raise RuntimeError("claude-multimodal mode requires "
                                 "ANTHROPIC_API_KEY (Secret pd-anthropic-key)")
          # Interleave per-window text labels between the image groups so the
          # model MUST analyze each window as its own scene (lesson 17.37).
          content = [{"type": "text", "text": USER_TEXT}]
          current_win = None
          for meta, b in zip(frame_meta, images_b64):
              if meta["window"] != current_win:
                  # Emit a boundary marker before starting a new window
                  w = meta["window"]
                  w_meta = next((wm for wm in windows_meta if wm["window"] == w), None)
                  if w_meta:
                      label = (f"\n\n── **Window {w} of {num_windows}** · "
                               f"clip time {w_meta['start_sec']:.1f}s to "
                               f"{w_meta['end_sec']:.1f}s · "
                               f"{w_meta['frame_count']} frames follow ──\n")
                  else:
                      label = f"\n\n── Window {w} of {num_windows} ──\n"
                  content.append({"type": "text", "text": label})
                  current_win = meta["window"]
              content.append({
                  "type": "image",
                  "source": {"type": "base64",
                             "media_type": "image/jpeg",
                             "data": b},
              })
          # Final instruction after the last image so Claude re-reads the ask
          content.append({
              "type": "text",
              "text": ("\n\n── End of windows ──\n\n"
                       "Now produce the JSON-only forensic narration. Remember: "
                       "analyze each window separately, then synthesize the master "
                       "narrative. If ANY window shows a person prone/fallen, arm "
                       "extended in firing posture, running-not-jogging, or scrambling "
                       "low, that IS the incident — surface it prominently.")
          })
          payload = {
              "model": os.environ.get("ANTHROPIC_MODEL", "claude-sonnet-4-5"),
              # Bumped from 4096 → 16000 (lesson 17.36): the enhanced 8-section
              # forensic prose + a Forensic Conclusion + Investigative Angles
              # cannot fit under 4k tokens for a dense clip. Claude Sonnet 4.5
              # supports up to 64k output tokens; 16k gives room for a full
              # report while keeping cost predictable.
              "max_tokens": 16000,
              "temperature": 0.2,
              "system": SYSTEM_PROMPT,
              "messages": [{"role": "user", "content": content}],
          }
          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(payload).encode(),
              headers={
                  "content-type": "application/json",
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=300, context=_ctx) as resp:
              ant = json.loads(resp.read())
          text = "".join(b.get("text", "") for b in ant.get("content", [])
                         if b.get("type") == "text")
          # Wrap in OpenAI chat-completion shape so structure-and-write
          # parses it identically to the Qwen-VL response.
          return {
              "id": ant.get("id"),
              "model": ant.get("model"),
              "choices": [{"index": 0,
                           "message": {"role": "assistant", "content": text}}],
              "usage": ant.get("usage"),
              "_pd_source": "anthropic-multimodal",
          }

      try:
          if mode == "claude-multimodal":
              result = _do_claude_multimodal()
          else:
              result = _do_local_qwen()
      except urllib.error.HTTPError as e:
          body = e.read().decode("utf-8", "replace") if hasattr(e, "read") else str(e)
          print(f"[caption] HTTP {e.code}: {body}", file=sys.stderr)
          raise

      # ── Post-response hallucination guard (lesson 17.36) ───────────────────
      # The model was told the TRUSTED SIGNALS are ground truth. Verify: if
      # lighting_class = NIGHT and the narration still contains day-terms,
      # something's off. Either (a) the model contradicted the signals — we
      # inject a SANITY WARNING that will appear in the persona UI + at the
      # top of any Detective reply, and set a metadata flag routing the clip
      # to human review; or (b) the model correctly used night-terms and the
      # check is a no-op.
      import re as _re
      def _extract_prose(res):
          try:
              text = res["choices"][0]["message"]["content"]
              # Try structured JSON first
              m = _re.search(r"\{[\s\S]*\}", text)
              if m:
                  parsed = json.loads(m.group(0))
                  return parsed, text
          except Exception:
              pass
          return None, text if isinstance(text, str) else ""

      parsed, raw_text = _extract_prose(result)
      prose = ""
      if isinstance(parsed, dict):
          prose = (parsed.get("prose") or "").lower()
      elif isinstance(raw_text, str):
          prose = raw_text.lower()

      day_terms   = ["daylight", "daytime", "midday", "sunny afternoon", "broad daylight", "sunny day"]
      night_terms = ["night", "after dark", "canopy light", "canopy-lit", "streetlight",
                     "illuminated by", "dark scene", "evening", "dusk"]
      claims_day   = any(t in prose for t in day_terms)
      claims_night = any(t in prose for t in night_terms)

      sanity_flags = []
      if lighting_class == "NIGHT" and claims_day and not claims_night:
          sanity_flags.append(
              f"Model claimed daytime lighting while pixel-derived luminance "
              f"({avg_lum:.1f}/255) indicates NIGHT — probable narrative hallucination."
          )
      if lighting_class == "DAY" and claims_night and not claims_day:
          sanity_flags.append(
              f"Model claimed night lighting while pixel-derived luminance "
              f"({avg_lum:.1f}/255) indicates DAY — check narrative."
          )
      # Timeline-coverage check: does the model's Timeline reach at least 80%
      # of clip duration? Look for the maximum `<n>s` reference in the prose.
      if duration_sec > 10:
          timestamps = [float(m.group(1)) for m in _re.finditer(r"(\d+(?:\.\d+)?)\s*s\b", prose)]
          max_ts = max(timestamps) if timestamps else 0
          if max_ts < 0.8 * duration_sec:
              sanity_flags.append(
                  f"Timeline max timestamp is {max_ts:.1f}s but clip runs to "
                  f"{duration_sec}s — model may have missed the tail "
                  f"(where transient events often live)."
              )

      if sanity_flags and isinstance(parsed, dict):
          warning_md = (
              "> ⚠ **SANITY WARNING — human review recommended**  \n"
              + "\n".join(f"> • {f}" for f in sanity_flags)
              + "\n\n"
          )
          parsed["prose"] = warning_md + (parsed.get("prose") or "")
          parsed["_sanity_flags"] = sanity_flags
          parsed["_trusted_signals"] = trusted_signals
          # Re-wrap the corrected JSON back into the OpenAI shape so
          # structure-and-write picks up the annotated prose.
          result["choices"][0]["message"]["content"] = json.dumps(parsed)
          print(f"[caption] SANITY FLAGS raised: {sanity_flags}", file=sys.stderr)
      elif isinstance(parsed, dict):
          # No flags — still attach the trusted signals so persona can reference
          parsed["_trusted_signals"] = trusted_signals
          result["choices"][0]["message"]["content"] = json.dumps(parsed)

      with open(out_path, "w") as f:
          json.dump(result, f)
      print(f"[caption] wrote {out_path} ({os.path.getsize(out_path)} bytes) "
            f"lighting={lighting_class} flags={len(sanity_flags)}")
    computeResources:
      requests:
        cpu: "100m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  volumes:
  - name: vlm-mode-cm
    configMap:
      name: pd-vlm-mode
      optional: true
  - name: vlm-system-prompt
    configMap:
      name: pd-vlm-system-prompt
      optional: true

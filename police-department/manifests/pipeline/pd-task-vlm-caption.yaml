# =============================================================================
#  Task 02 — vlm-caption
#  Extracts N keyframes via ffmpeg, base64-encodes them, then POSTs an
#  OpenAI-compatible chat completion request to the in-cluster Qwen2.5-VL
#  endpoint (http://pd-qwen25-vl-7b.pd-cctv.svc:8080/v1/chat/completions)
#  with the keyframes as image content parts. Output: per-clip caption JSON
#  on the shared workspace.
#
#  This task triggers the Qwen-VL InferenceService cold-start; first run
#  takes ~120s. Subsequent runs in the same demo session are <30s.
# =============================================================================
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pd-task-vlm-caption
  namespace: pd-cctv
  labels:
    app.kubernetes.io/part-of: police-department
spec:
  params:
  - name: clip-id
    type: string
  - name: frames
    type: string
    # Must be ≤ vLLM's --limit-mm-per-prompt={"image":N} (currently 4 in
    # pd-vllm-vlm-runtime.yaml). Bumping the runtime to 8 would push the
    # worst-case prompt past max-model-len=8192 (8 frames × ~1280 visual
    # tokens + 2048 completion = 12288). Keep 4 in lockstep with the
    # runtime.
    default: "4"
    description: Number of keyframes to sample (must be ≤ runtime image limit)
  workspaces:
  - name: shared
  steps:
  - name: extract-keyframes
    image: docker.io/jrottenberg/ffmpeg:6.1-alpine
    script: |
      #!/bin/sh
      set -eu
      cd "$(workspaces.shared.path)/$(params.clip-id)"
      # Clear stale keyframes — the shared workspace is RWX EFS and
      # persists across PipelineRuns. If a previous run extracted N=8
      # frames and we now extract N=4, the old frame_005..008.jpg would
      # remain and the caption step's glob picks up all 8, busting
      # vLLM's --limit-mm-per-prompt cap.
      rm -rf frames
      mkdir -p frames
      duration=$(ffprobe -v error -show_entries format=duration \
                  -of default=noprint_wrappers=1:nokey=1 clip.mp4 | awk '{printf "%d", $1}')
      [ "$duration" -lt 1 ] && duration=1
      step=$(( duration / $(params.frames) ))
      [ "$step" -lt 1 ] && step=1
      ffmpeg -hide_banner -loglevel error -i clip.mp4 \
             -vf "fps=1/${step},scale=448:-1" \
             -frames:v $(params.frames) \
             frames/frame_%03d.jpg
      ls frames/
  - name: caption
    image: registry.access.redhat.com/ubi9/python-311:latest
    env:
    # Public Route via OpenShift Router → Knative ingress → activator →
    # vLLM. The cluster-internal Knative-local-gateway path is finicky
    # for non-mesh callers (Tekton task pods have no istio sidecar) so we
    # use the well-known public Route for reliability.
    - name: VLM_ENDPOINT
      value: "https://pd-qwen25-vl-7b-predictor-pd-cctv.apps.ai-demo.iisdemolab.click/v1/chat/completions"
    - name: VLM_MODEL
      value: "pd-qwen25-vl-7b"
    script: |
      #!/usr/bin/env python3
      import base64, json, os, sys, glob, urllib.request, urllib.error
      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      frames_dir = f"{workspace}/{clip_id}/frames"
      out_path  = f"{workspace}/{clip_id}/caption.json"
      images = []
      for fp in sorted(glob.glob(f"{frames_dir}/*.jpg")):
          with open(fp, "rb") as f:
              b64 = base64.b64encode(f.read()).decode("ascii")
          images.append({"type": "image_url",
                         "image_url": {"url": f"data:image/jpeg;base64,{b64}"}})
      payload = {
          "model": os.environ["VLM_MODEL"],
          # 2048 gives the model room for a detailed multi-paragraph
          # narrative + populated entities/events. 512 was truncating.
          "max_tokens": 2048,
          "temperature": 0.2,
          "messages": [
              {"role": "system",
               "content": (
                   "You are a senior CCTV analyst writing a forensic narration of a clip. "
                   "You MUST return a JSON object with EXACTLY these fields: "
                   "prose (string), entities (list of {kind,label}), events (list of {action,t_start_sec,t_end_sec,confidence}). "
                   "REQUIREMENTS:\n"
                   "1. `prose` MUST be a detailed paragraph of 4-8 sentences describing every visible person, vehicle, object, action, and environmental detail across the keyframes IN CHRONOLOGICAL ORDER. Mention timing using phrases like 'in the first frame', 'around 0:05', 'as the clip ends'. NEVER return a one-line summary.\n"
                   "2. `entities` MUST list every distinct subject you see — kind ∈ {person, vehicle, object, place}; label is a short descriptor (e.g. 'grey sedan', 'pedestrian in red jacket', 'overhead light'). Aim for 3-10 entries.\n"
                   "3. `events` MUST list 2-5 actions with t_start_sec/t_end_sec estimated from frame index (frame_001 = 0s, each subsequent frame = ~1-2s apart). action is a short verb phrase. confidence is 0.0-1.0.\n"
                   "Return ONLY the JSON object. No prose outside JSON."
               )},
              {"role": "user",
               "content": [
                   {"type": "text",
                    "text": f"Clip {clip_id}. {len(images)} keyframes follow in chronological order. Produce the JSON narration per the system instructions. Be detailed and specific."},
                   *images,
               ]}
          ]
      }
      data = json.dumps(payload).encode("utf-8")
      req = urllib.request.Request(
          os.environ["VLM_ENDPOINT"],
          data=data,
          headers={"Content-Type": "application/json"},
          method="POST")
      # Public Route uses cluster-CA-signed cert; urllib in this UBI image
      # may not have it in the default trust store. Skip verify for the
      # in-cluster API call — we're already inside the cluster network and
      # the demo doesn't transmit secrets here.
      import ssl
      _ctx = ssl.create_default_context()
      _ctx.check_hostname = False
      _ctx.verify_mode = ssl.CERT_NONE
      try:
          with urllib.request.urlopen(req, timeout=300, context=_ctx) as resp:
              body = resp.read().decode("utf-8")
      except urllib.error.HTTPError as e:
          print(f"[vlm-caption] HTTP {e.code}: {e.read().decode('utf-8', 'replace')}", file=sys.stderr)
          raise
      print(f"[vlm-caption] response received ({len(body)} bytes)")
      with open(out_path, "w") as f:
          f.write(body)
      print(f"[vlm-caption] wrote {out_path}")

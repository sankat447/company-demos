  # action-recognize (per-track temporal action classification)
  # PHASE 4 of the CV-stack upgrade. For each ByteTrack track, extracts a
  # 32-frame temporal window centered on the middle of the track's lifetime,
  # crops each frame to the track's bbox (with 25% padding for arm-reach
  # context), assembles into a spatiotemporal tensor, and classifies with
  # torchvision MViT v2-S (Kinetics-400, Apache-2.0 weights).

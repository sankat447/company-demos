          transforms = weights.transforms()
          print(f"[action-recognize] model=mvit_v2_s Kinetics-400 loaded ({len(labels)} classes) device={device}",
                flush=True)
      except Exception as e:
          traceback.print_exc()
          _bail(f"model load failed: {type(e).__name__}: {e}")

      tracks = tracks_data.get("tracks", {})
      vid_stride = tracks_data.get("vid_stride", 1)
      src_fps = tracks_data.get("video_src_fps", 30.0)

      def sec_of(fidx):
          return round(fidx * vid_stride / src_fps, 3)

      NUM_FRAMES = 16
      CROP_PAD = 0.25   # add 25% padding around bbox for context

      def crop_and_stack(track_dets):
          """Return a tensor (T, C, H, W) of NUM_FRAMES bbox crops
          uniformly sampled across the track's lifetime, or None if too
          few detections available."""
          if len(track_dets) < 3:
              return None
          idxs = [int(round(i * (len(track_dets) - 1) / (NUM_FRAMES - 1)))
                  for i in range(NUM_FRAMES)]
          frames = []
          for i in idxs:
              det = track_dets[i]
              fp = f"{dense_dir}/f_{det['frame_idx']:06d}.jpg"
              if not os.path.exists(fp):
                  return None
              img = cv2.imread(fp)  # BGR
              if img is None:
                  return None
              h, w = img.shape[:2]
              x1, y1, x2, y2 = det["bbox"]
              bw, bh = x2 - x1, y2 - y1
              pad_x = bw * CROP_PAD; pad_y = bh * CROP_PAD
              cx1 = max(0, int(x1 - pad_x))
              cy1 = max(0, int(y1 - pad_y))
              cx2 = min(w, int(x2 + pad_x))
              cy2 = min(h, int(y2 + pad_y))
              crop = img[cy1:cy2, cx1:cx2]
              if crop.size == 0:
                  return None
              resized = cv2.resize(crop, (256, 256))
              resized = cv2.cvtColor(resized, cv2.COLOR_BGR2RGB)
              frames.append(resized)
          arr = np.stack(frames, axis=0)   # (T, H, W, C)
          tensor = torch.from_numpy(arr).permute(0, 3, 1, 2)   # (T, C, H, W)
          return tensor

      per_track_actions = {}
      violence_flagged = []
      running_flagged = []

      for tid, t in tracks.items():
          dets = t.get("detections", [])
          if len(dets) < 3:
              continue
          try:
              clip = crop_and_stack(dets)
              if clip is None:
                  continue
              x = transforms(clip)         # (C, T, H, W)
              x = x.unsqueeze(0).to(device)  # (1, C, T, H, W) on GPU when available
              with torch.no_grad():
                  logits = model(x)
              probs = torch.softmax(logits, dim=-1)[0]
              top_p, top_i = torch.topk(probs, 5)
              preds = [(labels[i.item()], round(p.item(), 4))
                       for p, i in zip(top_p, top_i)]
              is_violence = any(cls in VIOLENCE_LABELS for cls, _ in preds)
              is_running = any(cls in RUNNING_LABELS for cls, _ in preds)
              per_track_actions[tid] = {
                  "track_id": int(tid),
                  "middle_sec": round((t["first_sec"] + t["last_sec"]) / 2, 2),
                  "duration_sec": t["duration_sec"],
                  "top5": preds,
                  "top1": preds[0][0],
                  "top1_conf": preds[0][1],
                  "violence_signal": is_violence,
                  "running_signal": is_running,
              }
              if is_violence:
                  violence_flagged.append((tid, preds[0][0], preds[0][1]))
              if is_running:
                  running_flagged.append((tid, preds[0][0], preds[0][1]))
          except Exception as e:
              print(f"  ⚠️ track {tid} failed: {type(e).__name__}: {e}", flush=True)
              continue

      actions_out = {
          "available": True,
          "model": "mvit_v2_s",
          "dataset": "Kinetics-400",
          "frames_per_clip": NUM_FRAMES,
          "crop_padding_ratio": CROP_PAD,
          "num_tracks_analyzed": len(per_track_actions),
          "num_tracks_violence_flagged": len(violence_flagged),
          "num_tracks_running_flagged": len(running_flagged),
          "tracks": per_track_actions,
      }
      with open(actions_path, "w") as f:
          json.dump(actions_out, f)
      size_kb = os.path.getsize(actions_path) / 1024
      print(f"[action-recognize] tracks_analyzed={len(per_track_actions)} "
            f"violence_flagged={len(violence_flagged)} "
            f"running_flagged={len(running_flagged)} "
            f"payload={size_kb:.1f}KB", flush=True)
      if violence_flagged:
          print("[action-recognize] 🚨 Violence-labeled tracks (Kinetics-400):")
          for tid, cls, cf in violence_flagged:
              print(f"  track {tid}: '{cls}' conf={cf}", flush=True)
      if running_flagged:
          print("[action-recognize] 🏃 Running-labeled tracks:")
          for tid, cls, cf in running_flagged:
              print(f"  track {tid}: '{cls}' conf={cf}", flush=True)

  # Phase 5: pixel-level muzzle-flash detector per track (pure Python).
  # For each arm-extended pose frame, probe a 25x25 ROI at the wrist +
  # projected-muzzle points; a flash = ROI luma >=225 AND >=30 above the
  # same-position ROI luma in the immediately-adjacent keypoint frames.
  - name: muzzle-flash-detect
    image: registry.access.redhat.com/ubi9/python-311:latest
    script: |
      #!/usr/bin/env python3
      import os, sys, json, subprocess, math

      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      clip_dir = f"{workspace}/{clip_id}"
      dense_dir = f"{clip_dir}/dense_frames"
      poses_path   = f"{clip_dir}/.poses.json"
      tracks_path  = f"{clip_dir}/.tracks.json"
      flashes_path = f"{clip_dir}/.flashes.json"

      def _bail(reason):
          try:
              with open(flashes_path, "w") as f:
                  json.dump({"available": False, "reason": reason}, f)
          except Exception:
              pass
          print(f"[muzzle-flash-detect] skipped — {reason}", flush=True)
          sys.exit(0)

      if not os.path.isdir(dense_dir):
          _bail("dense_frames/ not present")
      if not os.path.exists(poses_path):
          _bail(".poses.json missing")
      if not os.path.exists(tracks_path):
          _bail(".tracks.json missing")
      try:
          poses_data = json.load(open(poses_path))
          tracks_data = json.load(open(tracks_path))
          if not poses_data.get("available") or not tracks_data.get("available"):
              _bail("prerequisite signal(s) unavailable")
      except Exception as e:
          _bail(f"json read failed: {e}")

      try:
          from PIL import Image
      except ImportError:
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--quiet",
               "--disable-pip-version-check", "Pillow"],
              timeout=120,
          )
          from PIL import Image

      FLASH_LUMA_THRESHOLD = 225
      ROI_HALF = 12          # 25x25 window
      MIN_SPIKE_OVER_BASELINE = 40   # ROI max must exceed clip-baseline+40
      MAX_CONSECUTIVE_FLASH_FRAMES = 3

      vid_stride = tracks_data.get("vid_stride", 1)
      src_fps = tracks_data.get("video_src_fps", 30.0)

      def wrist_and_muzzle(kps):
          def visible(k): return k[2] >= 0.3
          wrist = None; elbow = None; shoulder = None
          if visible(kps[10]):
              wrist, elbow, shoulder = kps[10], kps[8], kps[6]
          elif visible(kps[9]):
              wrist, elbow, shoulder = kps[9], kps[7], kps[5]
          if wrist is None:
              return None, None
          origin = elbow if elbow and elbow[2] >= 0.3 else shoulder
          if origin is None or origin[2] < 0.3:
              return (wrist[0], wrist[1]), None
          dx = wrist[0] - origin[0]; dy = wrist[1] - origin[1]
          scale = 0.5
          muzzle = (wrist[0] + dx * scale, wrist[1] + dy * scale)
          return (wrist[0], wrist[1]), muzzle

      def sample_roi_max(img_gray, cx, cy):
          w, h = img_gray.size
          x1 = max(0, int(cx - ROI_HALF)); y1 = max(0, int(cy - ROI_HALF))
          x2 = min(w, int(cx + ROI_HALF)); y2 = min(h, int(cy + ROI_HALF))
          if x2 <= x1 or y2 <= y1:
              return 0
          crop = img_gray.crop((x1, y1, x2, y2))
          return max(crop.getdata())

      import glob
      all_frames = sorted(glob.glob(f"{dense_dir}/f_*.jpg"))
      if len(all_frames) < 5:
          _bail("too few dense frames")
      baseline_samples = all_frames[::max(1, len(all_frames)//20)][:20]
      p99_values = []
      for fp in baseline_samples:
          g = Image.open(fp).convert("L")
          data = sorted(g.getdata(), reverse=True)
          cutoff_idx = max(1, len(data) // 100)
          p99_values.append(data[cutoff_idx])
      baseline_max = max(p99_values)   # 99th-percentile-max across sampled frames
      spike_threshold = max(FLASH_LUMA_THRESHOLD, baseline_max + MIN_SPIKE_OVER_BASELINE)
      print(f"[muzzle-flash-detect] baseline_p99_max={baseline_max} "
            f"spike_threshold={spike_threshold}", flush=True)

      per_track_flashes = {}
      arm_extended_track_count = 0
      arm_extended_frames_scanned = 0

      _img_cache = {}
      def _get_gray(frame_idx):
          if frame_idx in _img_cache:
              return _img_cache[frame_idx]
          fp = f"{dense_dir}/f_{frame_idx:06d}.jpg"
          if not os.path.exists(fp):
              return None
          g = Image.open(fp).convert("L")
          _img_cache[frame_idx] = g
          return g

      TEMPORAL_JUMP_MIN = 30

      for tid, t in poses_data.get("tracks", {}).items():
          arm_segments = [s for s in t.get("segments", [])
                          if s.get("posture") == "arm-extended"]
          if not arm_segments:
              continue
          arm_extended_track_count += 1
          def in_arm_segment(sec):
              return any(s["start_sec"] <= sec <= s["end_sec"] for s in arm_segments)

          kp_frames = t.get("keypoints_downsampled", [])
          samples = []
          for kpf in kp_frames:
              kps = kpf.get("kps") or []
              if len(kps) < 17:
                  continue
              wrist, muzzle = wrist_and_muzzle(kps)
              if wrist is None:
                  continue
              samples.append({"sec": kpf["sec"], "frame_idx": kpf["frame_idx"],
                              "wrist": wrist, "muzzle": muzzle})

          candidate_events = []
          for i, s in enumerate(samples):
              if not in_arm_segment(s["sec"]):
                  continue
              arm_extended_frames_scanned += 1
              img = _get_gray(s["frame_idx"])
              if img is None:
                  continue
              w_max = sample_roi_max(img, s["wrist"][0], s["wrist"][1])
              m_max = sample_roi_max(img, s["muzzle"][0], s["muzzle"][1]) if s["muzzle"] else 0
              cur_max = max(w_max, m_max)

              neighbour_maxes = []
              for j in (i - 1, i + 1):
                  if 0 <= j < len(samples):
                      nimg = _get_gray(samples[j]["frame_idx"])
                      if nimg is not None:
                          nw = sample_roi_max(nimg, s["wrist"][0], s["wrist"][1])
                          nm = sample_roi_max(nimg, s["muzzle"][0], s["muzzle"][1]) if s["muzzle"] else 0
                          neighbour_maxes.append(max(nw, nm))
              neighbour_max = max(neighbour_maxes) if neighbour_maxes else 0

              if (cur_max >= FLASH_LUMA_THRESHOLD
                  and cur_max >= neighbour_max + TEMPORAL_JUMP_MIN):
                  candidate_events.append({
                      "sec": s["sec"],
                      "frame_idx": s["frame_idx"],
                      "wrist_roi_max": w_max,
                      "muzzle_roi_max": m_max,
                      "over_baseline": cur_max - baseline_max,
                      "over_neighbours": cur_max - neighbour_max,
                  })

          if not candidate_events:
              continue
          candidate_events.sort(key=lambda e: e["sec"])
          groups = []
          cur = [candidate_events[0]]
          for e in candidate_events[1:]:
              if e["sec"] - cur[-1]["sec"] <= 0.75:
                  cur.append(e)
              else:
                  groups.append(cur); cur = [e]
          groups.append(cur)
          transient = [g for g in groups if len(g) <= MAX_CONSECUTIVE_FLASH_FRAMES]
          if not transient:
              continue
          flashes = []
          for g in transient:
              peak = max(g, key=lambda e: max(e["wrist_roi_max"], e["muzzle_roi_max"]))
              flashes.append({
                  "sec": round(peak["sec"], 2),
                  "frame_idx": peak["frame_idx"],
                  "peak_roi_max": max(peak["wrist_roi_max"], peak["muzzle_roi_max"]),
                  "over_baseline": peak["over_baseline"],
                  "group_size": len(g),
              })
          per_track_flashes[tid] = {
              "track_id": int(tid),
              "num_flashes": len(flashes),
              "flashes": flashes,
          }

      flashes_out = {
          "available": True,
          "baseline_max": baseline_max,
          "spike_threshold": spike_threshold,
          "flash_luma_threshold": FLASH_LUMA_THRESHOLD,
          "roi_half": ROI_HALF,
          "arm_extended_tracks_scanned": arm_extended_track_count,
          "arm_extended_frames_scanned": arm_extended_frames_scanned,
          "num_tracks_with_flashes": len(per_track_flashes),
          "tracks_with_flashes": per_track_flashes,
      }
      with open(flashes_path, "w") as f:
          json.dump(flashes_out, f)
      size_kb = os.path.getsize(flashes_path) / 1024
      print(f"[muzzle-flash-detect] arm_extended_tracks={arm_extended_track_count} "
            f"frames_scanned={arm_extended_frames_scanned} "
            f"tracks_with_flashes={len(per_track_flashes)} "
            f"payload={size_kb:.1f}KB", flush=True)
      if per_track_flashes:
          print("[muzzle-flash-detect] 💥 Flash candidates:")
          for tid, ft in sorted(per_track_flashes.items(), key=lambda x: int(x[0])):
              for f in ft["flashes"]:
                  print(f"  track {tid}: flash@{f['sec']}s peak={f['peak_roi_max']} "
                        f"(+{f['over_baseline']} over baseline, group={f['group_size']})",
                        flush=True)

  # Phase 6: event-fusion. Consumes tracks/poses/weapons/actions/flashes and
  # emits .events.json — a per-track chronological event timeline plus a
  # role verdict (VICTIM/ARMED/AGGRESSOR/BYSTANDER) and cross-track
  # correlations. Caption step reads this as its primary structured signal.
  - name: event-fusion
    image: registry.access.redhat.com/ubi9/python-311:latest
    script: |
      #!/usr/bin/env python3
      import os, sys, json

      clip_id = "$(params.clip-id)"
      workspace = "$(workspaces.shared.path)"
      d = f"{workspace}/{clip_id}"
      events_path = f"{d}/.events.json"

      def _load(p, default=None):
          try:
              with open(p) as f:
                  data = json.load(f)
              if data.get("available") is False:
                  return default
              return data
          except Exception:
              return default

      tracks = _load(f"{d}/.tracks.json", {"tracks": {}}) or {"tracks": {}}
      poses = _load(f"{d}/.poses.json", {"tracks": {}}) or {"tracks": {}}
      weapons = _load(f"{d}/.weapons.json", {"tracks_with_weapons": {}}) or {"tracks_with_weapons": {}}
      actions = _load(f"{d}/.actions.json", {"tracks": {}}) or {"tracks": {}}
      flashes = _load(f"{d}/.flashes.json", {"tracks_with_flashes": {}}) or {"tracks_with_flashes": {}}

      def _bail(reason):
          with open(events_path, "w") as f:
              json.dump({"available": False, "reason": reason}, f)
          print(f"[event-fusion] skipped — {reason}", flush=True)
          sys.exit(0)

      if not tracks.get("tracks"):
          _bail("no tracks — Phase 1 must run first")

      clip_dur = tracks.get("clip_duration_sec", 0)
      geo = poses.get("geometric_incident_candidates", {}) or {}

      per_track_events = {}
      master_timeline = []

      for tid, t in tracks.get("tracks", {}).items():
          events = []
          first, last = t["first_sec"], t["last_sec"]
          events.append({"sec": first, "event": "enters_frame"})
          events.append({"sec": last,  "event": "exits_frame"})
          pose_t = poses.get("tracks", {}).get(tid) or {}
          for seg in pose_t.get("segments", []) or []:
              if seg.get("posture") in ("prone", "arm-extended", "running", "crouched", "falling"):
                  events.append({"sec": seg["start_sec"],
                                 "event": f"posture_start:{seg['posture']}",
                                 "duration_sec": round(seg["end_sec"] - seg["start_sec"], 2)})
          for ch in pose_t.get("changes", []) or []:
              events.append({"sec": ch["sec"],
                             "event": f"posture_change:{ch['from']}→{ch['to']}"})
          g = geo.get(tid) or {}
          for iv in g.get("sustained_prone_intervals", []) or []:
              events.append({"sec": iv["start_sec"],
                             "event": "prone_interval",
                             "duration_sec": iv["duration_sec"],
                             "peak_aspect": iv.get("peak_aspect"),
                             "confidence": "HIGH_CONFIDENCE"})
          for fe in g.get("fall_events", []) or []:
              events.append({"sec": fe["sec"], "event": "fall_event",
                             "aspect_before": fe.get("aspect_before"),
                             "aspect_after": fe.get("aspect_after")})
          w = weapons.get("tracks_with_weapons", {}).get(tid) or {}
          for det in w.get("detections", []) or []:
              events.append({"sec": det["sec"],
                             "event": f"weapon_visible:{det.get('class')}",
                             "confidence": det.get("conf")})
          a = actions.get("tracks", {}).get(tid) or {}
          if a.get("top1"):
              events.append({"sec": a.get("middle_sec", (first+last)/2),
                             "event": f"action:{a['top1']}",
                             "confidence": a.get("top1_conf"),
                             "violence_signal": a.get("violence_signal", False),
                             "running_signal": a.get("running_signal", False)})
          f = flashes.get("tracks_with_flashes", {}).get(tid) or {}
          for fl in f.get("flashes", []) or []:
              events.append({"sec": fl["sec"], "event": "muzzle_flash_candidate",
                             "peak_roi_max": fl.get("peak_roi_max"),
                             "over_baseline": fl.get("over_baseline")})
          events.sort(key=lambda e: e["sec"])
          # Role verdict
          is_victim = bool(g.get("sustained_prone_intervals") and
                            g.get("longest_prone_duration_sec", 0) > 5)
          is_armed  = bool(w.get("num_weapon_frames", 0) >= 2)
          is_fleeing = bool(a.get("running_signal", False) and
                             (last / max(clip_dur, 1)) > 0.66)
          role = "BYSTANDER"
          reason_parts = []
          if is_victim:
              role = "VICTIM"
              reason_parts.append(
                  f"prone {g.get('longest_prone_duration_sec')}s across "
                  f"{len(g.get('sustained_prone_intervals') or [])} intervals")
          elif is_armed:
              role = "ARMED_SUBJECT"
              cls_str = ",".join((w.get("weapon_classes") or {}).keys())
              reason_parts.append(
                  f"{w.get('num_weapon_frames')} weapon frames "
                  f"({w.get('first_weapon_sec')}s→{w.get('last_weapon_sec')}s, "
                  f"{cls_str})")
              if a.get("violence_signal"):
                  reason_parts.append(f"action='{a.get('top1')}'")
          elif is_fleeing:
              role = "FLEEING"
              reason_parts.append(f"action='{a.get('top1')}' late in clip")
          verdict = {
              "track_id": int(tid),
              "role": role,
              "reason": "; ".join(reason_parts) if reason_parts else "no incident-relevant signals",
              "first_sec": first, "last_sec": last,
              "duration_sec": t["duration_sec"],
              "num_events": len(events),
          }
          per_track_events[tid] = {"verdict": verdict, "events": events}
          for e in events:
              master_timeline.append({"track_id": int(tid), **e})

      master_timeline.sort(key=lambda e: e["sec"])

      # Cross-track correlations: an armed subject firing near another
      # subject's knock-down = strongest shooting evidence.
      correlations = []
      victims = [(tid, per_track_events[tid]) for tid in per_track_events
                 if per_track_events[tid]["verdict"]["role"] == "VICTIM"]
      armed   = [(tid, per_track_events[tid]) for tid in per_track_events
                 if per_track_events[tid]["verdict"]["role"] == "ARMED_SUBJECT"]
      for vt, vd in victims:
          vg = geo.get(vt) or {}
          fall_times = [iv["start_sec"] for iv in (vg.get("sustained_prone_intervals") or [])]
          for at, ad in armed:
              aw = weapons.get("tracks_with_weapons", {}).get(at) or {}
              wep_secs = [det["sec"] for det in (aw.get("detections") or [])]
              af = flashes.get("tracks_with_flashes", {}).get(at) or {}
              flash_secs = [fl["sec"] for fl in (af.get("flashes") or [])]
              for ft in fall_times:
                  for ws_ in wep_secs:
                      if abs(ws_ - ft) <= 5.0:
                          correlations.append({
                              "kind": "ARMED_NEAR_VICTIM_DOWN",
                              "victim_track": int(vt),
                              "armed_track": int(at),
                              "victim_prone_start_sec": ft,
                              "armed_weapon_seen_sec": ws_,
                              "delta_sec": round(ws_ - ft, 2),
                              "flash_within_2s": any(abs(fs - ft) <= 2 for fs in flash_secs),
                          })
      out = {
          "available": True,
          "clip_duration_sec": clip_dur,
          "num_tracks": len(per_track_events),
          "role_counts": {r: sum(1 for e in per_track_events.values()
                                  if e["verdict"]["role"] == r)
                          for r in ("VICTIM","ARMED_SUBJECT","FLEEING","BYSTANDER")},
          "per_track": per_track_events,
          "master_timeline": master_timeline,
          "cross_track_correlations": correlations,
      }
      with open(events_path, "w") as f:
          json.dump(out, f)
      size_kb = os.path.getsize(events_path) / 1024
      print(f"[event-fusion] tracks={len(per_track_events)} "
            f"master_timeline_events={len(master_timeline)} "
            f"correlations={len(correlations)} "
            f"role_counts={out['role_counts']} "
            f"payload={size_kb:.1f}KB", flush=True)
      for tid, e in sorted(per_track_events.items(), key=lambda x: int(x[0])):
          v = e["verdict"]
          print(f"  track {tid}: {v['role']} — {v['reason']}", flush=True)
      if correlations:
          print("[event-fusion] 🚨 Cross-track correlations:")
          for c in correlations:
              print(f"  {c['kind']}: victim={c['victim_track']}@{c['victim_prone_start_sec']}s, "
                    f"armed={c['armed_track']}@{c['armed_weapon_seen_sec']}s "
                    f"(Δ={c['delta_sec']}s, flash={c['flash_within_2s']})",
                    flush=True)

  - name: caption
    image: registry.access.redhat.com/ubi9/python-311:latest
    env:
    # Local Qwen-VL endpoint (Knative Route, OpenShift Router → activator → vLLM).
    - name: VLM_ENDPOINT
      value: "https://pd-qwen25-vl-7b-predictor-pd-cctv.apps.ai-demo.iisdemolab.click/v1/chat/completions"
    - name: VLM_MODEL
      value: "pd-qwen25-vl-7b"
    # Anthropic API for claude-multimodal mode.

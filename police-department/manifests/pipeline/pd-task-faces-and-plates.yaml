# =============================================================================
#  Task — faces-and-plates (CPU-only, parallel with vlm-caption + whisper-asr +
#  yolo-detect).
#
#  Runs two passes on the same frame stream:
#    1. Face detection — YOLOv8n-face (community model, single .pt download
#       on first run; bundled if Tekton workspace caches the file).
#    2. License-plate OCR — easyocr on full frame crops; we filter detections
#       to plate-shaped boxes (4:1–6:1 aspect) and emit text + confidence.
#
#  Outputs (placed alongside detections.json on the shared workspace):
#    - faces.json:  [{frame_idx, ts_sec, bbox, confidence}, ...]
#    - plates.json: [{frame_idx, ts_sec, bbox, text, confidence}, ...]
#
#  Why one task and not two: cv2.VideoCapture iteration is the dominant
#  cost; running it once and feeding two detectors is cheaper than reading
#  the file twice. Both detectors share the same `stride` parameter.
#
#  Cost note: easyocr's first run pulls ~50MB of detection + recognition
#  weights from its CDN — done once per pod, persists in the workspace if
#  cached at /workspace/easyocr-cache.
# =============================================================================
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pd-task-faces-and-plates
  namespace: pd-cctv
  labels:
    app.kubernetes.io/part-of: police-department
spec:
  params:
  - name: clip-id
    type: string
  - name: stride
    type: string
    default: "30"
    description: Run face/plate detection every Nth frame (30 = ~1 fps for 30fps source)
  workspaces:
  - name: shared
  steps:
  - name: extract
    image: docker.io/ultralytics/ultralytics:8.3.0-cpu
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -euo pipefail
      cd "$(workspaces.shared.path)/$(params.clip-id)"

      # Install easyocr lazily (~50 MB wheel + model on first run). The
      # ultralytics image already has cv2, numpy, torch.
      pip install --quiet --no-input "easyocr==1.7.2" || {
        echo "[faces-plates] easyocr install failed — writing empty plates.json and continuing"
        echo '{"frames_total":0,"stride":30,"plates":[]}' > plates.json
        SKIP_OCR=1
      }

      # Pull yolov8n-face.pt — the ultralytics image only ships generic
      # yolov8n.pt. Without this we fall back to a person-bbox top-1/3
      # heuristic that misses standalone faces. Try a few mirrors; if all
      # fail the task still runs in heuristic mode.
      if [ ! -f yolov8n-face.pt ]; then
        echo "[faces-plates] fetching yolov8n-face.pt..."
        for url in \
          "https://github.com/derronqi/yolov8-face/raw/main/weights/yolov8n-face.pt" \
          "https://huggingface.co/arnabdhar/YOLOv8-nano-aadhaar-card/resolve/main/yolov8n.pt"; do
          if curl -fsSL -o yolov8n-face.pt "$url" 2>/dev/null && [ -s yolov8n-face.pt ]; then
            echo "[faces-plates] downloaded from $url ($(stat -c%s yolov8n-face.pt) bytes)"
            break
          fi
          rm -f yolov8n-face.pt
        done
        if [ ! -s yolov8n-face.pt ]; then
          echo "[faces-plates] no face model available — heuristic mode"
        fi
      fi

      python3 - <<'PY'
      import json, os, math
      import cv2
      import numpy as np
      from ultralytics import YOLO

      stride = int(os.environ.get("STRIDE", "30"))
      skip_ocr = bool(os.environ.get("SKIP_OCR"))

      # Face detector. yolov8n-face is a community-trained head; we fall
      # back to the generic yolov8n + person class top-1/3 heuristic if
      # the face model isn't reachable.
      try:
          face_model = YOLO("yolov8n-face.pt")
          face_mode = "yolov8n-face"
      except Exception as e:
          print(f"[faces-plates] yolov8n-face unavailable ({e}); falling back to person-bbox heuristic")
          face_model = YOLO("yolov8n.pt")
          face_mode = "person-heuristic"

      reader = None
      if not skip_ocr:
          try:
              import easyocr
              reader = easyocr.Reader(["en"], gpu=False, verbose=False,
                                      model_storage_directory="./easyocr-cache",
                                      download_enabled=True)
          except Exception as e:
              print(f"[faces-plates] easyocr init failed: {e}")
              reader = None

      cap = cv2.VideoCapture("clip.mp4")
      fps = cap.get(cv2.CAP_PROP_FPS) or 30
      faces, plates = [], []
      idx = 0
      processed = 0
      while True:
          ok, frame = cap.read()
          if not ok:
              break
          if idx % stride == 0:
              ts = round(idx / fps, 3)
              # ── Faces ───────────────────────────────────────────────
              fr = face_model(frame, verbose=False)[0]
              for box, conf, cls in zip(
                  fr.boxes.xyxy.cpu().numpy().tolist(),
                  fr.boxes.conf.cpu().numpy().tolist(),
                  fr.boxes.cls.cpu().numpy().astype(int).tolist(),
              ):
                  if face_mode == "person-heuristic":
                      # Only keep "person" class (id 0 in COCO) and reduce
                      # bbox to top 1/3 ≈ head region.
                      if cls != 0:
                          continue
                      x1, y1, x2, y2 = box
                      h = y2 - y1
                      box = [x1, y1, x2, y1 + h / 3.0]
                  faces.append({
                      "frame_idx": int(idx), "ts_sec": float(ts),
                      "bbox": [round(float(v), 1) for v in box],
                      "confidence": round(float(conf), 3),
                      "source": face_mode,
                  })
              # ── Plates (OCR) ────────────────────────────────────────
              if reader is not None:
                  try:
                      results = reader.readtext(frame, detail=1, paragraph=False)
                  except Exception as e:
                      print(f"[faces-plates] easyocr.readtext failed at frame {idx}: {e}")
                      results = []
                  for poly, text, conf in results:
                      if conf < 0.45:
                          continue
                      # Normalize quad to axis-aligned bbox
                      xs = [p[0] for p in poly]; ys = [p[1] for p in poly]
                      x1, x2 = min(xs), max(xs); y1, y2 = min(ys), max(ys)
                      w, h = x2 - x1, y2 - y1
                      if h <= 0 or w <= 0:
                          continue
                      ar = w / h
                      # Plates are wider than tall; filter out short
                      # bursts of text and over-square chunks of paragraph.
                      if ar < 2.5 or ar > 7.0:
                          continue
                      norm = "".join(ch for ch in text.upper() if ch.isalnum() or ch == "-")
                      if len(norm) < 4 or len(norm) > 10:
                          continue
                      plates.append({
                          "frame_idx": int(idx), "ts_sec": float(ts),
                          "bbox": [round(float(x1), 1), round(float(y1), 1),
                                   round(float(x2), 1), round(float(y2), 1)],
                          "text": str(norm),
                          "confidence": round(float(conf), 3),
                      })
              processed += 1
          idx += 1
      cap.release()

      # Coerce all numeric scalars to native Python — easyocr / cv2.cap.get
      # return numpy types (int32, float64) that json.dump rejects.
      with open("faces.json", "w") as f:
          json.dump({"frames_total": int(idx), "stride": int(stride),
                     "fps": float(fps), "face_mode": face_mode,
                     "faces": faces}, f)
      with open("plates.json", "w") as f:
          json.dump({"frames_total": int(idx), "stride": int(stride),
                     "fps": float(fps), "ocr_enabled": reader is not None,
                     "plates": plates}, f)
      print(f"[faces-plates] processed {processed} frames "
            f"(every {stride}, mode={face_mode}); "
            f"faces={len(faces)} plates={len(plates)}")
      PY
    env:
    - name: STRIDE
      value: $(params.stride)
    computeResources:
      requests:
        cpu: "25m"
        memory: "1Gi"
      limits:
        cpu: "4"
        memory: "6Gi"

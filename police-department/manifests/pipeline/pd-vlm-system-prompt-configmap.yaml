      transferring   it, adjusting concealment)\\n- If no such patterns observed,
      write 'Standard ambulatory movement; no   non-ambulatory patterns observed.'\\n\\n##
      Timeline\\n- Bullet list of MO milestones with clip-relative timestamps.\\n-

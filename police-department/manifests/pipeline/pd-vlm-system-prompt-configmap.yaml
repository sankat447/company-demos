      egress), call it out.\\n- If this appears to be a rehearsed / repeat MO (multiple
      prior incidents   of this signature could exist), say 'consistent with a repeat
      MO' and   briefly justify.\\n\\n## Weapons \\u0026 Threats\\n- Every visible
      weapon or plausible weapon: handgun, long-gun, knife, bat,   crowbar, taser,
      pepper-spray, improvised weapon (brick, bottle), etc.\\n- For each: **type**

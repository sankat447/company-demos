      is parked, whether the engine is running (exhaust visible?   brake lights on?),
      whether doors/liftgate are open.\\n\\n## Suspects / People\\n- A markdown table
      with columns: # | Clothing | Build | Face-covered? | Role.\\n  One row per distinguishable
      person. Note masks / hoods / balaclavas explicitly.\\n  Role examples: 'ringleader
      (directs others)', 'lookout (stays at doorway,   scans street)', 'driver (stays

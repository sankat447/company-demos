      / brandishing / shooting)\\n      3. In Forensic Conclusion: state weapon presence
      as          confirmed evidence with HIGH confidence\\n    An armed subject (weapon_signals)
      + another subject in     geometric_incident_candidates (prone/fall) within ~5s

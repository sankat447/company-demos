      \    noise pre-filtered). If this field has ANY entries:\\n      1. In Weapons
      \\u0026 Threats: list every armed subject by          Subject # matching their
      track_id, with the weapon          class and the first-seen / last-seen timestamps\\n
      \     2. In Modus Operandi: name the incident class based on          weapon

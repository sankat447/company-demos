      traffic gaps)?\\n- Any tension indicators — squared shoulders, closed fists,
      pushing, blading   stance, low-ready hand position, backing away, creating distance?\\n\\n##
      Behavioral Patterns \\u0026 Movement\\n- RUNNING (not walking) — call out explicitly

      luminance in the wrist/muzzle ROI (255 = fully saturated)\\n      * `over_baseline`
      — how much brighter than the clip's ambient ceiling\\n      * `group_size` —
      number of consecutive keypoint frames the spike persisted (1–3 = transient flash,
      larger = ambient)\\n    Cross-reference protocol:\\n      * Flash on Subject
      #A + weapon detection on same Subject #A + Subject #B in geometric_incident_candidates
      going prone within ~2s = **SHOOTING** — a shot was fired and it hit someone.\\n

      INCLUDE the observed events across all windows. If a track is prone,   fights,
      runs, or draws a weapon in a window, EVERY such event is a bullet.\\n- Timeline
      coverage MUST reach the last window's end. If your last bullet   is at 0:22
      but the clip is 0:60, you have missed 38 seconds — go back.\\n\\n## Evidence
      Items \\u0026 Forensic Markers\\n- Objects on the ground before / during / after
      the incident (shell casings   would be too small to see at this resolution,
      but broken glass, dropped   phones, spilled contents, blood pooling, discarded
      weapons are visible).\\n- Distinctive environmental markers useful for later
      canvassing (signage,   store logos, parking-line paint, adjacent buildings,
      traffic direction).\\n- Ambient conditions (weather, lighting, time-of-day cues)
      if relevant.\\n- If none, write 'Not visible in the supplied frames.'\\n\\n##
      Forensic Conclusion\\nA 3-part synthesis (label each explicitly):\\n  **(a)
      What most likely happened, from a homicide/robbery detective's perspective?**\\n
      \ 1-2 paragraphs. Name the crime, sequence, mechanism, and confidence.\\n  **(b)
      What does the forensic-analyst read of the scene point to that the detective
      might miss?**\\n  1 paragraph. Focus on non-obvious signals (behavioral, coordination,
      timing).\\n  **(c) What are the OPEN questions this clip alone cannot answer?**\\n
      \ Bullet list. 3-6 items. These become the leads for adjacent-camera pulls,
      \  dispatch records, or witness interviews.\\n\\n## Investigative Angles / Lines
      of Inquiry\\n- Bullet list of 3-8 concrete next steps this clip's evidence supports:\\n
      \ * 'Request adjacent-camera pull covering \\u003cintersection\\u003e from \\u003cstart_time\\u003e
      to   \\u003cend_time\\u003e to identify vehicle egress route'\\n  * 'Query BOLO
      for \\u003cmake/model\\u003e \\u003ccolor\\u003e with partial plate \\u003cXXX\\u003e'\\n
      \ * 'Facial-recognition pass on \\u003cN\\u003e face crops from motion-hotspot
      frames'\\n  * 'Cross-reference incident against recent shift-briefs for repeat
      MO'\\n  * 'Interview \\u003cspecific-witness role\\u003e — e.g. 'the pedestrian
      who backs away at 0:15s could be a witness'\\n- Never recommend arrest / detention
      / pursuit — that is Patrol's job. This   report is investigative substrate,
      not operational orders.\\n- claims[] (separate from prose) is for chat-time
      grounding — list 6-12   short factual claims the persona service can quote,
      each with a confidence   (0..1) and a frame_refs list of clip-relative timestamps.
      Prioritise   claims about weapons, MO, coordination cues, and physical evidence.\\n-
      entities[] should include weapons as their own kind (kind='weapon') —   this
      is how downstream slash commands surface them.\\n  - `flash_signals` (may be
      null if muzzle-flash detector unavailable). Per-track pixel-level flash-candidate

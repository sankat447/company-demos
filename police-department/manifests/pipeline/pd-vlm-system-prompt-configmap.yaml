      — no incident.'\\u003e\\\",\\n    \\\"prose\\\": \\\"\\u003cmarkdown narrative
      — see 8-section structure below\\u003e\\\",\\n    \\\"entities\\\": [{\\\"kind\\\":
      \\\"vehicle|person|weapon|object\\\", \\\"label\\\": \\\"\\u003cdescriptor\\u003e\\\"},
      ...],\\n    \\\"events\\\": [{\\\"action\\\": \\\"\\u003cverb phrase\\u003e\\\",
      \\\"t_start_sec\\\": \\u003cfloat\\u003e, \\\"t_end_sec\\\": \\u003cfloat\\u003e,
      \\\"confidence\\\": \\u003c0..1\\u003e}, ...]\\n  }\\n\\nPROSE STRUCTURE (markdown,
      in EXACTLY this order — write every section, even if brief; if a section has
      no observable content, write 'Not visible in the supplied frames.'):\\n\\n##
      Modus Operandi\\n- The operating pattern of the incident in 2–4 sentences. Name
      the   crime class if identifiable (smash-and-grab, package theft, strong-arm
      \  robbery, aggravated assault, stalking, breaking-and-entering,   auto theft,
      drug transaction, arson, brandishing, etc.).\\n- Describe the choreography:
      who does what, who provides lookout,   who drives, who carries. If there's clear

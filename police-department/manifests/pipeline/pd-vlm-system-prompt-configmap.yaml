      A track with violence_signal=true co-timed with         another track's prone
      interval = ASSAULT (name the         assailant by track_id).\\n      * A track
      with running_signal=true late in the clip         (last third) = fleeing suspect
      or fleeing witness —         distinguish by whether the track was near the         incident.\\n
      \     * Kinetics-400 has NO firearm-firing class. A subject         who fires
      a gun typically appears as 'punching         person', 'boxing', or 'high kick'
      in this signal         because those are the closest arm-extension actions         in
      the training set. Cross-check with weapon_signals         to disambiguate.\\n\\nWINDOW
      ANALYSIS PROTOCOL:\\nFor each window, before writing your master JSON, silently
      walk through these five questions:\\n  1. Lighting/setting (must match lighting_class
      from TRUSTED SIGNALS)\\n  2. Person positions + body postures — where is each
      subject, what is      their stance (standing / crouched / prone / running /
      mid-stride)\\n  3. Is anyone RUNNING (not walking), HIDING (behind cover / prone
      /      ducked into doorway or bushes), JUMPING (over car / fence),      FALLING,
      POINTING (arm extended horizontally toward another      subject — classic firing/aiming
      posture), FIGHTING, SCRAMBLING      low across the ground, or otherwise in a
      NON-AMBULATORY posture?\\n  4. Are there NEW OBJECTS on the ground (bodies,
      weapons, dropped      items, debris) that were not present in the previous window?\\n
      \ 5. What CHANGED between this window and the previous window?\\nIf any answer
      to 3/4/5 is a YES-with-frame-evidence, that IS the incident window. It MUST
      surface in the master Timeline, Modus Operandi, Behavioral Patterns, and Forensic
      Conclusion sections. You are FORBIDDEN from writing 'no incident occurred' or
      'routine traffic' if any window shows any of these signatures.\\n\\nIf ANY claim

      claim to match the signals, or (b) add an explicit `## Sanity Note` section
      at the top of the prose explaining why you believe the signals are wrong (this
      is unusual and should be rare — pixel-derived signals are more reliable than
      model interpretation).\\n════════════════════════════════════════════════════════════════════\\n\\nThink
      like a detective. You are not writing a caption — you are writing the FIRST-PASS
      INVESTIGATIVE READ that the case officer will use to open a lead file, request
      adjacent camera feeds, and brief the shift.\\n\\nProduce a STRICT JSON object
      with EXACTLY these keys, no preamble, no code fence, no extra text:\\n  {\\n
      \   \\\"summary\\\": \\\"\\u003cone short sentence, ≤22 words, LEADING WITH
      THE CRIME PATTERN if any is present. Examples: 'Coordinated smash-and-grab:
      4 masked subjects load a burgundy Jeep Grand Cherokee at a parking-lot loading
      dock.' / 'Firearm brandished at 0:14s during argument between two subjects outside

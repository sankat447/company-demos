<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>pd-cctv — HITL queue</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           max-width: 1100px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { margin-bottom: 4px; }
    .meta { color: #555; font-size: 13px; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #e2e2e2; vertical-align: top; }
    th { text-align: left; background: #f7f7f9; }
    .persona { font-weight: 600; text-transform: uppercase; font-size: 11px;
               letter-spacing: 0.05em; padding: 2px 8px; border-radius: 4px;
               background: #eef; color: #224; }
    .prose { max-width: 540px; }
    button { font-family: inherit; padding: 6px 12px; border: 1px solid #ccc;
             background: #fff; cursor: pointer; border-radius: 4px; }
    button:hover { background: #f3f3f3; }
    button.approve { border-color: #2c8a3a; color: #2c8a3a; }
    button.reject  { border-color: #c0392b; color: #c0392b; }
    .empty { color: #777; padding: 24px; text-align: center; }
    .pending-id { font-family: ui-monospace, "SF Mono", monospace;
                  font-size: 11px; color: #888; }
    textarea { width: 100%; font: inherit; }
  </style>
</head>
<body>
  <h1>HITL approval queue</h1>
  <p class="meta">
    police-department demo &mdash;
    Auto-refreshes every 5 s.
    Pending responses live for 10 min then expire.
  </p>

  <div hx-get="/hitl/queue.partial"
       hx-trigger="load, every 5s"
       hx-swap="innerHTML">
    {% include "queue_rows.html" %}
  </div>
</body>
</html>

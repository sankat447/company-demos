[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pd-personas"
version = "0.2.0"
description = "Police-Department demo: LangGraph persona service (Detective / Patrol / Evidence Clerk) with HITL approval"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "httpx==0.27.2",
    "psycopg[binary]==3.2.3",
    "pydantic==2.9.2",
    "redis==5.1.1",
    "langgraph==0.2.39",
    "langchain-core==0.3.13",
    "sentence-transformers==3.2.1",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "boto3==1.35.40",
    "kubernetes==31.0.0",
    "imageio-ffmpeg==0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

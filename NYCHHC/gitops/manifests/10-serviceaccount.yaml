# Backend ServiceAccount (L4: defined in the same manifest set that references it).
# The UBI python-311 image runs fine under the default restricted-v2 SCC with an
# arbitrary UID, so no anyuid binding is needed (L1 only applies to fixed-UID images).
# If terraform enable_irsa=true, deploy.sh patches on the eks.amazonaws.com/role-arn
# annotation here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nychhc-copilot-sa
  namespace: nychhc-demo
  labels:
    demo: nychhc
# Pods pull the backend/frontend images from ECR using this docker-registry secret,
# created/refreshed out-of-band by deploy.sh (ECR token ~12h). Referenced here so the
# pull config is GitOps-consistent (selfHeal won't strip it).
imagePullSecrets:
  - name: ecr-push

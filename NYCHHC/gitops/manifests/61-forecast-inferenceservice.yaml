# Coverage-Forecast predictor (DR-08) — CPU sklearn on KServe. See 60-* for notes.
# Client POSTs {"instances": [[dept_id, day_of_week]]} →
#   http://forecast-predictor.nychhc-demo.svc.cluster.local/v1/models/forecast:predict
# → {"predictions": [required_staff]}.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: forecast
  namespace: nychhc-demo
  labels:
    demo: nychhc
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    serviceAccountName: nychhc-copilot-sa
    minReplicas: 1
    model:
      modelFormat:
        name: sklearn
      protocolVersion: v1
      storageUri: s3://ai-demo-data-lake/models/nychhc/forecast/
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi

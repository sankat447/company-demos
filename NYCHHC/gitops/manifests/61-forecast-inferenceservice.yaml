# Coverage-Forecast predictor (DR-08) — CPU sklearn on KServe via nychhc-sklearn.
# Client POSTs {"instances": [[dept_id, day_of_week]]} to
#   http://forecast-predictor.nychhc-demo.svc.cluster.local:8080/v1/models/forecast:predict
# → {"predictions": [required_staff]}.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: forecast
  namespace: nychhc-demo
  labels:
    demo: nychhc
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    serviceAccountName: nychhc-copilot-sa
    minReplicas: 1
    model:
      modelFormat:
        name: sklearn
      runtime: nychhc-sklearn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

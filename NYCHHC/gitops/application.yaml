# Standalone ArgoCD Application for the NYCHHC demo.
# Applied by deploy.sh (oc apply). Does NOT edit the platform app-of-apps, so the
# demo is fully independent and destroy.sh can delete just this Application.
#
# NOTE: the demo's Aurora Secret is bootstrapped out-of-band by deploy.sh and is
# intentionally NOT in the synced path — so selfHeal/prune never blanks it
# (police-department lesson: git-empty secrets get wiped on sync).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nychhc-demo
  namespace: openshift-gitops
  labels:
    demo: nychhc
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade-prune children on delete
spec:
  project: default
  source:
    repoURL: https://github.com/sankat447/company-demos
    targetRevision: feature/nychhc-v1
    path: NYCHHC/gitops/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: nychhc-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

# In-cluster binary build for the Streamlit frontend. deploy.sh runs:
#   oc -n nychhc-demo start-build nychhc-frontend --from-dir=frontend --follow
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: nychhc-frontend
  namespace: nychhc-demo
  labels:
    demo: nychhc
spec:
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: DockerImage
      name: 406337554361.dkr.ecr.us-east-1.amazonaws.com/nychhc/frontend:0.1.0
    pushSecret:
      name: ecr-push

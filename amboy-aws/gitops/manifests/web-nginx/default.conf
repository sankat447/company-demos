# BFF: serve the SPA and proxy /api/* to in-cluster amboy services (same-origin,
# http east-west). Request headers (Authorization, X-Amboy-Roles) pass through.
upstream agent   { server amboy-compare-agent.amboy.svc.cluster.local:8080; }
upstream metrics { server amboy-metrics-engine.amboy.svc.cluster.local:8080; }
upstream deid    { server amboy-deid-gateway.amboy.svc.cluster.local:8080; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Keep-alive to upstreams + retry a transient blip (e.g. during a pod rollout)
  # so a brief 502/connect error doesn't surface as "indexing failed".
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  # Long CPU ops (index/detect/chat embed many chunks). Generous read/send
  # timeouts; do NOT retry (retrying a long POST would double-process).
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_next_upstream off;

  # ---- compare-agent ----
  location = /api/chat {                 # SSE — must not buffer
    proxy_pass http://agent/chat;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }
  location /api/comparisons  { proxy_pass http://agent/comparisons; }
  location = /api/audit        { proxy_pass http://agent/audit; }
  location = /api/analyze      { proxy_pass http://agent/analyze; }
  location = /api/compare_docs { proxy_pass http://agent/compare_docs; proxy_read_timeout 120s; }
  location = /api/chat_pdf     { proxy_pass http://agent/chat_pdf; proxy_read_timeout 120s; }
  location = /api/comparability    { proxy_pass http://agent/comparability; proxy_read_timeout 120s; }
  location = /api/index_comparison { proxy_pass http://agent/index_comparison; proxy_read_timeout 180s; }
  location /api/training            { proxy_pass http://agent/training; }

  # ---- metrics-engine ----
  location = /api/compare     { proxy_pass http://metrics/compare; }
  location = /api/flag_policy { proxy_pass http://metrics/flag_policy; }
  location = /api/scenario    { proxy_pass http://metrics/scenario; }

  # ---- deid-gateway ----
  client_max_body_size 30m;             # allow PDF/DOCX uploads
  location = /api/detokenize       { proxy_pass http://deid/detokenize; }
  location = /api/ingest           { proxy_pass http://deid/ingest; }
  location = /api/ingest_document  { proxy_pass http://deid/ingest_document; proxy_read_timeout 180s; }
  location = /api/detect           { proxy_pass http://deid/detect; proxy_read_timeout 180s; }
  location = /api/detect_text      { proxy_pass http://deid/detect_text; proxy_read_timeout 60s; }
  location = /api/commit           { proxy_pass http://deid/commit; proxy_read_timeout 180s; }
  location = /api/commit_artifact  { proxy_pass http://deid/commit_artifact; proxy_read_timeout 120s; }
  location /api/artifacts          { proxy_pass http://deid/artifacts; proxy_read_timeout 60s; }
  location = /api/purge_comparison { proxy_pass http://deid/purge_comparison; }
  location = /api/retrieve         { proxy_pass http://deid/retrieve; }

  # SPA fallback (client-side routing)
  location / { try_files $uri $uri/ /index.html; }
}

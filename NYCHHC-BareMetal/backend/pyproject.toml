[project]
name = "nychhc-copilot"
version = "0.1.0"
description = "NYC H+H Predictive Hospital Workforce & Patient-Flow — agentic copilot backend (FOR DEMONSTRATION ONLY — SYNTHETIC DATA)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Layered in as we wire real services (kept out of the echo-mode core).
agent = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=0.2",   # OpenAI-compatible client → pointed at Portkey (Claude)
    "mcp>=1.2",                # MCP server tool surface
    "httpx>=0.27",
]
data = [
    "psycopg[binary]>=3.2",    # in-stack Postgres / pgvector
    "pgvector>=0.3",
    "boto3>=1.35",             # MinIO (S3-compatible) for model artifacts
]
telemetry = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nychhc_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

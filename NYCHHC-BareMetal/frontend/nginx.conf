# NYCHHC-BareMetal frontend — static SPA + same-origin BFF proxy to the backend.
# Runs as the nginx-unprivileged image (listens :8080, OpenShift arbitrary-UID safe).
worker_processes auto;
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  # nginx-unprivileged can only write under /tmp at an arbitrary UID.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BFF: proxy API + KServe-style calls to the backend service in iis-ai-ai.
    location /api/ {
      proxy_pass http://nychhc-backend.iis-ai-ai.svc:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;             # required for the /api/chat SSE stream
      proxy_read_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

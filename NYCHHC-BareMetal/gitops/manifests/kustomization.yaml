# NYCHHC-BareMetal demo — kustomize base. ArgoCD syncs this dir.
# Resources carry their OWN namespace (they span iis-ai-{ai,ui,data}), so we
# deliberately do NOT set a kustomize `namespace:` (which would flatten them).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs: {demo: nychhc, app.kubernetes.io/part-of: nychhc}
    includeSelectors: false

resources:
  # bootstrap
  - 00-serviceaccount.yaml
  - 10-bootstrap-pgvector.yaml      # schema + synthetic seed on the in-stack Postgres
  - 11-bootstrap-minio.yaml         # nychhc-models bucket + publish joblib artifacts
  - 20-configmap.yaml               # non-secret backend config (env)
  # predictive models (CPU KServe) — two InferenceServices + stable ClusterIPs
  - 22-noshow-model.yaml
  - 23-forecast-model.yaml
  # app
  - 30-backend.yaml                 # FastAPI copilot (router + scheduling + tools)
  - 60-frontend.yaml                # static SPA + /demoer (nginx BFF) + Route

configMapGenerator:
  - name: nychhc-schema-sql
    namespace: iis-ai-data
    files:
      - schema.sql=sql/schema.sql

generatorOptions:
  disableNameSuffixHash: true   # stable name so the bootstrap Job's volume ref is fixed

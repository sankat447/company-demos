# App service accounts, one per tier the demo runs workloads in. The images run as
# arbitrary-UID-safe users (UBI python / nginx-unprivileged), so the default
# restricted-v2 SCC suffices — NO anyuid needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nychhc
  namespace: iis-ai-ai
  labels: {demo: nychhc, app.kubernetes.io/part-of: nychhc}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nychhc
  namespace: iis-ai-ui
  labels: {demo: nychhc, app.kubernetes.io/part-of: nychhc}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nychhc
  namespace: iis-ai-data
  labels: {demo: nychhc, app.kubernetes.io/part-of: nychhc}

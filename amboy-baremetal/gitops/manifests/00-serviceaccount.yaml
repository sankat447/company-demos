# App service accounts. The image runs as a non-root, arbitrary-UID-safe user
# (Dockerfile: USER 1001 + chgrp 0/g=u), so the default `restricted-v2` SCC is
# sufficient — NO anyuid needed (spec: anyuid only for fixed-UID images).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amboy
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amboy
  namespace: iis-ai-ui
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
---
# Let the agent stop/provision the PII model (patch InferenceService minReplicas)
# during a Model Training run.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amboy-isvc-scaler
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amboy-isvc-scaler
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amboy-isvc-scaler
subjects:
  - kind: ServiceAccount
    name: amboy
    namespace: iis-ai-ai
  # the DSP pipeline task pods run as this SA; the deploy step patches the KServe IS
  - kind: ServiceAccount
    name: pipeline-runner-amboy-dsp
    namespace: iis-ai-ai
---
# Let the agent SA reach the Data Science Pipelines KFP API: the DSP oauth-proxy
# authorizes callers via a SAR for `get` on its own Route. Granting that lets the
# agent (and the pipeline-upload Job) submit/track runs with the SA token.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amboy-dsp-client
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    resourceNames: ["ds-pipeline-amboy-dsp"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amboy-dsp-client
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amboy-dsp-client
subjects:
  - kind: ServiceAccount
    name: amboy
    namespace: iis-ai-ai

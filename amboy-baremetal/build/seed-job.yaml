# One-off seed Job: generates the two synthetic reports and uploads them to the
# MinIO raw bucket using the built amboy image (AMBOY_ROLE=seed). Applied OUT OF
# BAND by deploy.sh (not ArgoCD) after the image build. Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: amboy-seed
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata: {labels: {demo: amboy}}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: amboy
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/iis-ai-ai/amboy:latest
          env:
            - {name: AMBOY_ROLE, value: "seed"}
            - name: AMBOY_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: amboy-creds, key: S3_ACCESS_KEY}}
            - name: AMBOY_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: amboy-creds, key: S3_SECRET_KEY}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}

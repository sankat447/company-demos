# Amboy — in-cluster image build (baremetal has NO ECR; use the OpenShift
# internal registry). ONE image, tagged amboy:latest, built into iis-ai-ai and
# pulled cross-namespace by iis-ai-ui via the RoleBinding below.
#
# Applied imperatively by deploy.sh (binary build):
#   oc -n iis-ai-ai apply -f build/buildconfig.yaml
#   oc -n iis-ai-ai start-build amboy --from-dir=amboy --follow
# NOT in the ArgoCD-synced path — ArgoCD should not manage one-shot builds.
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: amboy
  namespace: iis-ai-ai
  labels:
    demo: amboy
    app.kubernetes.io/part-of: amboy
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: amboy
  namespace: iis-ai-ai
  labels:
    demo: amboy
    app.kubernetes.io/part-of: amboy
spec:
  source:
    type: Binary           # populated by `oc start-build --from-dir=amboy`
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: build/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: amboy:latest
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 6Gi}   # torch + sentence-transformers build is heavy
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
---
# Let iis-ai-ui pods (e.g. the Streamlit UI) pull the image built in iis-ai-ai.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amboy-image-puller-from-ui
  namespace: iis-ai-ai
  labels:
    demo: amboy
    app.kubernetes.io/part-of: amboy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:iis-ai-ui

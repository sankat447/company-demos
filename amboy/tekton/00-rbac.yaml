# ServiceAccount + RBAC for the Amboy OpenShift Pipelines (Tekton). The pipelines
# run as `amboy-pipeline`; it can start the in-cluster binary builds, roll the
# Deployments + the KServe InferenceService, run the seed Jobs, and read Routes.
# A second binding in iis-ai-ui lets it build/roll the web image there.
# NOTE: this is the Tekton (CI/CD + app-orchestration) path — it does NOT touch the
# OpenShift AI model training (Data Science Pipelines) which stays as-is.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amboy-pipeline
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amboy-pipeline
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
rules:
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs/instantiatebinary"]
    verbs: ["create"]
  - apiGroups: ["build.openshift.io"]
    resources: ["builds", "buildconfigs", "builds/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amboy-pipeline
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: amboy-pipeline}
subjects:
  - {kind: ServiceAccount, name: amboy-pipeline, namespace: iis-ai-ai}
---
# iis-ai-ui: build + roll the web image (cross-namespace subject = the same SA).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amboy-pipeline
  namespace: iis-ai-ui
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
rules:
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs/instantiatebinary"]
    verbs: ["create"]
  - apiGroups: ["build.openshift.io"]
    resources: ["builds", "buildconfigs", "builds/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amboy-pipeline
  namespace: iis-ai-ui
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: amboy-pipeline}
subjects:
  - {kind: ServiceAccount, name: amboy-pipeline, namespace: iis-ai-ai}

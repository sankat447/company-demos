# App service accounts. The image runs as a non-root, arbitrary-UID-safe user
# (Dockerfile: USER 1001 + chgrp 0/g=u), so the default `restricted-v2` SCC is
# sufficient — NO anyuid needed (spec: anyuid only for fixed-UID images).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amboy
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amboy
  namespace: iis-ai-ui
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}

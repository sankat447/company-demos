# App service accounts. The image runs as a non-root, arbitrary-UID-safe user
# (Dockerfile: USER 1001 + chgrp 0/g=u), so the default `restricted-v2` SCC is
# sufficient — NO anyuid needed (spec: anyuid only for fixed-UID images).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amboy
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amboy
  namespace: iis-ai-ui
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
---
# Let the agent stop/provision the PII model (patch InferenceService minReplicas)
# during a Model Training run.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amboy-isvc-scaler
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amboy-isvc-scaler
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amboy-isvc-scaler
subjects:
  - kind: ServiceAccount
    name: amboy
    namespace: iis-ai-ai

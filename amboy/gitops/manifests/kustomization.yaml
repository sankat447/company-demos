# Amboy NPI-Safe demo — kustomize base. ArgoCD syncs this dir.
# Resources carry their OWN namespace (they span iis-ai-{ai,ui,data,system}),
# so we deliberately do NOT set a kustomize `namespace:` (which would flatten them).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs: {demo: amboy, app.kubernetes.io/part-of: amboy}
    includeSelectors: false

resources:
  # M3 — bootstrap
  - 00-serviceaccount.yaml
  - 10-bootstrap-pgvector.yaml
  - 11-bootstrap-minio.yaml
  - 12-bootstrap-vault.yaml
  # M4 — privacy gateway
  - 20-presidio.yaml
  - 22-pii-model.yaml
  - 30-deid-gateway.yaml
  # M5 — deterministic engine
  - 40-metrics-engine.yaml
  # M6 — narrate-only agent
  - 50-compare-agent.yaml
  # M7 — UI + edge-TLS Route
  - 60-ui.yaml
  # React web UI (BFF) — chat-driven workspace
  - 61-web.yaml
  # M8 — governance (n8n workflow + Grafana dashboard) — see 70/71 below

configMapGenerator:
  - name: amboy-schema-sql
    namespace: iis-ai-data
    files:
      - 01-schema.sql=sql/01-schema.sql
  - name: amboy-n8n-workflow            # M8 — import into the running n8n
    namespace: iis-ai-ui
    files:
      - workflow.json=assets/n8n-workflow.json
  - name: amboy-grafana-dashboard       # M8 — picked up by the Grafana dashboard sidecar
    namespace: iis-ai-ui
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - amboy-governance.json=assets/grafana-dashboard.json

generatorOptions:
  disableNameSuffixHash: true   # stable names so volume/sidecar refs are fixed

# Idempotent: creates the raw (NPI) + de-id MinIO buckets and best-effort enables
# server-side encryption. SSE-S3 needs a MinIO KMS; if the platform MinIO has none,
# the bucket is still created and a warning is logged (tracked as a demo gap).
apiVersion: batch/v1
kind: Job
metadata:
  name: amboy-minio-init
  namespace: iis-ai-data
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  backoffLimit: 8
  template:
    metadata: {labels: {demo: amboy}}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until mc alias set amboy "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do
                echo "waiting for minio..."; sleep 3; done
              mc mb --ignore-existing amboy/amboy-raw
              mc mb --ignore-existing amboy/amboy-deid
              # Server-side encryption (best-effort: requires MinIO KMS).
              mc encrypt set sse-s3 amboy/amboy-raw  || echo "WARN: SSE-S3 needs MinIO KMS (raw bucket created unencrypted) — demo gap"
              mc encrypt set sse-s3 amboy/amboy-deid || echo "WARN: SSE-S3 needs MinIO KMS (deid bucket created unencrypted) — demo gap"
              # Belt-and-braces: deny anonymous access on both buckets.
              mc anonymous set none amboy/amboy-raw  || true
              mc anonymous set none amboy/amboy-deid || true
              echo "amboy buckets ready (idempotent)"
          env:
            - {name: S3_ENDPOINT, value: "http://minio.iis-ai-data.svc:9000"}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: amboy-creds, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: amboy-creds, key: S3_SECRET_KEY}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}

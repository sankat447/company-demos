# amboy-pii-model — Piiranha (DeBERTa) PII/NPI detector served on OpenShift AI via
# a KServe InferenceService (RawDeployment, CPU). Shows in the RHOAI dashboard's
# Model Serving (iis-ai-ai is labelled a Data Science Project by deploy.sh).
# Custom container = the amboy image's pii_model role (Piiranha baked in).
# KServe creates: ClusterIP Service amboy-pii-model:8080 (what the gateway calls)
# + headless amboy-pii-model-predictor. imagePullPolicy:Always so it tracks :latest.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: amboy-pii-model
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    openshift.io/display-name: "Amboy PII/NPI Detector (Piiranha)"
spec:
  predictor:
    containers:
      - name: kserve-container
        image: image-registry.openshift-image-registry.svc:5000/iis-ai-ai/amboy:latest
        imagePullPolicy: Always
        env:
          - {name: AMBOY_ROLE, value: pii_model}
          - {name: PORT, value: "8080"}
          # S3 creds so the served model can load the fine-tuned head from MinIO.
          - name: AMBOY_S3_ACCESS_KEY
            valueFrom: {secretKeyRef: {name: amboy-creds, key: S3_ACCESS_KEY}}
          - name: AMBOY_S3_SECRET_KEY
            valueFrom: {secretKeyRef: {name: amboy-creds, key: S3_SECRET_KEY}}
        ports:
          - {containerPort: 8080, protocol: TCP}
        resources:
          requests: {cpu: "1", memory: 1.5Gi}
          limits: {cpu: "4", memory: 4Gi}   # headroom for concurrent chunk detection
---
# Stable ClusterIP the gateway calls. KServe's own service naming has varied
# across reconciles (sometimes only the headless -predictor exists), so we own a
# fixed Service -> predictor pods on 8080. This is what config.PII_MODEL_URL hits.
apiVersion: v1
kind: Service
metadata:
  name: amboy-pii-model
  namespace: iis-ai-ai
  labels: {demo: amboy, app.kubernetes.io/part-of: amboy}
spec:
  selector:
    serving.kserve.io/inferenceservice: amboy-pii-model
    component: predictor
  ports: [{name: http, port: 8080, targetPort: 8080, protocol: TCP}]

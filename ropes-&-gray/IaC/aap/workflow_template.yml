---
# aap/workflow_template.yml
# Import with: awx workflow_job_templates import < workflow_template.yml
# Or configure manually in AAP controller UI.

name: "Hybrid Patch Workflow"
description: "Full patch lifecycle: pre-check → patch → verify → rollback on failure"
organization: "Default"
inventory: "Hybrid Patch Demo"
limit: ""
extra_vars: |
  dry_run: false
  patch_max_concurrency: "10%"
ask_variables_on_launch: true
ask_limit_on_launch: true

survey_spec:
  name: "Patch workflow inputs"
  description: "Variables collected from the change approver or Jira webhook"
  spec:
    - question_name: "Jira Ticket ID"
      question_description: "e.g. CHG-1042"
      variable: jira_ticket_id
      type: text
      required: true
      default: ""

    - question_name: "Target hosts (inventory group or hostname)"
      question_description: "e.g. windows_azure / windows_aws / windows"
      variable: target_hosts
      type: multiplechoice
      choices:
        - windows
        - windows_azure
        - windows_aws
      required: true
      default: "windows"

    - question_name: "Dry run (check mode – no changes applied)"
      question_description: "Set to true for rehearsal before maintenance window"
      variable: dry_run
      type: multiplechoice
      choices:
        - "false"
        - "true"
      required: true
      default: "false"

    - question_name: "Maintenance window label (informational)"
      question_description: "Label from Azure Update Manager or your policy"
      variable: patch_window
      type: text
      required: false
      default: "weekly-saturday-0200utc"

# ── Workflow nodes ─────────────────────────────────────────────────────────────
workflow_nodes:

  - identifier: "pre-change-snapshot"
    unified_job_template:
      name: "Pre-Change Snapshot"
      type: job_template
    related:
      success_nodes:
        - identifier: "patch-windows"
      failure_nodes:
        - identifier: "notify-jira-failure"

  - identifier: "patch-windows"
    unified_job_template:
      name: "Patch Windows Security Updates"
      type: job_template
    related:
      success_nodes:
        - identifier: "post-change-verify"
      failure_nodes:
        - identifier: "rollback-patch"

  - identifier: "post-change-verify"
    unified_job_template:
      name: "Post-Change Verify"
      type: job_template
    related:
      success_nodes:
        - identifier: "notify-jira-success"
      failure_nodes:
        - identifier: "rollback-patch"

  - identifier: "rollback-patch"
    unified_job_template:
      name: "Rollback Patch"
      type: job_template
    related:
      success_nodes:
        - identifier: "notify-jira-failure"

  - identifier: "notify-jira-success"
    unified_job_template:
      name: "Notify Jira – Success"
      type: job_template

  - identifier: "notify-jira-failure"
    unified_job_template:
      name: "Notify Jira – Failure"
      type: job_template

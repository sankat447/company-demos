---
# aap/job_templates.yml
# All individual job templates referenced by the workflow.
# Import: awx job_templates import < job_templates.yml

- name: "Pre-Change Snapshot"
  description: "Record system state before patching (KB list, uptime, services, Azure snapshot)"
  job_type: run
  inventory: "Hybrid Patch Demo"
  project: "Hybrid Patch Playbooks"
  playbook: "playbooks/patch_workflow.yml"
  credentials:
    - "Windows Machine Credential"
    - "Azure Service Principal"
    - "Jira API Token"
  extra_vars: |
    phase_override: pre_only
  ask_variables_on_launch: true
  execution_environment: "ee-windows-patching"

- name: "Patch Windows Security Updates"
  description: "Apply Windows security and critical updates via win_updates"
  job_type: run
  inventory: "Hybrid Patch Demo"
  project: "Hybrid Patch Playbooks"
  playbook: "playbooks/patch_workflow.yml"
  credentials:
    - "Windows Machine Credential"
    - "Azure Service Principal"
  extra_vars: |
    phase_override: patch_only
  ask_variables_on_launch: true
  execution_environment: "ee-windows-patching"

- name: "Post-Change Verify"
  description: "Verify host health after patching; post KB diff and risk flags to Jira"
  job_type: run
  inventory: "Hybrid Patch Demo"
  project: "Hybrid Patch Playbooks"
  playbook: "playbooks/patch_workflow.yml"
  credentials:
    - "Windows Machine Credential"
    - "Jira API Token"
  extra_vars: |
    phase_override: verify_only
  ask_variables_on_launch: true
  execution_environment: "ee-windows-patching"

- name: "Rollback Patch"
  description: "Uninstall applied KBs and optionally restore Azure snapshot"
  job_type: run
  inventory: "Hybrid Patch Demo"
  project: "Hybrid Patch Playbooks"
  playbook: "playbooks/rollback.yml"
  credentials:
    - "Windows Machine Credential"
    - "Azure Service Principal"
    - "Jira API Token"
  ask_variables_on_launch: true
  execution_environment: "ee-windows-patching"

- name: "WinRM Connectivity Test"
  description: "Pre-demo connectivity test – win_ping all demo hosts"
  job_type: check
  inventory: "Hybrid Patch Demo"
  project: "Hybrid Patch Playbooks"
  playbook: "playbooks/test_winrm.yml"
  credentials:
    - "Windows Machine Credential"
  execution_environment: "ee-windows-patching"

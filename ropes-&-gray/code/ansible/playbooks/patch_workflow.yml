---
# ansible/playbooks/patch_workflow.yml
# Three-phase workflow: pre-check → patch → verify
# Triggered by AAP Hybrid Patch Workflow template (via EDA rulebook)
#
# Required extra_vars (from EDA event or AAP survey):
#   jira_ticket_id   : e.g. CHG-1042
#   target_hosts     : inventory group (default: windows)
#   dry_run          : true/false
#   risk_level       : Low / Medium / High  (informational, used in Jira comment)

- name: "Phase 1 | Pre-change state capture"
  hosts: "{{ target_hosts | default('windows') }}"
  gather_facts: true
  vars:
    dry_run: "{{ dry_run | default(false) | bool }}"
  roles:
    - role: ../roles/pre_change_snapshot

- name: "Phase 2 | Patch Windows security updates"
  hosts: "{{ target_hosts | default('windows') }}"
  gather_facts: false
  vars:
    dry_run: "{{ dry_run | default(false) | bool }}"
  roles:
    - role: ../roles/patch_windows_security_updates

- name: "Phase 3 | Post-change verification and Jira update"
  hosts: "{{ target_hosts | default('windows') }}"
  gather_facts: true
  vars:
    dry_run: "{{ dry_run | default(false) | bool }}"
  roles:
    - role: ../roles/post_change_verify

---
# ansible/playbooks/test_winrm.yml
# Pre-demo connectivity check. Run this before every demo session.
# Expected: all hosts return SUCCESS.
- name: "WinRM connectivity test"
  hosts: "{{ target_hosts | default('windows') }}"
  gather_facts: false
  tasks:
    - name: "Ping via WinRM"
      ansible.windows.win_ping:

    - name: "OS version"
      ansible.windows.win_shell: "[System.Environment]::OSVersion.VersionString"
      register: os_ver
      changed_when: false

    - name: "Disk space"
      ansible.windows.win_shell: |
        Get-PSDrive C | Select-Object Used, Free |
        ForEach-Object { "Used: $([math]::Round($_.Used/1GB,1))GB  Free: $([math]::Round($_.Free/1GB,1))GB" }
      register: disk_info
      changed_when: false

    - name: "Report"
      ansible.builtin.debug:
        msg:
          - "Host   : {{ inventory_hostname }} ({{ ansible_host }})"
          - "OS     : {{ os_ver.stdout | trim }}"
          - "Disk   : {{ disk_info.stdout | trim }}"
          - "Status : READY"

---
# ansible/playbooks/test_winrm.yml
# Quick connectivity and credential test – run this before the demo.

- name: "CONNECTIVITY TEST | Verify WinRM reachability"
  hosts: "{{ target_hosts | default('windows') }}"
  gather_facts: false

  tasks:
    - name: "TEST | WinRM ping"
      ansible.windows.win_ping:

    - name: "TEST | Get OS version"
      ansible.windows.win_shell: |
        [System.Environment]::OSVersion.VersionString
      register: os_ver

    - name: "TEST | Report"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) is reachable. OS: {{ os_ver.stdout | trim }}"

---
# ansible/group_vars/windows.yml
# Sensitive values injected at runtime via AAP vault credentials.
# Defaults here are for local testing only.

# WinRM – override with AAP Machine credential in production
ansible_password: "{{ vault_windows_password | default(lookup('env','WIN_PASS') | default('DemoP@ssw0rd2024!')) }}"

# Jira – injected by the Jira API Token custom credential
jira_base_url:   "{{ jira_base_url | default('https://iisl.atlassian.net') }}"
jira_project_key: "CHG"
jira_api_token:  "{{ jira_api_token | default('') }}"
jira_user_email: "{{ jira_user_email | default('') }}"

# Jira status transitions (must match your workflow status names exactly)
jira_status_pending_qa:          "Pending QA"
jira_status_rollback_requested:  "Rollback Requested"
jira_status_resolved:            "Resolved"

# Azure
azure_subscription_id: "{{ vault_azure_subscription_id | default(lookup('env','TF_VAR_azure_subscription_id') | default('')) }}"
azure_resource_group:  "rg-patch-demo"
azure_location:        "uksouth"

# Azure Update Manager – query for approved KBs
aum_query_enabled: true

# Patch settings
patch_reboot_timeout:    900
patch_category:          "SecurityUpdates"
patch_max_concurrency:   1       # Single target in demo; increase for production

# Snapshot
azure_snapshot_enabled: true
azure_snapshot_prefix:  "pre-patch"

# Rollback
rollback_on_failure: true

# Risk thresholds
risk_uptime_warning_days: 60    # Flag if VM uptime > 60 days before patching
risk_pending_updates_warn: 20   # Flag if > 20 pending updates

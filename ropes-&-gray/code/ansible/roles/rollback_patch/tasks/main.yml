---
# roles/rollback_patch/tasks/main.yml
# Triggered by AAP workflow on_failure edge OR Jira "Rollback Requested" transition.
# Uninstalls newly applied KBs, reboots, re-verifies, posts result to Jira,
# then transitions ticket to "Resolved".
# If no KBs were installed (nothing to rollback), posts informational comment
# and still transitions to Resolved.

- name: "ROLLBACK | Record start time"
  ansible.builtin.set_fact:
    rollback_start: "{{ ansible_date_time.iso8601 }}"

- name: "ROLLBACK | Load KB list from VM if not provided"
  when: newly_installed_kbs is not defined or (newly_installed_kbs | length) == 0
  block:
    - name: "ROLLBACK | Read persisted KB list from VM"
      ansible.windows.win_shell: |
        if (Test-Path 'C:\Windows\Temp\ansible_last_patch_kbs.json') {
          Get-Content 'C:\Windows\Temp\ansible_last_patch_kbs.json' -Raw
        } else {
          Write-Output '[]'
        }
      register: persisted_kbs_raw
      changed_when: false

    - name: "ROLLBACK | Set newly_installed_kbs from persisted file"
      ansible.builtin.set_fact:
        newly_installed_kbs: "{{ persisted_kbs_raw.stdout | from_json }}"

# ── Handle case: nothing to rollback ──────────────────────────────────────────
- name: "ROLLBACK | Check if there are KBs to rollback"
  ansible.builtin.set_fact:
    rollback_has_kbs: "{{ newly_installed_kbs is defined and (newly_installed_kbs | length) > 0 }}"

- name: "ROLLBACK | Nothing to rollback — set state"
  when: not rollback_has_kbs
  ansible.builtin.set_fact:
    rollback_state:
      timestamp:         "{{ rollback_start }}"
      kbs_targeted:      []
      kbs_failed:        []
      kbs_still_present: []
      verdict:           "NO_CHANGES"

- name: "ROLLBACK | Nothing to rollback — build Jira comment"
  when: not rollback_has_kbs
  ansible.builtin.set_fact:
    rollback_jira_body: |
      ════════════════════════════════════════════════════
       ROLLBACK REPORT — NO ACTION REQUIRED
      ════════════════════════════════════════════════════
      Ticket    : {{ jira_ticket_id | default('N/A') }}
      Host      : {{ inventory_hostname }}
      Timestamp : {{ rollback_start }}
      Verdict   : NO CHANGES TO ROLLBACK

      The previous patch run did not install any new KBs on this system.
      No rollback action was necessary. System state is unchanged.

      ────────────────────────────────────────────────────
       NEXT ACTION
      ────────────────────────────────────────────────────
      Ticket will be transitioned to Resolved.
      No further action required.
      ════════════════════════════════════════════════════

# ── Perform actual rollback if KBs exist ──────────────────────────────────────
- name: "ROLLBACK | Uninstall each KB"
  when: rollback_has_kbs
  ansible.windows.win_shell: |
    $kb = "{{ item }}"
    $kbNum = $kb.Replace('KB','').Replace('kb','')
    $result = Start-Process -FilePath 'wusa.exe' `
      -ArgumentList "/uninstall /kb:$kbNum /quiet /norestart" `
      -Wait -PassThru
    [PSCustomObject]@{ KB = $kb; ExitCode = $result.ExitCode } | ConvertTo-Json
  loop: "{{ newly_installed_kbs }}"
  register: kb_uninstall_results
  ignore_errors: true

- name: "ROLLBACK | Identify failed uninstalls"
  when: rollback_has_kbs
  ansible.builtin.set_fact:
    rollback_failed_kbs: >-
      {{
        kb_uninstall_results.results |
        selectattr('rc', 'ne', 0) |
        map(attribute='item') | list
      }}

- name: "ROLLBACK | Reboot after KB removal"
  when: rollback_has_kbs
  ansible.windows.win_reboot:
    msg: "Ansible rollback reboot – {{ jira_ticket_id | default('no-ticket') }}"
    reboot_timeout: "{{ patch_reboot_timeout | default(900) }}"
    post_reboot_delay: 60

- name: "ROLLBACK | Wait for WinRM to recover"
  when: rollback_has_kbs
  ansible.builtin.wait_for_connection:
    delay: 30
    sleep: 10
    timeout: 300

- name: "ROLLBACK | Verify KBs were removed"
  when: rollback_has_kbs
  ansible.windows.win_shell: |
    Get-HotFix | Select-Object HotFixID | ConvertTo-Json -Depth 2
  register: post_rollback_kbs_raw
  changed_when: false

- name: "ROLLBACK | Parse post-rollback KB list"
  when: rollback_has_kbs
  ansible.builtin.set_fact:
    post_rollback_kbs: "{{ post_rollback_kbs_raw.stdout | from_json | map(attribute='HotFixID') | list }}"

- name: "ROLLBACK | Confirm KBs are absent"
  when: rollback_has_kbs
  ansible.builtin.set_fact:
    kbs_still_present: >-
      {{
        newly_installed_kbs | difference(rollback_failed_kbs) |
        intersect(post_rollback_kbs)
      }}

- name: "ROLLBACK | Build rollback summary"
  when: rollback_has_kbs
  ansible.builtin.set_fact:
    rollback_state:
      timestamp:         "{{ rollback_start }}"
      kbs_targeted:      "{{ newly_installed_kbs }}"
      kbs_failed:        "{{ rollback_failed_kbs }}"
      kbs_still_present: "{{ kbs_still_present }}"
      verdict:           "{{ 'PARTIAL' if (rollback_failed_kbs or kbs_still_present) else 'SUCCESS' }}"

- name: "ROLLBACK | Build Jira rollback comment"
  when: rollback_has_kbs
  ansible.builtin.set_fact:
    rollback_jira_body: |
      ════════════════════════════════════════════════════
       ROLLBACK REPORT
      ════════════════════════════════════════════════════
      Ticket    : {{ jira_ticket_id | default('N/A') }}
      Host      : {{ inventory_hostname }}
      Timestamp : {{ rollback_start }}
      Verdict   : {{ rollback_state.verdict }}

      ────────────────────────────────────────────────────
       KB REMOVAL DETAILS
      ────────────────────────────────────────────────────
      KBs targeted     : {{ rollback_state.kbs_targeted | join(', ') | default('none') }}
      KBs failed       : {{ rollback_state.kbs_failed | join(', ') | default('none') }}
      KBs still present: {{ rollback_state.kbs_still_present | join(', ') | default('none') }}

      System rebooted: yes

      ────────────────────────────────────────────────────
       NEXT ACTION
      ────────────────────────────────────────────────────
      {% if rollback_state.verdict == 'SUCCESS' %}
      All patches successfully removed. Ticket transitioning to Resolved.
      {% else %}
      PARTIAL rollback — some KBs could not be removed.
      QA engineer: verify system state and re-escalate if needed.
      {% endif %}
      ════════════════════════════════════════════════════

# ── Post rollback result to Jira ─────────────────────────────────────────────
- name: "ROLLBACK | Post comment to Jira"
  when: jira_ticket_id is defined and jira_ticket_id | length > 0
  ansible.builtin.uri:
    url: "{{ jira_base_url }}/rest/api/3/issue/{{ jira_ticket_id }}/comment"
    method: POST
    headers:
      Authorization: "Basic {{ (jira_user_email + ':' + jira_api_token) | b64encode }}"
      Content-Type:  "application/json"
    body_format: json
    body:
      body:
        type: doc
        version: 1
        content:
          - type: codeBlock
            content:
              - type: text
                text: "{{ rollback_jira_body }}"
    status_code: [201]
  delegate_to: localhost

- name: "ROLLBACK | Get available Jira transitions"
  when: jira_ticket_id is defined and jira_ticket_id | length > 0
  ansible.builtin.uri:
    url: "{{ jira_base_url }}/rest/api/3/issue/{{ jira_ticket_id }}/transitions"
    method: GET
    headers:
      Authorization: "Basic {{ (jira_user_email + ':' + jira_api_token) | b64encode }}"
    status_code: [200]
  register: rollback_transitions
  delegate_to: localhost

- name: "ROLLBACK | Execute Jira transition to Resolved"
  when:
    - jira_ticket_id is defined and jira_ticket_id | length > 0
    - rollback_transitions is not failed
    - rb_transition_id | length > 0
  vars:
    rb_transition_id: >-
      {{
        rollback_transitions.json.transitions |
        selectattr('name', 'equalto', jira_status_resolved | default('Resolved')) |
        map(attribute='id') | first | default('')
      }}
  ansible.builtin.uri:
    url: "{{ jira_base_url }}/rest/api/3/issue/{{ jira_ticket_id }}/transitions"
    method: POST
    headers:
      Authorization: "Basic {{ (jira_user_email + ':' + jira_api_token) | b64encode }}"
      Content-Type:  "application/json"
    body_format: json
    body:
      transition:
        id: "{{ rb_transition_id }}"
    status_code: [204]
  delegate_to: localhost

- name: "ROLLBACK | Summary"
  ansible.builtin.debug:
    msg: |
      Rollback {{ rollback_state.verdict }} on {{ inventory_hostname }}
        KBs targeted: {{ rollback_state.kbs_targeted | join(', ') | default('none') }}
        Failed      : {{ rollback_state.kbs_failed | join(', ') | default('none') }}
        Jira        : {{ jira_ticket_id | default('N/A') }} → Resolved

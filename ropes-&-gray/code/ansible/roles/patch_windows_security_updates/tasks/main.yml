---
# roles/patch_windows_security_updates/tasks/main.yml
- name: "PATCH | Abort if pre-change state missing"
  ansible.builtin.assert:
    that: pre_change_state is defined
    fail_msg: "Run pre_change_snapshot role first."

- name: "PATCH | Abort if pending reboot already exists"
  ansible.builtin.fail:
    msg: "Pending reboot detected before patching on {{ inventory_hostname }}. Resolve first."
  when: pre_change_state.pending_reboot | bool

- name: "PATCH | Install Windows security updates"
  ansible.windows.win_updates:
    category_names: [SecurityUpdates, CriticalUpdates]
    state: installed
    reboot: false
    log_path: "C:\\Windows\\Temp\\ansible_patch_{{ ansible_date_time.date }}.log"
  register: patch_result
  check_mode: "{{ dry_run | default(false) | bool }}"

- name: "PATCH | Record basic results"
  ansible.builtin.set_fact:
    patch_reboot_required: "{{ patch_result.reboot_required | default(false) }}"
    patch_failed_count:    "{{ patch_result.failed_update_count | default(0) }}"

- name: "PATCH | Extract actual KB IDs from update titles"
  ansible.builtin.set_fact:
    newly_installed_kbs: >-
      {{
        patch_result.updates | default({}) | dict2items |
        selectattr('value.installed', 'equalto', true) |
        map(attribute='key') |
        map('regex_findall', 'KB\d+') | flatten | unique | list
      }}

- name: "PATCH | Persist installed KBs to VM for rollback"
  when: newly_installed_kbs | length > 0
  ansible.windows.win_copy:
    content: "{{ newly_installed_kbs | to_json }}"
    dest: 'C:\Windows\Temp\ansible_last_patch_kbs.json'

- name: "PATCH | Fail if any updates failed"
  ansible.builtin.fail:
    msg: "{{ patch_failed_count }} update(s) failed on {{ inventory_hostname }}."
  when: (patch_failed_count | int) > 0

- name: "PATCH | Reboot if required"
  when: patch_reboot_required | bool and not (dry_run | default(false) | bool)
  block:
    - name: "PATCH | Reboot"
      ansible.windows.win_reboot:
        msg: "Ansible patch reboot – {{ jira_ticket_id | default('no-ticket') }}"
        reboot_timeout: "{{ patch_reboot_timeout | default(900) }}"
        post_reboot_delay: 60
      register: reboot_result

    - name: "PATCH | Wait for WinRM"
      ansible.builtin.wait_for_connection:
        delay: 30
        sleep: 10
        timeout: 300

- name: "PATCH | Summary"
  ansible.builtin.debug:
    msg: |
      Patching complete on {{ inventory_hostname }}
        KBs installed  : {{ newly_installed_kbs | length }}
        KBs applied    : {{ newly_installed_kbs | join(', ') | default('none') }}
        Reboot required: {{ patch_reboot_required }}
        Rebooted       : {{ reboot_result.rebooted | default(false) }}
        Dry run        : {{ dry_run | default(false) }}

---
# roles/pre_change_snapshot/tasks/main.yml
# Captures full system state before patching.
# Results stored as host facts for use by verify and rollback roles.

- name: "PRE | Timestamp"
  ansible.builtin.set_fact:
    pre_check_timestamp: "{{ ansible_date_time.iso8601 }}"

- name: "PRE | Gather installed KBs"
  ansible.windows.win_shell: |
    Get-HotFix | Select-Object HotFixID, InstalledOn, Description |
    Sort-Object InstalledOn -Descending | ConvertTo-Json -Depth 3
  register: pre_hotfix_raw
  changed_when: false

- name: "PRE | Parse KB list"
  ansible.builtin.set_fact:
    pre_installed_kbs: "{{ pre_hotfix_raw.stdout | from_json }}"

- name: "PRE | Acquire Azure access token for AUM query"
  when:
    - cloud_provider | default('') == 'azure'
    - aum_query_enabled | default(false) | bool
    - _azure_token is not defined
  block:
    - name: "PRE | Check Azure SP credentials for AUM"
      ansible.builtin.set_fact:
        _aum_sp_available: >-
          {{
            (lookup('env', 'AZURE_CLIENT_ID') | default(azure_client_id | default(''), true) | length > 0) and
            (lookup('env', 'AZURE_SECRET') | default(azure_client_secret | default(''), true) | length > 0)
          }}

    - name: "PRE | Get Azure access token for AUM"
      when: _aum_sp_available | bool
      block:
        - name: "PRE | Set Azure SP vars for AUM"
          ansible.builtin.set_fact:
            _azure_client_id: "{{ lookup('env', 'AZURE_CLIENT_ID') | default(azure_client_id, true) }}"
            _azure_client_secret: "{{ lookup('env', 'AZURE_SECRET') | default(azure_client_secret, true) }}"
            _azure_tenant_id: "{{ lookup('env', 'AZURE_TENANT') | default(azure_tenant_id | default('767831fe-e2a4-469a-959b-7763cfd4ecd9'), true) }}"
            _azure_subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') | default(azure_subscription_id, true) }}"
          no_log: true

        - name: "PRE | Fetch Azure token for AUM"
          ansible.builtin.uri:
            url: "https://login.microsoftonline.com/{{ _azure_tenant_id }}/oauth2/v2.0/token"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ _azure_client_id }}"
              client_secret: "{{ _azure_client_secret }}"
              scope: "https://management.azure.com/.default"
            return_content: true
            status_code: [200]
          register: _aum_token_response
          delegate_to: localhost
          no_log: true

        - name: "PRE | Set AUM access token"
          ansible.builtin.set_fact:
            _azure_token: "{{ _aum_token_response.json.access_token }}"
          no_log: true
  rescue:
    - name: "PRE | Azure token fetch failed (non-fatal)"
      ansible.builtin.debug:
        msg: "Could not acquire Azure token for AUM query. AUM assessment will be skipped."

- name: "PRE | Query Azure Update Manager for pending updates"
  when: aum_query_enabled | default(false) | bool and cloud_provider | default('') == 'azure' and _azure_token is defined
  ansible.builtin.uri:
    url: "https://management.azure.com/subscriptions/{{ azure_subscription_id }}/resourceGroups/{{ azure_resource_group }}/providers/Microsoft.Compute/virtualMachines/{{ azure_vm_name | default('vm-win-target') }}/assessPatches?api-version=2024-03-02"
    method: POST
    headers:
      Authorization: "Bearer {{ _azure_token }}"
      Content-Type: "application/json"
    body: "{}"
    return_content: true
    status_code: [200, 202]
  register: aum_assessment
  delegate_to: localhost
  ignore_errors: true

- name: "PRE | Count AUM pending security updates"
  ansible.builtin.set_fact:
    aum_pending_security: >-
      {{
        (aum_assessment.json.properties.availablePatchSummary.criticalAndSecurityPatchCount | default(0)) | int
      }}
  when: aum_assessment is not failed

- name: "PRE | Check pending reboot"
  ansible.windows.win_shell: |
    $reboot = $false
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired',
      'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations'
    )
    foreach ($p in $paths) { if (Test-Path $p) { $reboot = $true } }
    [PSCustomObject]@{ PendingReboot = $reboot } | ConvertTo-Json
  register: pre_reboot_raw
  changed_when: false

- name: "PRE | Parse pending reboot"
  ansible.builtin.set_fact:
    pre_pending_reboot: "{{ (pre_reboot_raw.stdout | from_json).PendingReboot }}"

- name: "PRE | Get system uptime"
  ansible.windows.win_shell: |
    $boot   = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
    $uptime = [int](New-TimeSpan -Start $boot -End (Get-Date)).TotalDays
    [PSCustomObject]@{ LastBoot = $boot.ToString('s'); UptimeDays = $uptime } | ConvertTo-Json
  register: pre_boot_raw
  changed_when: false

- name: "PRE | Parse uptime"
  ansible.builtin.set_fact:
    pre_last_boot:    "{{ (pre_boot_raw.stdout | from_json).LastBoot }}"
    pre_uptime_days:  "{{ (pre_boot_raw.stdout | from_json).UptimeDays }}"

- name: "PRE | Check critical services"
  ansible.windows.win_service_info:
    name: "{{ item }}"
  loop: [wuauserv, W32Time, EventLog, LanmanServer, Spooler]
  register: pre_service_info
  ignore_errors: true

- name: "PRE | Compute risk flags"
  ansible.builtin.set_fact:
    pre_risk_flags: >-
      {{
        (['PENDING_REBOOT_BEFORE_PATCH'] if pre_pending_reboot else []) +
        (['HIGH_UPTIME_' + (pre_uptime_days | string) + 'd'] if (pre_uptime_days | int) > (risk_uptime_warning_days | default(60) | int) else []) +
        (['HIGH_PENDING_UPDATES_' + (aum_pending_security | default(0) | string)] if (aum_pending_security | default(0) | int) > (risk_pending_updates_warn | default(20) | int) else [])
      }}

- name: "PRE | Check Azure SP credentials available"
  ansible.builtin.set_fact:
    azure_sp_available: >-
      {{
        (lookup('env', 'AZURE_CLIENT_ID') | default(azure_client_id | default(''), true) | length > 0) and
        (lookup('env', 'AZURE_SECRET') | default(azure_client_secret | default(''), true) | length > 0)
      }}
  when: cloud_provider | default('') == 'azure' and azure_snapshot_enabled | default(false) | bool

- name: "PRE | Skip snapshot - no Azure credentials"
  ansible.builtin.debug:
    msg: "Skipping Azure snapshot: Service Principal credentials not configured. Set AZURE_CLIENT_ID/AZURE_SECRET via AAP credential or provide azure_client_id/azure_client_secret."
  when:
    - cloud_provider | default('') == 'azure'
    - azure_snapshot_enabled | default(false) | bool
    - not (azure_sp_available | default(false) | bool)

- name: "PRE | Take Azure disk snapshot via REST API"
  when:
    - cloud_provider | default('') == 'azure'
    - azure_snapshot_enabled | default(false) | bool
    - azure_sp_available | default(false) | bool
  block:
    - name: "PRE | Set Azure SP vars from environment"
      ansible.builtin.set_fact:
        _azure_client_id: "{{ lookup('env', 'AZURE_CLIENT_ID') | default(azure_client_id, true) }}"
        _azure_client_secret: "{{ lookup('env', 'AZURE_SECRET') | default(azure_client_secret, true) }}"
        _azure_tenant_id: "{{ lookup('env', 'AZURE_TENANT') | default(azure_tenant_id | default('767831fe-e2a4-469a-959b-7763cfd4ecd9'), true) }}"
        _azure_subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') | default(azure_subscription_id, true) }}"
      no_log: true

    - name: "PRE | Get Azure access token via SP"
      when: _azure_token is not defined
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ _azure_tenant_id }}/oauth2/v2.0/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ _azure_client_id }}"
          client_secret: "{{ _azure_client_secret }}"
          scope: "https://management.azure.com/.default"
        return_content: true
        status_code: [200]
      register: azure_token_response
      delegate_to: localhost
      no_log: true

    - name: "PRE | Set access token"
      when: _azure_token is not defined
      ansible.builtin.set_fact:
        _azure_token: "{{ azure_token_response.json.access_token }}"
      no_log: true

    - name: "PRE | Get VM info for OS disk"
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ _azure_subscription_id }}/resourceGroups/{{ azure_resource_group }}/providers/Microsoft.Compute/virtualMachines/{{ azure_vm_name | default('vm-win-target') }}?api-version=2024-03-02"
        method: GET
        headers:
          Authorization: "Bearer {{ _azure_token }}"
        return_content: true
        status_code: [200]
      register: vm_info
      delegate_to: localhost

    - name: "PRE | Parse OS disk ID"
      ansible.builtin.set_fact:
        _os_disk_name: "{{ vm_info.json.properties.storageProfile.osDisk.name }}"
        _os_disk_id: "{{ vm_info.json.properties.storageProfile.osDisk.managedDisk.id }}"

    - name: "PRE | Create disk snapshot"
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ _azure_subscription_id }}/resourceGroups/{{ azure_resource_group }}/providers/Microsoft.Compute/snapshots/{{ azure_snapshot_prefix }}-{{ inventory_hostname }}-{{ ansible_date_time.date | replace('-','') }}?api-version=2024-03-02"
        method: PUT
        headers:
          Authorization: "Bearer {{ _azure_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          location: "{{ azure_location }}"
          properties:
            creationData:
              createOption: "Copy"
              sourceResourceId: "{{ _os_disk_id }}"
          tags:
            Purpose: "pre-patch"
            Ticket: "{{ jira_ticket_id | default('unknown') }}"
            CreatedBy: "ansible"
            SourceDisk: "{{ _os_disk_name }}"
        return_content: true
        status_code: [200, 201, 202]
      register: snapshot_result
      delegate_to: localhost

    - name: "PRE | Snapshot created successfully"
      ansible.builtin.set_fact:
        snapshot_created: true
        snapshot_name: "{{ azure_snapshot_prefix }}-{{ inventory_hostname }}-{{ ansible_date_time.date | replace('-','') }}"

    - name: "PRE | Log snapshot success"
      ansible.builtin.debug:
        msg: "Azure snapshot created: {{ snapshot_name }} from disk {{ _os_disk_name }}"
  rescue:
    - name: "PRE | Snapshot failed (non-fatal)"
      ansible.builtin.set_fact:
        snapshot_created: false

    - name: "PRE | Log snapshot failure"
      ansible.builtin.debug:
        msg: >-
          Azure snapshot skipped due to error: {{ ansible_failed_result.msg | default('unknown error') }}.
          Patching will continue without a snapshot. To fix, update the Azure SP secret in AAP credential
          'Azure Service Principal - Patch Demo'.

- name: "PRE | Build pre_change_state fact"
  ansible.builtin.set_fact:
    pre_change_state:
      timestamp:       "{{ pre_check_timestamp }}"
      installed_kbs:   "{{ pre_installed_kbs }}"
      kb_count:        "{{ pre_installed_kbs | length }}"
      pending_reboot:  "{{ pre_pending_reboot }}"
      last_boot:       "{{ pre_last_boot }}"
      uptime_days:     "{{ pre_uptime_days }}"
      risk_flags:      "{{ pre_risk_flags }}"
      aum_pending:     "{{ aum_pending_security | default('N/A') }}"
      snapshot:        "{{ snapshot_name | default('none') }}"
      snapshot_created: "{{ snapshot_created | default(false) }}"

- name: "PRE | Summary"
  ansible.builtin.debug:
    msg: |
      Pre-change state captured for {{ inventory_hostname }}
        KBs installed : {{ pre_change_state.kb_count }}
        Uptime (days) : {{ pre_change_state.uptime_days }}
        Pending reboot: {{ pre_change_state.pending_reboot }}
        AUM pending   : {{ pre_change_state.aum_pending }}
        Risk flags    : {{ pre_change_state.risk_flags | join(', ') | default('none') }}

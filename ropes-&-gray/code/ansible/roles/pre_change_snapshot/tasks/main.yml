---
# roles/pre_change_snapshot/tasks/main.yml
# Captures full system state before patching.
# Results stored as host facts for use by verify and rollback roles.

- name: "PRE | Timestamp"
  ansible.builtin.set_fact:
    pre_check_timestamp: "{{ ansible_date_time.iso8601 }}"

- name: "PRE | Gather installed KBs"
  ansible.windows.win_shell: |
    Get-HotFix | Select-Object HotFixID, InstalledOn, Description |
    Sort-Object InstalledOn -Descending | ConvertTo-Json -Depth 3
  register: pre_hotfix_raw
  changed_when: false

- name: "PRE | Parse KB list"
  ansible.builtin.set_fact:
    pre_installed_kbs: "{{ pre_hotfix_raw.stdout | from_json }}"

- name: "PRE | Query Azure Update Manager for pending updates"
  when: aum_query_enabled | default(false) | bool and cloud_provider == 'azure'
  ansible.builtin.uri:
    url: >-
      https://management.azure.com/subscriptions/{{ azure_subscription_id }}/
      resourceGroups/{{ azure_resource_group }}/providers/Microsoft.Compute/
      virtualMachines/{{ inventory_hostname }}/assessPatches?api-version=2022-11-01
    method: POST
    headers:
      Authorization: "Bearer {{ azure_access_token | default('') }}"
      Content-Type: "application/json"
    body: "{}"
    return_content: true
    status_code: [200, 202]
  register: aum_assessment
  delegate_to: localhost
  ignore_errors: true

- name: "PRE | Count AUM pending security updates"
  ansible.builtin.set_fact:
    aum_pending_security: >-
      {{
        (aum_assessment.json.properties.availablePatchSummary.criticalAndSecurityPatchCount | default(0)) | int
      }}
  when: aum_assessment is not failed

- name: "PRE | Check pending reboot"
  ansible.windows.win_shell: |
    $reboot = $false
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired',
      'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations'
    )
    foreach ($p in $paths) { if (Test-Path $p) { $reboot = $true } }
    [PSCustomObject]@{ PendingReboot = $reboot } | ConvertTo-Json
  register: pre_reboot_raw
  changed_when: false

- name: "PRE | Parse pending reboot"
  ansible.builtin.set_fact:
    pre_pending_reboot: "{{ (pre_reboot_raw.stdout | from_json).PendingReboot }}"

- name: "PRE | Get system uptime"
  ansible.windows.win_shell: |
    $boot   = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
    $uptime = [int](New-TimeSpan -Start $boot -End (Get-Date)).TotalDays
    [PSCustomObject]@{ LastBoot = $boot.ToString('s'); UptimeDays = $uptime } | ConvertTo-Json
  register: pre_boot_raw
  changed_when: false

- name: "PRE | Parse uptime"
  ansible.builtin.set_fact:
    pre_last_boot:    "{{ (pre_boot_raw.stdout | from_json).LastBoot }}"
    pre_uptime_days:  "{{ (pre_boot_raw.stdout | from_json).UptimeDays }}"

- name: "PRE | Check critical services"
  ansible.windows.win_service_info:
    name: "{{ item }}"
  loop: [wuauserv, W32Time, EventLog, LanmanServer, Spooler]
  register: pre_service_info
  ignore_errors: true

- name: "PRE | Compute risk flags"
  ansible.builtin.set_fact:
    pre_risk_flags: >-
      {{
        (['PENDING_REBOOT_BEFORE_PATCH'] if pre_pending_reboot else []) +
        (['HIGH_UPTIME_' + (pre_uptime_days | string) + 'd'] if (pre_uptime_days | int) > (risk_uptime_warning_days | default(60) | int) else []) +
        (['HIGH_PENDING_UPDATES_' + (aum_pending_security | default(0) | string)] if (aum_pending_security | default(0) | int) > (risk_pending_updates_warn | default(20) | int) else [])
      }}

- name: "PRE | Take Azure disk snapshot via CLI"
  when: cloud_provider == 'azure' and azure_snapshot_enabled | default(false) | bool
  block:
    - name: "PRE | Get OS disk name"
      ansible.builtin.command: >
        az vm show
        --resource-group {{ azure_resource_group }}
        --name {{ azure_vm_name | default('vm-win-target') }}
        --query "storageProfile.osDisk.name" -o tsv
      register: os_disk_name
      delegate_to: localhost
      changed_when: false

    - name: "PRE | Create snapshot"
      ansible.builtin.command: >
        az snapshot create
        --resource-group {{ azure_resource_group }}
        --name "{{ azure_snapshot_prefix }}-{{ inventory_hostname }}-{{ ansible_date_time.date | replace('-','') }}"
        --source "{{ os_disk_name.stdout | trim }}"
        --tags Purpose=pre-patch Ticket={{ jira_ticket_id | default('unknown') }} CreatedBy=ansible
      register: snapshot_result
      delegate_to: localhost

    - name: "PRE | Snapshot created"
      ansible.builtin.debug:
        msg: "Snapshot created: {{ azure_snapshot_prefix }}-{{ inventory_hostname }}-{{ ansible_date_time.date | replace('-','') }}"
  rescue:
    - name: "PRE | Snapshot failed (non-fatal)"
      ansible.builtin.debug:
        msg: "Azure snapshot creation failed: {{ ansible_failed_result.msg | default('unknown error') }}. Continuing without snapshot."

- name: "PRE | Build pre_change_state fact"
  ansible.builtin.set_fact:
    pre_change_state:
      timestamp:       "{{ pre_check_timestamp }}"
      installed_kbs:   "{{ pre_installed_kbs }}"
      kb_count:        "{{ pre_installed_kbs | length }}"
      pending_reboot:  "{{ pre_pending_reboot }}"
      last_boot:       "{{ pre_last_boot }}"
      uptime_days:     "{{ pre_uptime_days }}"
      risk_flags:      "{{ pre_risk_flags }}"
      aum_pending:     "{{ aum_pending_security | default('N/A') }}"

- name: "PRE | Summary"
  ansible.builtin.debug:
    msg: |
      Pre-change state captured for {{ inventory_hostname }}
        KBs installed : {{ pre_change_state.kb_count }}
        Uptime (days) : {{ pre_change_state.uptime_days }}
        Pending reboot: {{ pre_change_state.pending_reboot }}
        AUM pending   : {{ pre_change_state.aum_pending }}
        Risk flags    : {{ pre_change_state.risk_flags | join(', ') | default('none') }}

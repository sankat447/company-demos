---
# roles/post_change_verify/tasks/main.yml
# Verifies host health post-patch, computes KB diff, posts full Jira comment,
# and transitions the Jira ticket to "Pending QA" automatically.

- name: "VERIFY | Timestamp"
  ansible.builtin.set_fact:
    post_check_timestamp: "{{ ansible_date_time.iso8601 }}"

- name: "VERIFY | Gather post-patch KB list"
  ansible.windows.win_shell: |
    Get-HotFix | Select-Object HotFixID, InstalledOn, Description |
    Sort-Object InstalledOn -Descending | ConvertTo-Json -Depth 3
  register: post_hotfix_raw
  changed_when: false

- name: "VERIFY | Parse post-patch KBs"
  ansible.builtin.set_fact:
    post_installed_kbs: "{{ post_hotfix_raw.stdout | from_json }}"

- name: "VERIFY | Compute KB diff (net new this run)"
  ansible.builtin.set_fact:
    kb_diff_added: >-
      {{
        post_installed_kbs | map(attribute='HotFixID') | list |
        difference(pre_change_state.installed_kbs | map(attribute='HotFixID') | list)
      }}

- name: "VERIFY | Check critical services"
  ansible.windows.win_service_info:
    name: "{{ item }}"
  loop: [wuauserv, W32Time, EventLog, LanmanServer, Spooler]
  register: post_service_check
  ignore_errors: true

- name: "VERIFY | Identify stopped services"
  ansible.builtin.set_fact:
    stopped_critical_services: >-
      {{
        post_service_check.results |
        selectattr('services', 'defined') |
        map(attribute='services') | flatten |
        selectattr('state', 'equalto', 'stopped') |
        map(attribute='name') | list
      }}

- name: "VERIFY | Check pending reboot post-patch"
  ansible.windows.win_shell: |
    $reboot = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired'
    [PSCustomObject]@{ PendingReboot = $reboot } | ConvertTo-Json
  register: post_reboot_raw
  changed_when: false

- name: "VERIFY | Parse post-patch reboot"
  ansible.builtin.set_fact:
    post_pending_reboot: "{{ (post_reboot_raw.stdout | from_json).PendingReboot }}"

- name: "VERIFY | Probe application health endpoint (if web server)"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}/healthz"
    method: GET
    status_code: [200, 404]
    timeout: 10
  register: app_health
  delegate_to: localhost
  ignore_errors: true

- name: "VERIFY | Build risk flags"
  ansible.builtin.set_fact:
    post_risk_flags: >-
      {{
        (['STOPPED_SERVICES: ' + stopped_critical_services | join(', ')] if stopped_critical_services else []) +
        (['PENDING_REBOOT_AFTER_PATCH'] if post_pending_reboot else []) +
        (['APP_HEALTH_PROBE_FAILED'] if (app_health is defined and app_health.status | default(0) not in [200, 404, -1]) else [])
      }}

- name: "VERIFY | Set overall verdict"
  ansible.builtin.set_fact:
    post_change_state:
      timestamp:           "{{ post_check_timestamp }}"
      installed_kbs_count: "{{ post_installed_kbs | length }}"
      kb_diff_added:       "{{ kb_diff_added }}"
      stopped_services:    "{{ stopped_critical_services }}"
      pending_reboot:      "{{ post_pending_reboot }}"
      risk_flags:          "{{ post_risk_flags }}"
      verdict:             "{{ 'FAIL' if (stopped_critical_services or post_risk_flags) else 'PASS' }}"

# ── Render and post Jira comment ──────────────────────────────────────────────
- name: "VERIFY | Render Jira comment"
  ansible.builtin.template:
    src: jira_comment.j2
    dest: "/tmp/jira_comment_{{ inventory_hostname }}.txt"
  delegate_to: localhost

- name: "VERIFY | Read rendered comment"
  ansible.builtin.slurp:
    src: "/tmp/jira_comment_{{ inventory_hostname }}.txt"
  register: jira_comment_b64
  delegate_to: localhost

- name: "VERIFY | Post comment to Jira ticket"
  when: jira_ticket_id is defined and jira_ticket_id | length > 0 and jira_api_token is defined and jira_api_token | length > 0
  ansible.builtin.uri:
    url: "{{ jira_base_url | default('https://iisl.atlassian.net') }}/rest/api/3/issue/{{ jira_ticket_id }}/comment"
    method: POST
    headers:
      Authorization: "Basic {{ ((jira_user_email | default('skumar@iisl.com')) + ':' + jira_api_token) | b64encode }}"
      Content-Type:  "application/json"
    body_format: json
    body:
      body:
        type: doc
        version: 1
        content:
          - type: codeBlock
            content:
              - type: text
                text: "{{ jira_comment_b64.content | b64decode }}"
    status_code: [201]
  delegate_to: localhost

# ── Transition ticket to "Pending QA" (or direct to Resolved on PASS) ────────
- name: "VERIFY | Get available Jira transitions"
  when: jira_ticket_id is defined and jira_ticket_id | length > 0
  ansible.builtin.uri:
    url: "{{ jira_base_url | default('https://iisl.atlassian.net') }}/rest/api/3/issue/{{ jira_ticket_id }}/transitions"
    method: GET
    headers:
      Authorization: "Basic {{ (jira_user_email + ':' + jira_api_token) | b64encode }}"
    return_content: true
    status_code: [200]
  register: jira_transitions
  delegate_to: localhost

- name: "VERIFY | Transition ticket to Pending QA"
  when:
    - jira_ticket_id is defined and jira_ticket_id | length > 0
    - post_change_state.verdict == 'PASS'
    - jira_transitions is not failed
    - transition_id | length > 0
  vars:
    transition_id: >-
      {{
        jira_transitions.json.transitions |
        selectattr('name', 'equalto', jira_status_pending_qa | default('Pending QA')) |
        map(attribute='id') | first | default('')
      }}
  ansible.builtin.uri:
    url: "{{ jira_base_url | default('https://iisl.atlassian.net') }}/rest/api/3/issue/{{ jira_ticket_id }}/transitions"
    method: POST
    headers:
      Authorization: "Basic {{ (jira_user_email + ':' + jira_api_token) | b64encode }}"
      Content-Type:  "application/json"
    body_format: json
    body:
      transition:
        id: "{{ transition_id }}"
    status_code: [204]
  delegate_to: localhost

- name: "VERIFY | Fail playbook if verdict is FAIL (triggers rollback edge in AAP workflow)"
  ansible.builtin.fail:
    msg: |
      Post-change verification FAILED on {{ inventory_hostname }}.
      Risk flags: {{ post_risk_flags | join(', ') }}
      Stopped services: {{ stopped_critical_services | join(', ') | default('none') }}
  when: post_change_state.verdict == 'FAIL'

- name: "VERIFY | Summary"
  ansible.builtin.debug:
    msg: |
      Verify: {{ post_change_state.verdict }} on {{ inventory_hostname }}
        KBs added    : {{ kb_diff_added | join(', ') | default('none') }}
        Risk flags   : {{ post_risk_flags | join(', ') | default('none') }}
        Jira updated : {{ jira_ticket_id | default('N/A') }} → Pending QA

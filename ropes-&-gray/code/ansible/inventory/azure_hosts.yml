---
# ansible/inventory/azure_hosts.yml
# Single Azure Windows target.
# Replace AZURE_WIN_IP with output from: terraform -chdir=iac/terraform output azure_windows_public_ip

all:
  children:
    windows:
      hosts:
        win-azure-01:
          ansible_host: "AZURE_WIN_IP"
          ansible_user: demoAdmin
          cloud_provider: azure
          azure_resource_group: "rg-patch-demo"
          patch_group: security_updates
          jira_ticket_id: ""       # Injected at runtime by EDA/survey

      vars:
        ansible_connection: winrm
        ansible_winrm_transport: basic
        ansible_winrm_scheme: https
        ansible_winrm_port: 5986
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: 120
        ansible_winrm_read_timeout_sec: 150
